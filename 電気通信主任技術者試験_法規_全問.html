して計算するものとする。</p>\n<p class=\"opt\">③ 有線電気通信設備に使用する電線は、絶縁電線又は強電流電線でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">④ 屋内電線は、屋内強電流電線との離隔距離が６０センチメートル以下となるときは、総務省令で定めるところによらなければ、設置してはならない。</p>\n<p class=\"opt\">⑤ 屋内電線(光ファイバを除く。)と大地との間及び屋内電線相互間の絶縁抵抗は、直流１００ボルトの電圧で測定した値で、２メグオーム以上でなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令に規定する｢架空電線と他人の設置した架空電線等との関係｣又は有線電気通信設備令施行規則に規定する｢架空電線の高さ｣について述べた次の文章のうち、誤っているものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 架空電線は、他人の建造物との離隔距離が６０センチメートル以下となるように設置してはならない。ただし、その他人の承諾を得たときは、この限りでない。</p>\n<p class=\"opt\">② 架空電線の高さは、架空電線が道路上にあるときは、横断歩道橋の上にあるときを除き、路面から５メートル(交通に支障を及ぼすおそれが少ない場合で工事上やむを得ないときは、歩道と車道との区別がある道路の歩道上においては、２.５メートル、その他の道路上においては、４.５メートル)以上でなければならない。</p>\n<p class=\"opt\">③ 架空電線の高さは、架空電線が鉄道又は軌道を横断するときは、軌条面から６メートル(車両の運行に支障を及ぼすおそれがない高さが６メートルより低い場合は、その高さ)以上でなければならない。</p>\n<p class=\"opt\">④ 架空電線の高さは、架空電線が横断歩道橋の上にあるときは、その路面から３メートル以上でなければならない。</p>\n<p class=\"opt\">⑤ 架空電線の高さは、架空電線が河川を横断するときは、舟行に支障を及ぼすおそれがない高さでなければならない。</p>"}, {"tag": "R5-2", "title": "令和５年度 第２回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、有線電気通信法に規定する｢設備の検査等｣について述べたものである。同法の規定に照らして、 □内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)総務大臣は、この法律の (ア) において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。立入検査をする職員は、その身分を示す証明書を携帯し、関係人に提示しなければならない。この検査の権限は、 (イ) のために認められたものと解してはならない。</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 規定の範囲内</p>\n<p class=\"opt\">② 施行に必要な限度</p>\n<p class=\"opt\">③ 権利の行使</p>\n<p class=\"opt\">④ 税務調査</p>\n<p class=\"opt\">⑤ 目的達成の過程</p>\n<p class=\"opt\">⑥ 犯罪捜査</p>\n<p class=\"opt\">⑦ 処分の執行</p>\n<p class=\"opt\">⑧ 公平かつ効率的運用</p>\n<p class=\"opt\">⑨ 罰則の適用</p>\n<p class=\"opt\">⑩ 規定に違反した場合</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 有線電気通信法に規定する｢本邦外にわたる有線電気通信設備｣、｢有線電気通信設備の届出｣及び｢非常事態における通信の確保｣について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者がその事業の用に供する設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、期間を定めて臨時に設置するときは、この限りでない。</p>\n<p class=\"stmt\">Ｂ 有線電気通信設備(その設置について総務大臣に届け出る必要のないものを除く。)を設置しようとする者は、有線電気通信の方式の別、設備の設置の場所及び設備の概要を記載した書類を添えて、設置の工事の開始の日の１０日前まで(工事を要しないときは、設置の日から１０日以内)に、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"stmt\">Ｃ 総務大臣は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、有線電気通信設備を設置した者に対し、災害の予防若しくは救援、交通、通信若しくは電力の供給の確保若しくは秩序の維持のために必要な通信を行い、又はこれらの通信を行うためその有線電気通信設備を他の者に使用させ、若しくはこれを他の有線電気通信設備に接続すべきことを命ずることができる。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語について述べた次の文章のうち、誤っているものは、(エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電線とは、有線電気通信(送信の場所と受信の場所との間の線条その他の導体を利用して、電磁的方式により信号を行うことを含む。)を行うための導体(絶縁物又は保護物で被覆されている場合は、これらの物を含む。)であって、強電流電線に重畳される通信回線に係るもの以外のものをいう。</p>\n<p class=\"opt\">② 線路とは、送信の場所と受信の場所との間に設置されている電線及びこれに係る中継器その他の機器(これらを支持し、又は保蔵するための工作物を含む。)をいう。</p>\n<p class=\"opt\">③ 平衡度とは、通信回線の中性点と大地との間に起電力を加えた場合におけるこれらの間に生ずる電圧と通信回線の端子間に生ずる電圧との差をデシベルで表わしたものをいう。</p>\n<p class=\"opt\">④ 離隔距離とは、線路と他の物体(線路を含む。)とが気象条件による位置の変化により最も接近した場合におけるこれらの物の間の距離をいう。</p>\n<p class=\"opt\">⑤ 絶対レベルとは、一の皮相電力の１ミリワットに対する比をデシベルで表わしたものをいう。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢屋内電線｣、｢地中電線｣、｢架空電線と他人の設置した架空電線等との関係｣、｢海底電線｣又は｢線路の電圧及び通信回線の電力｣について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 屋内電線(光ファイバを除く。)と大地との間及び屋内電線相互間の絶縁抵抗は、直流１００ボルトの電圧で測定した値で、１.５メグオーム以上でなければならない。</p>\n<p class=\"opt\">② 地中電線は、地中強電流電線との離隔距離が５０センチメートル(その地中強電流電線の電圧が７,０００ボルトを超えるものであるときは、６０センチメートル)以下となるように設置するときは、総務省令で定めるところによらなければならない。</p>\n<p class=\"opt\">③ 架空電線は、他人の建造物との離隔距離が３０センチメートル以下となるように設置してはならない。ただし、堅ろうな絶縁管に収めて設置するときは、この限りでない。</p>\n<p class=\"opt\">④ 海底電線は、他人の設置する海底電線又は海底強電流電線との水平距離が１キロメートル以下となるように設置してはならない。ただし、その他人の承諾を得たときは、この限りでない。</p>\n<p class=\"opt\">⑤ 通信回線(導体が光ファイバであるものを除く。)の線路の電圧は、１００ボルト以下でなければならない。ただし、電線としてケーブルのみを使用するとき、又は人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがないときは、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令に規定する｢架空電線と他人の設置した架空電線等との関係｣及び有線電気通信設備令施行規則に規定する｢保安機能｣について述べた次のＡ～Ｃの文章は、 (カ) 。(４点)</p>\n<p class=\"stmt\">Ａ 架空電線は、架空強電流電線と交差するとき、又は架空強電流電線との水平距離がその架空電線若しくは架空強電流電線の支持物のうちいずれか高いものの高さに相当する距離以下となるときは、総務省令で定めるところによらなければ、設置してはならない。</p>\n<p class=\"stmt\">Ｂ 有線電気通信設備の機器の金属製の台及びきょう体並びに架空電線のちょう架用線は、接地しなければならない。ただし、安全な場所に危険のないように設置する場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 架空地線に内蔵又は外接して設置される光ファイバを導体とする架空電線に接続する電線は、架空地線(当該架空電線の金属製部分を含む。)と連接接地し等電位化しなければならない。ただし、雷又は強電流電線との混触により、人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがない場合は、この限りでない。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R6-1", "title": "令和６年度 第１回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 有線電気通信法に規定する｢目的｣、｢技術基準｣及び｢本邦外にわたる有線電気通信設備｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信法は、有線電気通信設備の設置及び使用を規律し、有線電気通信に関する秩序を確立することによって、公共の福祉の増進に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 有線電気通信設備(政令で定めるものを除く。)の技術基準により確保されなければならない事項の一つとして、有線電気通信設備は、他人の設置する有線電気通信設備に妨害を与えないようにすることがある。</p>\n<p class=\"stmt\">Ｃ 本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者がその事業の用に供する設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、期間を定めて臨時に設置するときは、この限りでない。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の(ⅰ)、(ⅱ)の文章は、有線電気通信法に規定する｢有線電気通信設備の届出｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 有線電気通信設備を設置しようとする者は、有線電気通信の (イ) 、設備の設置の場所及び設備の概要を記載した書類を添えて 、 設置の工事の開始の日の ２ 週間前まで (工事を要しないときは、設置の日から２週間以内)に、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"item\">(ⅱ) 設置の届出をする者は、その届出に係る有線電気通信設備が、他人の通信の用に供されるもの(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の(イ) 、設備の設置の場所及び設備の概要のほか、その (ウ) その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 工事仕様書</p>\n<p class=\"opt\">② 料金体系</p>\n<p class=\"opt\">③ 設置の目的</p>\n<p class=\"opt\">④ 提供条件</p>\n<p class=\"opt\">⑤ 使用の態様</p>\n<p class=\"opt\">⑥ 運用方法</p>\n<p class=\"opt\">⑦ 接続の方法</p>\n<p class=\"opt\">⑧ 方式の別</p>\n<p class=\"opt\">⑨ 工事の期間</p>\n<p class=\"opt\">⑩ 接続構成</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令又は有線電気通信設備令施行規則に規定する用語について述べた次の文章のうち、正しいものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 平衡度とは、通信回線の中性点と大地との間に起電力を加えた場合におけるこれらの間に生ずる電圧と通信回線の端子間に生ずる電圧との比をデシベルで表わしたものをいう。</p>\n<p class=\"opt\">② 低周波とは、周波数が３００ヘルツ以下の電磁波をいい、音声周波とは、周波数が３００ヘルツを超え、３,５００ヘルツ以下の電磁波をいう。</p>\n<p class=\"opt\">③ 強電流電線とは、強電流電気の伝送を行うための導体をいい、絶縁物又は保護物で被覆されている場合は、これらの物を除く。</p>\n<p class=\"opt\">④ 離隔距離とは、線路と他の物体(線路を含む。)とが接近し又は交差する場合において、相互に通信の妨げにならないこれらの物の間の最短距離をいう。</p>\n<p class=\"opt\">⑤ 絶縁電線とは、絶縁物及び保護物で被覆されている電線をいう。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する ｢架空電線の支持物 ｣、 ｢使用可能な電線の種類 ｣、 ｢線路の電圧及び通信回線の電力 ｣、 ｢架空電線の高さ ｣又は ｢架空電線と他人の設置した架空電線等との関係 ｣について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 道路上に設置する電柱、架空電線と架空強電流電線とを架設する電柱その他の総務省令で定める電柱は、総務省令で定める安全係数をもたなければならない。この安全係数は、その電柱に架設する物の重量、電線の不平均張力及び総務省令で定める風圧荷重が加わるものとして計算するものとする。</p>\n<p class=\"opt\">② 有線電気通信設備に使用する電線は、絶縁電線又はケーブルでなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">③ 通信回線の電力は、絶対レベルで表わした値で、その周波数が低周波であるときは、プラス１０デシベル以下、音声周波であるときは、プラス２０デシベル以下でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">④ 架空電線の高さは、その架空電線が道路上にあるとき、鉄道又は軌道を横断するとき、及び河川を横断するときは、総務省令で定めるところによらなければならない。</p>\n<p class=\"opt\">⑤ 架空電線は、他人の設置した架空電線との離隔距離が３０センチメートル以下となるように設置してはならない。ただし、その他人の承諾を得たとき、又は設置しようとする架空電線(これに係る中継器その他の機器を含む。以下同じ。)が、その他人の設置した架空電線に係る作業に支障を及ぼさず、かつ、その他人の設置した架空電線に損傷を与えない場合として総務省令で定めるときは、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則の｢屋内電線と屋内強電流電線との交差又は接近｣において、屋内電線が低圧の屋内強電流電線と交差し、又は３０センチメートル以内に接近する場合の設置の方法について、屋内電線と屋内強電流電線とを同一の管等に収めて設置しないことと規定されているが、その適用が除外される場合について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 屋内電線が、特別保安接地工事を施した金属製の電気的遮へい層を有する絶縁電線であるとき。</p>\n<p class=\"stmt\">Ｂ 屋内電線と屋内強電流電線との間に堅ろうな隔壁を設け、かつ、金属製部分に特別保安接地工事を施したダクト又はボックスの中に屋内電線と屋内強電流電線を収めて設置するとき。</p>\n<p class=\"stmt\">Ｃ 屋内電線が、光ファイバその他金属以外のもので構成されているとき。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R6-2", "title": "令和６年度 第２回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 有線電気通信法に規定する｢有線電気通信設備の届出｣、｢設備の検査等｣及び｢技術基準｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信設備(その設置について総務大臣に届け出る必要のないものを除く。)を設置しようとする者は、有線電気通信の方式の別、設備の設置の場所及び設備の概要を記載した書類を添えて、設置の工事の開始の日の１週間前まで(工事を要しないときは、設置の日から１週間以内)に、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"stmt\">Ｂ 総務大臣は、有線電気通信法の施行に必要な限度において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。この検査の権限は、犯罪捜査のために認められたものと解してはならない。</p>\n<p class=\"stmt\">Ｃ 有線電気通信設備(政令で定めるものを除く。)の技術基準により確保されなければならない事項の一つとして、有線電気通信設備は、他人の設置する有線電気通信設備に妨害を与えないようにすることがある。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、有線電気通信法に規定する｢非常事態における通信の確保｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)総務大臣は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、有線電気通信設備を設置した者に対し、災害の予防若しくは救援、交通、通信若しくは (イ)若しくは秩序の維持のために必要な通信を行い、又はこれらの通信を行うためその有線電気通信設備を他の者に使用させ、若しくはこれを (ウ) すべきことを命ずることができる。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 通信量に応じて速やかに増設</p>\n<p class=\"opt\">② 避難指示の伝達</p>\n<p class=\"opt\">③ 電力の供給の確保</p>\n<p class=\"opt\">④ 電気通信事業者に貸与</p>\n<p class=\"opt\">⑤ 常に使用可能にするため点検整備</p>\n<p class=\"opt\">⑥ 緊急連絡体制の確立</p>\n<p class=\"opt\">⑦ 非常事態の回避</p>\n<p class=\"opt\">⑧ 他の有線電気通信設備に接続</p>\n<p class=\"opt\">⑨ 安定稼働させるため監視保守</p>\n<p class=\"opt\">⑩ 救急活動の支援</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語について述べた次の文章のうち、誤っているものは、(エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 音声周波とは、周波数が２００ヘルツを超え、３,５００ヘルツ以下の電磁波をいい、高周波とは、周波数が３,５００ヘルツを超える電磁波をいう。</p>\n<p class=\"opt\">② 電線とは、有線電気通信(送信の場所と受信の場所との間の線条その他の導体を利用して、電磁的方式により信号を行うことを含む。)を行うための導体(絶縁物又は保護物で被覆されている場合は、これらの物を含む。)をいい、強電流電線に重畳される通信回線に係るものを含む。</p>\n<p class=\"opt\">③ 絶縁電線とは、絶縁物のみで被覆されている電線をいい、支持物とは、電柱、支線、つり線その他電線又は強電流電線を支持するための工作物をいう。</p>\n<p class=\"opt\">④ 線路とは、送信の場所と受信の場所との間に設置されている電線及びこれに係る中継器その他の機器(これらを支持し、又は保蔵するための工作物を含む。)をいう。</p>\n<p class=\"opt\">⑤ 絶対レベルとは、一の皮相電力の１ミリワットに対する比をデシベルで表わしたものをいう。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する ｢屋内電線 ｣、 ｢架空電線の支持物 ｣又は ｢架空電線と他人の設置した架空電線等との関係｣について述べた次の文章のうち、誤っているものは、 (オ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 屋内電線は、屋内強電流電線との離隔距離が３０センチメートル以下となるときは、総務省令で定めるところによらなければ、設置してはならない。</p>\n<p class=\"opt\">② 道路上に設置する電柱、架空電線と架空強電流電線とを架設する電柱その他の総務省令で定める電柱は、総務省令で定める安全係数をもたなければならない。この安全係数は、その電柱に架設する物の重量、電線の不平均張力及び総務省令で定める風圧荷重が加わるものとして計算するものとする。</p>\n<p class=\"opt\">③ 架空電線の支持物は、その架空電線が他人の設置した架空電線又は架空強電流電線と交差し、又は接近するときは、他人の設置した架空電線又は架空強電流電線を挟み、又はこれらの間を通ることがないように設置しなければならない。ただし、総務大臣の承諾を得たとき、又は人体に危害を及ぼし、若しくは物件に損傷を与えないように必要な設備をしたときは、この限りでない。</p>\n<p class=\"opt\">④ 架空電線は、総務省令で定めるところによらなければ、架空強電流電線と同一の支持物に架設してはならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則に規定する｢保安機能｣について述べた次のＡ～Ｃの文章は、(カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信設備には、有線電気通信設備令施行規則に規定するところにより保安装置を設置しなければならない。ただし、その線路が地中電線であって、架空電線と接続しないものである場合、又は導体が光ファイバである場合は、この限りでない。</p>\n<p class=\"stmt\">Ｂ 有線電気通信設備の機器の金属製の台及びきょう体並びに架空電線のちょう架用線は、遮へいしなければならない。ただし、安全な場所に危険のないように設置する場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 架空地線に内蔵又は外接して設置される光ファイバを導体とする架空電線に接続する電線は、架空地線(当該架空電線の金属製部分を含む。)と電気的に接続してはならない。ただし、雷又は強電流電線との混触により、人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがない場合は、この限りでない。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R7-1", "title": "令和７年度 第１回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、有線電気通信法に規定する｢有線電気通信設備の届出｣について述べたものである。□内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)有線電気通信設備の設置の届出をする者は、その届出に係る有線電気通信設備が次の(ⅰ)～</p>\n<p class=\"item\">(ⅲ)に掲げる設備(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の方式の別、設備の設置の場所及び (ア) のほか、その使用の態様その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"item\">(ⅰ) ２人以上の者が共同して設置するもの</p>\n<p class=\"item\">(ⅱ) 他人(電気通信事業者を除く。)の設置した有線電気通信設備と相互に接続されるもの</p>\n<p class=\"item\">(ⅲ) 他人の (イ) もの</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 設置の目的</p>\n<p class=\"opt\">② 設備と近接する</p>\n<p class=\"opt\">③ 運用に委ねる</p>\n<p class=\"opt\">④ 接続の方法</p>\n<p class=\"opt\">⑤ 設備の概要</p>\n<p class=\"opt\">⑥ 保守運用の体制</p>\n<p class=\"opt\">⑦ 建造物に設置される</p>\n<p class=\"opt\">⑧ 工事の期間</p>\n<p class=\"opt\">⑨ 設備に重畳される</p>\n<p class=\"opt\">⑩ 通信の用に供される</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 有線電気通信法に規定する｢目的｣、｢設備の検査等｣及び｢本邦外にわたる有線電気通信設備｣について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信法は、有線電気通信設備の設置及び使用を規律し、有線電気通信に関する秩序を確立することによって、有線電気通信の健全な発達に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 総務大臣は、有線電気通信法の施行に必要な限度において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。</p>\n<p class=\"stmt\">Ｃ 本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者がその事業の用に供する設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、期間を定めて臨時に設置するときは、この限りでない。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語について述べた次のＡ～Ｃの文章は、 (エ) 。(４点)</p>\n<p class=\"stmt\">Ａ 平衡度とは、通信回線の中性点と大地との間に起電力を加えた場合におけるこれらの間に生ずる電圧と通信回線の端子間に生ずる電圧との比をデシベルで表わしたものをいう。</p>\n<p class=\"stmt\">Ｂ 絶対レベルとは、一の実効電力の１ミリワットに対する比をデシベルで表わしたものをいう。</p>\n<p class=\"stmt\">Ｃ 強電流電線とは、強電流電気の伝送を行うための導体(絶縁物又は保護物で被覆されている場合は、これらの物を含む。)をいう。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢通信回線の平衡度｣、｢線路の電圧及び通信回線の電力｣、｢地中電線｣、｢屋内電線｣又は｢架空電線と他人の設置した架空電線等との関係｣について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 通信回線(導体が光ファイバであるものを除く。)の平衡度は、１,０００ヘルツの交流において７０デシベル以上でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">② 通信回線(導体が光ファイバであるものを除く。)の電力は、絶対レベルで表わした値で、その周波数が音声周波であるときは、プラス１０デシベル以下、高周波であるときは、プラス２０デシベル以下でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">③ 地中電線は、地中強電流電線との離隔距離が３０センチメートル(その地中強電流電線の電圧が７,０００ボルトを超えるものであるときは、６０センチメートル)以下となるように設置するときは、総務省令で定めるところによらなければならない。</p>\n<p class=\"opt\">④ 屋内電線(光ファイバを除く。)と大地との間及び屋内電線相互間の絶縁抵抗は、直流１００ボルトの電圧で測定した値で、１メグオーム以上でなければならない。</p>\n<p class=\"opt\">⑤ 架空電線は、架空強電流電線と交差するとき、又は架空強電流電線との水平距離がその架空電線若しくは架空強電流電線の支持物のうちいずれか高いものの高さに相当する距離以下となるときは、総務省令で定めるところによらなければ、設置してはならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則に規定する｢架空電線の支持物と架空強電流電線との間の離隔距離｣又は｢架空電線の高さ｣について述べた次の文章のうち、正しいものは、 (カ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 架空強電流電線の使用電圧が高圧であって、架空強電流電線の種別が強電流ケーブルであるときは、架空電線の支持物と架空強電流電線(当該架空電線の支持物に架設されるものを除く。)との間の離隔距離は、６０センチメートル以上とすること。</p>\n<p class=\"opt\">② 架空電線の高さは、架空電線が道路上にあるときは、横断歩道橋の上にあるときを除き、路面から４.５メートル(交通に支障を及ぼすおそれが少ない場合で工事上やむを得ないときを除く。)以上でなければならない。</p>\n<p class=\"opt\">③ 架空電線の高さは、架空電線が鉄道又は軌道を横断するときは、軌条面から５メートル(車両の運行に支障を及ぼすおそれがない高さが５メートルより低い場合は、その高さ)以上でなければならない。</p>\n<p class=\"opt\">④ 架空電線の高さは、架空電線が横断歩道橋の上にあるときは、その路面から３メートル以上でなければならない。</p>\n<p class=\"opt\">⑤ 架空電線の高さは、架空電線が河川を横断するときは、基準水位の水面から６メートル以上でなければならない。</p>"}, {"tag": "R7-2", "title": "令和７年度 第２回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 有線電気通信法に規定する｢設備の検査等｣、｢技術基準｣又は｢設備の改善等の措置｣について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 総務大臣は、有線電気通信法の施行に必要な限度において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。この検査の権限は、罰則の適用のために認められたものと解してはならない。</p>\n<p class=\"opt\">② 有線電気通信法の規定により立入検査をする職員は、その身分を示す証明書を携帯し、関係人に提示しなければならない。</p>\n<p class=\"opt\">③ 有線電気通信法の規定に基づく政令で定める技術基準により確保されなければならない事項の一つとして、有線電気通信設備(政令で定めるものを除く。)は、他人の設置する有線電気通信設備に妨害を与えないようにすることがある。</p>\n<p class=\"opt\">④ 総務大臣は、有線電気通信設備を設置した者に対し、その設備が有線電気通信法の規定に基づく政令で定める技術基準に適合しないため他人の設置する有線電気通信設備に妨害を与え、又は人体に危害を及ぼし、若しくは物件に損傷を与えると認めるときは、その妨害、危害又は損傷の防止又は除去のため必要な限度において、その設備の使用の停止又は改造、修理その他の措置を命ずることができる。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の(ⅰ)、(ⅱ)の文章は、有線電気通信法に規定する｢有線電気通信設備の届出｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 有線電気通信設備を設置しようとする者は、有線電気通信の方式の別、設備の設置の場所及び設備の概要を記載した書類を添えて、設置の工事の開始の日の (イ) 前まで(工事を要しないときは、設置の日から (イ) 以内)に、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"item\">(ⅱ) 設置の届出をする者は、その届出に係る有線電気通信設備が、他人の通信の用に供されるもの(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の方式の別、設備の設置の場所及び設備の概要のほか、その (ウ) その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① １０日</p>\n<p class=\"opt\">② 設置の目的</p>\n<p class=\"opt\">③ 運用方法</p>\n<p class=\"opt\">④ 接続構成</p>\n<p class=\"opt\">⑤ １週間</p>\n<p class=\"opt\">⑥ ２週間</p>\n<p class=\"opt\">⑦ ２０日</p>\n<p class=\"opt\">⑧ 料金体系</p>\n<p class=\"opt\">⑨ ３０日</p>\n<p class=\"opt\">⑩ 使用の態様</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令又は有線電気通信設備令施行規則に規定する用語について述べた次の文章のうち、正しいものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 絶縁電線とは、絶縁物及び保護物で被覆されている電線をいう。</p>\n<p class=\"opt\">② 支持物とは、電柱、支線、つり線その他電線又は強電流電線を支持するための工作物であって、総務省令で定める絶縁耐力を有するものをいう。</p>\n<p class=\"opt\">③ 離隔距離とは、線路と他の物体(線路を含む。)とが接近し又は交差する場合において、相互に通信の妨げにならないこれらの物の間の最短距離をいう。</p>\n<p class=\"opt\">④ 低周波とは、周波数が２００ヘルツ以下の電磁波をいい、音声周波とは、周波数が２００ヘルツを超え、３,５００ヘルツ以下の電磁波をいう。</p>\n<p class=\"opt\">⑤ 絶対レベルとは、一の実効電力の１ミリワットに対する比を絶対値で表わしたものをいう。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢線路の電圧及び通信回線の電力｣、｢地中電線｣及び｢架空電線の支持物｣について述べた次のＡ～Ｃの文章は、 (オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 通信回線(導体が光ファイバであるものを除く。)の線路の電圧は、９０ボルト以上１１０ボルト以下でなければならない。但し、電線としてケーブルのみを使用するとき、又は人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがないときは、この限りでない。</p>\n<p class=\"stmt\">Ｂ 地中電線の金属製の被覆又は管路は、地中強電流電線の金属製の被覆又は管路と電気的に接続してはならない。但し、電気鉄道又は電気軌道の帰線から漏れる直流の電流による腐しょくを防止するため接続する場合であって、総務省令で定める設備をする場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 道路上に設置する電柱、架空電線と架空強電流電線とを架設する電柱その他の総務省令で定める電柱は、総務省令で定める安全係数をもたなければならない。安全係数は、その電柱に架ち設する物の重量、電線の不平均張力及び総務省令で定める弛度を確保するものとして計算するものとする。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則の｢屋内電線と屋内強電流電線との交差又は接近｣において、屋内電線が低圧の屋内強電流電線と交差し、又は３０センチメートル以内に接近する場合の設置の方法について、屋内電線と屋内強電流電線とを同一の管等に収めて設置しないことと規定されているが、その適用が除外される場合について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 屋内電線と屋内強電流電線との間に堅ろうな隔壁を設け、かつ、金属製部分に特別保安接地工事を施したダクト又はボックスの中に屋内電線と屋内強電流電線を収めて設置するとき。</p>\n<p class=\"stmt\">Ｂ 屋内電線が、特別保安接地工事を施した金属製の電気的遮へい層を有するケーブルであるとき。</p>\n<p class=\"stmt\">Ｃ 屋内電線が、光ファイバその他金属以外のもので構成されているとき。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R8-1", "title": "令和８年度 第１回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 有線電気通信法に規定する｢目的｣、｢有線電気通信設備の届出｣及び｢技術基準｣について述べた次のＡ～Ｃの文章は、 (ア) 。ただし、適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信法は、有線電気通信設備の設置及び使用を規律し、有線電気通信に関する秩序を確立することによって、有線電気通信の健全な発達に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 有線電気通信設備(その設置について総務大臣に届け出る必要のないものを除く。)の設置の届出をする者は、その届出に係る有線電気通信設備が、他人の通信の用に供されるもの(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の方式の別、設備の設置の場所及び設備の概要のほか、その設置の目的その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"stmt\">Ｃ 有線電気通信法の規定に基づく政令で定める技術基準により確保されなければならない事項の一つとして、有線電気通信設備(政令で定めるものを除く。)は、人体に危害を及ぼし、又は物件に損傷を与えないようにすることがある。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、有線電気通信法に規定する｢本邦外にわたる有線電気通信設備｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者が (イ) 設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、(ウ) ときは、この限りでない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 国際基準に適合した</p>\n<p class=\"opt\">② 国際電気通信連合の承認を得た</p>\n<p class=\"opt\">③ 重要通信を確保するための</p>\n<p class=\"opt\">④ 基礎的電気通信役務を提供するための</p>\n<p class=\"opt\">⑤ 当該２国間協定に基づく</p>\n<p class=\"opt\">⑥ その事業の用に供する</p>\n<p class=\"opt\">⑦ 総務大臣の許可を受けた</p>\n<p class=\"opt\">⑧ 政令で定められた事項に該当する</p>\n<p class=\"opt\">⑨ 総務省令で定める届出をした</p>\n<p class=\"opt\">⑩ 本邦外の電気通信事業者と合意した</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語及び有線電気通信設備令施行規則に規定する用語について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 強電流電線とは、強電流電気の伝送を行うための導体をいい、絶縁物又は保護物で被覆されている場合は、これらの物を除く。</p>\n<p class=\"stmt\">Ｂ 平衡度とは、通信回線の中性点と大地との間に起電力を加えた場合におけるこれらの間に生ずる電圧と通信回線の端子間に生ずる電圧との差をデシベルで表わしたものをいう。</p>\n<p class=\"stmt\">Ｃ 低周波とは、周波数が２００ヘルツ以下の電磁波をいい、高周波とは、周波数が３,５００ヘルツを超える電磁波をいう。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢使用可能な電線の種類｣、｢海底電線｣、｢架空電線と他人の設置した架空電線等との関係｣若しくは｢架空電線の支持物｣、又は有線電気通信設備令施行規則に規定する｢架空電線の支持物と架空強電流電線との間の離隔距離｣について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 有線電気通信設備に使用する電線は、絶縁電線又は強電流電線でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">② 海底電線は、他人の設置する海底電線又は海底強電流電線との水平距離が１キロメートル以下となるように設置してはならない。ただし、その他人の承諾を得たときは、この限りでない。</p>\n<p class=\"opt\">③ 架空電線は、他人の建造物との離隔距離が３０センチメートル以下となるように設置してはならない。ただし、その他人の承諾を得たときは、この限りでない。</p>\n<p class=\"opt\">④ 架空電線の支持物には、取扱者が昇降に使用する足場金具等を地表上２.５メートル未満の高さに取り付けてはならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">⑤ 架空強電流電線の使用電圧が高圧であって、架空強電流電線の種別が強電流ケーブルであるときは、架空電線の支持物と架空強電流電線(当該架空電線の支持物に架設されるものを除く。)との間の離隔距離は、６０センチメートル以上とすること。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令に規定する｢線路の電圧及び通信回線の電力｣、｢屋内電線｣又は有線電気通信設備令施行規則に規定する｢保安機能｣について述べた次の文章のうち、誤っているものは、(カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 通信回線(導体が光ファイバであるものを除く。)の線路の電圧は、１００ボルト以下でなければならない。ただし、電線としてケーブルのみを使用するとき、又は人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがないときは、この限りでない。</p>\n<p class=\"opt\">② 屋内電線(光ファイバを除く。)と大地との間及び屋内電線相互間の絶縁抵抗は、直流１００ボルトの電圧で測定した値で、１メグオーム以上でなければならない。</p>\n<p class=\"opt\">③ 有線電気通信設備には、有線電気通信設備令施行規則に規定するところにより保安装置を設置しなければならない。ただし、その線路が地中電線であって、架空電線と接続しないものである場合、又は導体が光ファイバである場合は、この限りでない。</p>\n<p class=\"opt\">④ 架空地線に内蔵又は外接して設置される光ファイバを導体とする架空電線に接続する電線は、架空地線(当該架空電線の金属製部分を含む。)と連接接地し等電位化しなければならない。ただし、雷又は強電流電線との混触により、人体に危害を及ぼし、若しくは物件に損傷を与えるおそれがない場合は、この限りでない。</p>\n<p class=\"opt\">⑤ 有線電気通信設備の機器の金属製の台及びきょう体並びに架空電線のちょう架用線は、接地しなければならない。ただし、安全な場所に危険のないように設置する場合は、この限りでない。</p>"}]};

// ---- 自己評価（小問ごと／更新時刻つきで保存） ----
// STORE の形: { "R7-1-問2-(３)": {v:"60", t:1729500000000} }
// v:"" は「評価を外した」記録。削除を他端末へ伝えるため残す。
const RATE_KEY  = 'houki-rate-v2';
const OLD_KEY   = 'houki-rate-v1';
const RATE_OPTS = ['20','40','60','80','〇'];

function loadStore(){
  try{
    const v2 = JSON.parse(localStorage.getItem(RATE_KEY) || 'null');
    if(v2) return v2;
    const v1 = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
    if(v1){ // 旧形式（値のみ）を取り込む
      const now = Date.now(), out = {};
      Object.keys(v1).forEach(k=>{ out[k] = {v:v1[k], t:now}; });
      return out;
    }
  }catch(e){}
  return {};
}
let STORE = loadStore();

// プライベートブラウズ等で保存できなくても表示は続行する
function persist(){ try{ localStorage.setItem(RATE_KEY, JSON.stringify(STORE)); }catch(e){} }

function rateBase(){ return ALL['1'][curY].tag + '-問' + curQ; }
function subKey(sub){ return rateBase() + '-(' + sub + ')'; }
function rateOf(key){ const e = STORE[key]; return e && e.v ? e.v : ''; }

function saveRate(key, v){
  STORE[key] = {v: v || '', t: Date.now()};
  persist();
  queuePush();
}

// 小問ごとに新しい方を採用する
function mergeRemote(remote){
  let changed = false;
  Object.keys(remote || {}).forEach(k=>{
    const r = remote[k], l = STORE[k];
    if(!r || typeof r.t !== 'number') return;
    if(!l || r.t > l.t){ STORE[k] = r; changed = true; }
  });
  if(changed) persist();
  return changed;
}

const GH_KEY    = 'houki-gh';
const GIST_FILE = 'houki-ratings.json';

try{ GH = Object.assign(GH, JSON.parse(localStorage.getItem(GH_KEY) || '{}')); }catch(e){}

async function gh(path, opts){
  opts = opts || {};
  const r = await fetch('https://api.github.com' + path, {
    method: opts.method || 'GET',
    headers: {
      'Authorization': 'Bearer ' + GH.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    },
    body: opts.body
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function readGist(){
  const g = await gh('/gists/' + GH.gist);
  const f = g.files && g.files[GIST_FILE];
  if(!f) return {};
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(text || '{}');
}

function setStat(s){ const e = document.getElementById('syncStat'); if(e) e.textContent = s; }
function syncMsg(s){ const e = document.getElementById('syncMsg'); if(e) e.textContent = s; }
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  setStat('同期済 ' + p(d.getHours()) + ':' + p(d.getMinutes()));
}
function showStat(){ setStat(GH.token && GH.gist ? '同期オン' : '同期オフ'); }
function linked(){ return !!(GH.token && GH.gist); }

async function pull(force){
  if(!linked()) return;
  setStat('同期中…');
  try{
    const changed = mergeRemote(await readGist());
    if(changed || force) render();
    stamp();
  }catch(e){ setStat('同期エラー'); }
}

let pushTimer = null, pushing = false;
function queuePush(){
  if(!linked()) return;
  clearTimeout(pushTimer);
  setStat('保存待ち…');
  pushTimer = setTimeout(push, 1200);
}

async function push(){
  if(!linked()) return;
  if(pushing){ queuePush(); return; }   // 走行中なら後ろに回す
  pushing = true;
  setStat('同期中…');
  try{
    // 書き戻す前に相手側の更新を取り込む（他端末の評価を消さないため）
    if(mergeRemote(await readGist())) render();
    await gh('/gists/' + GH.gist, {method:'PATCH', body: JSON.stringify({
      files: {[GIST_FILE]: {content: JSON.stringify(STORE)}}
    })});
    stamp();
  }catch(e){ setStat('同期エラー'); }
  pushing = false;
}

// ---- 配色（未選択なら端末の設定に従う） ----
const THEME_KEY = 'houki-theme';
const prefersDark = matchMedia('(prefers-color-scheme: dark)');

function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : prefersDark.matches;
}
function paintThemeBtn(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  const dark = isDark();
  b.textContent = dark ? '☀' : '🌙';
  b.title = dark ? 'ライトに切替' : 'ダークに切替';
}
function toggleTheme(){
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  paintThemeBtn();
}
// 自分で選んでいない間は端末の設定変更に追従する
prefersDark.addEventListener('change', ()=>{
  if(!document.documentElement.getAttribute('data-theme')) paintThemeBtn();
});

function toggleSync(){
  document.getElementById('syncPanel').classList.toggle('open');
  syncHeader();
}

async function connectGist(){
  const box = document.getElementById('ghToken');
  const t = box.value.trim();
  if(!t){ syncMsg('トークンを貼り付けてください。'); return; }
  GH.token = t;
  syncMsg('接続中…');
  try{
    // 同じトークンなら2台目は既存のGistを自動で見つける
    const list = await gh('/gists?per_page=100');
    const hit = list.find(g => g.files && g.files[GIST_FILE]);
    if(hit){
      GH.gist = hit.id;
    }else{
      const made = await gh('/gists', {method:'POST', body: JSON.stringify({
        description: '電気通信主任技術者 法規 自己評価',
        public: false,
        files: {[GIST_FILE]: {content: '{}'}}
      })});
      GH.gist = made.id;
    }
    ghSave();
    box.value = '';
    syncMsg(hit ? '既存のGistに接続しました。' : '新しい非公開Gistを作成しました。');
    await pull(true);
    await push();
  }catch(e){
    GH = {token:'', gist:''};
    syncMsg('接続できませんでした（' + e.message + '）。トークンと gist スコープをご確認ください。');
    showStat();
  }
}

function disconnectGist(){
  GH = {token:'', gist:''};
  ghSave();
  syncMsg('この端末の同期設定を削除しました。評価はこの端末に残ります。');
  showStat();
}

// 手動同期（iOSのホーム画面アプリなど、復帰検知が効かない場合の保険）
async function syncNow(){
  if(!linked()){ syncMsg('先にトークンを貼って「接続」してください。'); return; }
  syncMsg('同期中…');
  await pull(true);
  await push();
  syncMsg('同期しました。');
}

// 別端末で付けた評価を、戻ってきたときに取り込む。
// iOSのホーム画面アプリは復帰の通知が visibilitychange だけでは不確実なため
// pageshow と focus も拾い、短時間の重複発火だけ抑える。
let lastPull = 0;
function maybePull(){
  if(!linked()) return;
  const now = Date.now();
  if(now - lastPull < 3000) return;
  lastPull = now;
  pull();
}
addEventListener('visibilitychange', ()=>{ if(!document.hidden) maybePull(); });
addEventListener('pageshow', maybePull);
addEventListener('focus', maybePull);

// 各小問の見出しに評価セレクトを差し込む（検索ハイライトの後に実行すること）
function mountSubRates(){
  document.querySelectorAll('.panel p.sub-h[data-sub]').forEach(p=>{
    const key = subKey(p.dataset.sub);
    const cur = rateOf(key);
    const sel = document.createElement('select');
    [''].concat(RATE_OPTS).forEach(v=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = v || '未評価';
      if(v === cur) o.selected = true;
      sel.appendChild(o);
    });
    sel.className = cur ? 'done' : '';
    sel.onchange = ()=>{
      saveRate(key, sel.value);
      sel.className = sel.value ? 'done' : '';
    };
    const span = document.createElement('span');
    span.className = 'sub-rate';
    span.appendChild(sel);
    p.insertBefore(span, p.firstChild);
  });
}

function renderAnswerBox(){
  const ans = ANSWERS[curY][curQ];
  if(!ans) return '';
  const keys = Object.keys(ans);
  let items = keys.map(k => `<span class="answer-item"><span class="ans-label">(${k})</span>${ans[k]}</span>`).join('');
  return `
    <button class="answer-toggle" onclick="toggleAnswer(this)">▶ 正答を表示</button>
    <div class="answer-box">${items}</div>
  `;
}

function toggleAnswer(btn){
  const box = btn.nextElementSibling;
  const open = box.classList.toggle('open');
  btn.textContent = open ? '▼ 正答を隠す' : '▶ 正答を表示';
}

function render(){
  const d = ALL[String(curQ)][curY];
  document.getElementById('content').innerHTML =
      '<div class="answer-sticky">' + renderAnswerBox() + '</div>'
    + '<div class="panel">' + d.html + '</div>';
  mountSubRates();
}

// ヘッダは折り返しで高さが変わるため、実測値を --hdr に反映する
function syncHeader(){
  const h = document.getElementById('hdr').offsetHeight;
  document.documentElement.style.setProperty('--hdr', h+'px');
}
addEventListener('resize', syncHeader);
addEventListener('orientationchange', syncHeader);
if(window.ResizeObserver) new ResizeObserver(syncHeader).observe(document.getElementById('hdr'));

render();
paintThemeBtn();
syncHeader();
showStat();
if(linked()) pull(true);
</script>
</body>
</html>
