<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>電気通信主任技術者試験 法規 — 問１〜問５</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3">
<style>
/* 配色はすべてトークン化し、ダークは下の2ブロックで上書きする */
:root{
  --bg:#f6f8fb;--panel:#fff;--surface:#fff;--surface-2:#f3f5f9;
  --hdr-a:#fff;--hdr-b:#fbfcfe;
  --ink:#1a2236;--ink-soft:#444455;--muted:#6b7790;--line:#e3e8ef;
  --accent:#8a4a1a;--accent-light:#fbefe4;--sub-ink:#5a3318;
  --hl:#fff3a3;--shadow:0 2px 8px rgba(20,40,70,0.06);
  --ans-bg:#e8f5e9;--ans-ink:#1b5e20;
  --ok-line:#a5d6a7;--ok-ink:#2e7d32;--ok-soft:#f1f8e9;--ok-label:#388e3c;
  color-scheme:light;
  font-size:19px;
}
/* 端末がダーク設定のとき（明示的にライトを選んでいなければ） */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--surface:#1c2128;--surface-2:#20252d;
    --hdr-a:#171b21;--hdr-b:#13171c;
    --ink:#dfe3ea;--ink-soft:#b9c0cc;--muted:#97a0b0;--line:#2b313b;
    --accent:#e0a86a;--accent-light:#2a2118;--sub-ink:#f0d8bd;
    --hl:#7a6a1f;--shadow:0 2px 8px rgba(0,0,0,0.45);
    --ans-bg:#17291b;--ans-ink:#9fd9a6;
    --ok-line:#3f6b45;--ok-ink:#8fd99a;--ok-soft:#1d2e20;--ok-label:#79bd83;
    color-scheme:dark;
  }
}
/* 画面上のボタンでダークを選んだとき */
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--surface:#1c2128;--surface-2:#20252d;
  --hdr-a:#171b21;--hdr-b:#13171c;
  --ink:#dfe3ea;--ink-soft:#b9c0cc;--muted:#97a0b0;--line:#2b313b;
  --accent:#e0a86a;--accent-light:#2a2118;--sub-ink:#f0d8bd;
  --hl:#7a6a1f;--shadow:0 2px 8px rgba(0,0,0,0.45);
  --ans-bg:#17291b;--ans-ink:#9fd9a6;
  --ok-line:#3f6b45;--ok-ink:#8fd99a;--ok-soft:#1d2e20;--ok-label:#79bd83;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  line-height:1.75;font-size:1rem;}
header{background:linear-gradient(180deg,var(--hdr-a),var(--hdr-b));
  border-bottom:1px solid var(--line);padding:10px 16px 8px;
  position:sticky;top:0;z-index:20;}
/* 固定領域を低く保つため、見出しと問タブは同じ行に並べる */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;}
h1{margin:0;font-size:0.95rem;color:var(--accent);white-space:nowrap;}
.q-nav{display:flex;flex-wrap:wrap;gap:4px;}
.q-btn{flex:0 0 auto;padding:5px 12px;border-radius:8px;
  border:1px solid transparent;
  background:transparent;font-size:0.85rem;color:var(--muted);
  cursor:pointer;white-space:nowrap;}
.q-btn:hover{background:var(--accent-light);color:var(--accent)}
.q-btn.active{background:var(--surface);border-color:var(--line);color:var(--accent);font-weight:700;}
/* 年度タブは折り返して全件を常時表示（横スクロールさせない） */
.year-nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 0;}
.y-btn{flex:0 0 auto;padding:6px 10px;border-radius:8px 8px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;font-size:0.85rem;color:var(--muted);
  cursor:pointer;white-space:nowrap;}
.y-btn:hover{background:var(--accent-light);color:var(--accent)}
.y-btn.active{background:var(--surface);border-color:var(--line);color:var(--accent);font-weight:700;}
.spacer{flex:1 1 auto;}
/* 同期ボタンと状態表示 */
.sync-btn{flex:0 0 auto;padding:5px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-family:inherit;font-size:0.8rem;color:var(--muted);cursor:pointer;}
.sync-btn:hover{background:var(--accent-light);color:var(--accent);}
.sync-stat{font-size:0.75rem;color:var(--muted);white-space:nowrap;min-width:5.5em;}
.sync-panel{display:none;margin-top:8px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);}
.sync-panel.open{display:block;}
.sync-panel p{margin:0 0 8px;font-size:0.78rem;line-height:1.6;color:var(--muted);}
.sync-row{display:flex;flex-wrap:wrap;gap:6px;}
.sync-row input{flex:1 1 240px;min-width:0;border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:0.85rem;font-family:inherit;outline:none;
  background:var(--surface);color:var(--ink);}
.sync-row button{flex:0 0 auto;padding:6px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-family:inherit;font-size:0.85rem;color:var(--ink);cursor:pointer;}
.sync-row button:hover{background:var(--accent-light);color:var(--accent);}
.sync-msg{margin:8px 0 0 !important;color:var(--accent) !important;}
main{max-width:1400px;margin:0 auto;padding:12px 24px 60px;}
/* 小問見出しの右肩に置く自己評価セレクト */
.sub-rate{float:right;margin:0 0 4px 12px;}
.sub-rate select{font-family:inherit;font-size:0.8rem;padding:2px 8px;
  border:1px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--ink);font-weight:400;cursor:pointer;}
/* 評価済みは緑でひと目で分かるようにする */
.sub-rate select.done{border-color:var(--ok-line);background:var(--ans-bg);
  color:var(--ans-ink);font-weight:700;}
/* 年度見出しと正答ボックスはヘッダ直下に固定する（--hdr はヘッダ高さ） */
.answer-sticky{position:sticky;top:var(--hdr,0px);z-index:15;
  background:var(--bg);padding:6px 0 6px;}
/* 固定領域が画面を占めすぎないよう余白を詰める */
.answer-sticky .answer-toggle{padding:6px 14px;margin-bottom:0;}
.answer-sticky .answer-box{padding:10px 14px;margin-bottom:0;}

/* 答えボックス */
.answer-toggle{width:100%;padding:10px 16px;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--ok-line);border-radius:10px;
  color:var(--ok-ink);font-size:0.95rem;font-weight:600;
  cursor:pointer;text-align:left;}
.answer-toggle:hover{background:var(--ok-soft);}
.answer-box{background:var(--ans-bg);border:1px solid var(--ok-line);
  border-radius:10px;padding:12px 16px;margin-bottom:16px;
  display:none;flex-wrap:wrap;gap:8px;align-items:center;}
.answer-box.open{display:flex;}
.ans-label{font-size:0.8rem;color:var(--ok-label);margin-right:2px;}
.answer-item{background:var(--surface);border:1px solid var(--ok-line);border-radius:6px;
  padding:3px 10px;font-size:0.95rem;color:var(--ans-ink);font-weight:600;}

.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:20px 20px;box-shadow:var(--shadow);font-size:1rem;}
.panel h3.q-h{font-size:1.05rem;color:var(--accent);margin:0 0 14px;
  padding-bottom:8px;border-bottom:2px solid var(--accent-light);}
.panel p{margin:0 0 10px}
.panel p.sub-h{font-weight:600;color:var(--sub-ink);margin-top:18px;margin-bottom:8px;
  background:var(--accent-light);padding:6px 10px;border-radius:6px;}
.panel p.cg-h{color:var(--ink-soft);font-size:0.9rem;margin-top:10px;
  background:var(--surface-2);padding:5px 10px;border-radius:6px;display:inline-block;}
/* 選択肢・記述文・項目のぶら下げインデント */
.panel p.opt{margin:0 0 7px;padding-left:1.7em;text-indent:-1.7em;}
.panel p.stmt{margin:0 0 7px;padding-left:1.5em;text-indent:-1.5em;}
.panel p.item{margin:0 0 7px;padding-left:2em;text-indent:-2em;}
mark{background:var(--hl);padding:0 1px;border-radius:2px;}
</style>

<header id="hdr">

  <!-- トークンはこの端末のブラウザにのみ保存され、ページ本体には含まれない -->

    <p>GitHubの非公開Gistに評価を保存して端末間で同期します。
       <b>classic PAT（gist スコープのみ）</b>を貼り付けて「接続」を押してください。

<script>
const ALL = {"1": [{"tag": "R4-1", "title": "令和４年度 第１回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法に規定する｢電気通信主任技術者等の義務｣、｢電気通信設備統括管理者｣又は｢電気通信設備統括管理者の解任命令｣について述べた次の文章のうち、誤っているものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信主任技術者は、事業用電気通信設備の工事、維持及び運用に関する事項の監督の職務を誠実に行わなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、電気通信主任技術者に対し、その業務の遂行に必要な専門知識及び能力を向上させるための支援を与えなければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、管理規程に定めた事項に関する業務を統括管理させるため、事業運営上の重要な決定に参画する管理的地位にあり、かつ、電気通信設備の管理に関する一定の実務の経験その他の総務省令で定める要件を備える者のうちから、総務省令で定めるところにより、電気通信設備統括管理者を選任しなければならない。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信設備統括管理者を選任し、又は解任したときは、総務省令で定めるところにより、遅滞なく、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"opt\">⑤ 総務大臣は、電気通信設備統括管理者がその職務を怠った場合であって、当該電気通信設備統括管理者が引き続きその職務を行うことが電気通信役務の確実かつ安定的な提供の確保に著しく支障を及ぼすおそれがあると認めるときは、電気通信事業者に対し、当該電気通信設備統括管理者を解任すべきことを命ずることができる。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法又は電気通信事業法施行規則に規定する事項について述べた次の文章のうち、誤っているものは、 (イ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信設備とは、電気通信を行うための機械、器具、線路その他の電気的設備をいう。</p>\n<p class=\"opt\">② 電気通信事業に従事する者は、在職中電気通信事業者の取扱中に係る通信に関して知り得た他人の秘密を守らなければならない。その職を退いた後においても、同様とする。</p>\n<p class=\"opt\">③ 電気通信事業者は、重要通信の円滑な実施を他の電気通信事業者と相互に連携を図りつつ確保するため、他の電気通信事業者と電気通信設備を相互に接続する場合には、電気通信事業者の事業の規模又は業務区域に応じて、重要通信の優先的な取扱いについて取り決めることその他の必要な措置を講じなければならない。</p>\n<p class=\"opt\">④ 音声伝送役務とは、おおむね４キロヘルツ帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう。</p>\n<p class=\"opt\">⑤ 総務大臣は、電気通信事業者が管理規程を遵守していないと認めるときは、当該電気通信事業者に対し、電気通信役務の確実かつ安定的な提供を確保するために必要な限度において、管理規程を遵守すべきことを命ずることができる。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢基礎的電気通信役務の提供｣及び｢基礎的電気通信役務の契約約款｣について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 基礎的電気通信役務とは、国民生活に不可欠であるためあまねく日本全国における提供が確保されるべきものとして総務省令で定める電気通信役務をいう。</p>\n<p class=\"stmt\">Ｂ 基礎的電気通信役務を提供する電気通信事業者は、その確実、低廉かつ高品質な提供に努めなければならない。</p>\n<p class=\"stmt\">Ｃ 基礎的電気通信役務を提供する電気通信事業者は、その提供する基礎的電気通信役務に関する料金その他の提供条件(電気通信事業法の規定により認可を受けるべき技術的条件に係る事項及び総務省令で定める事項を除く。)について契約約款を定め、総務省令で定めるところにより、その実施前に、総務大臣の許可を受けなければならない。これを変更しようとするときも、同様とする。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 次の文章は、電気通信事業法に規定する｢電気通信事業の登録｣について述べたものである。同法の規定に照らして、 □内の(エ)、(オ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電気通信事業の登録を受けようとする者は、総務省令で定めるところにより、次の事項を記載した申請書を総務大臣に提出しなければならない。</p>\n<p class=\"item\">(ⅰ) 氏名又は名称及び住所並びに法人にあっては、その代表者の氏名</p>\n<p class=\"item\">(ⅱ) 外国法人等(外国の法人及び団体並びに外国に住所を有する個人をいう。)にあっては、国内における代表者又は国内における代理人の氏名又は名称及び (エ)</p>\n<p class=\"item\">(ⅲ) (オ)</p>\n<p class=\"item\">(ⅳ) 電気通信設備の概要</p>\n<p class=\"item\">(ⅴ) その他総務省令で定める事項</p>\n<p class=\"cg-h\">&lt;(エ)、(オ)の解答群&gt;</p>\n<p class=\"opt\">① 国内の住所</p>\n<p class=\"opt\">② 事業計画</p>\n<p class=\"opt\">③ 帳簿書類</p>\n<p class=\"opt\">④ 外国の本社の住所</p>\n<p class=\"opt\">⑤ 業務規程</p>\n<p class=\"opt\">⑥ 業務区域</p>\n<p class=\"opt\">⑦ 国内における権限委任事項</p>\n<p class=\"opt\">⑧ 事業の開始日</p>\n<p class=\"opt\">⑨ 外国の本社の電話番号及び電子メールアドレス</p>\n<p class=\"opt\">⑩ 外国の本社における代表者又は代理人の氏名又は名称</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信事業法に規定する｢業務の停止等の報告｣及び電気通信事業法施行規則に規定する｢報告を要する重大な事故｣について述べたものである。同法又は同規則の規定に照らして、 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)電気通信事業者は、電気通信事業法の規定により電気通信業務の一部を停止したとき、又は電気通信業務に関し通信の秘密の漏えいその他総務省令で定める重大な事故が生じたときは、その旨をその (カ) とともに、遅滞なく、総務大臣に報告しなければならない。上記の総務省令で定める報告を要する重大な事故の一つに、セルラーＬＰＷＡを使用する携帯電話(音声伝送役務を除く。)の全部又は一部の提供を停止又は品質を低下させた事故であって、その時間が (キ) 以上で、かつ影響を受けた利用者の数が３万以上の事故がある。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① １時間</p>\n<p class=\"opt\">② ２時間</p>\n<p class=\"opt\">③ 調査及び分析結果</p>\n<p class=\"opt\">④ 再発防止策</p>\n<p class=\"opt\">⑤ ３時間</p>\n<p class=\"opt\">⑥ ６時間</p>\n<p class=\"opt\">⑦ 経緯及び対応状況</p>\n<p class=\"opt\">⑧ 理由又は原因</p>\n<p class=\"opt\">⑨ １２時間</p>\n<p class=\"opt\">⑩ 利用者への影響の範囲</p>"}, {"tag": "R4-2", "title": "令和４年度 第２回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法又は電気通信事業法施行規則に規定する用語について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信とは、有線、無線その他の電磁的方式により、符号、音響又は影像を送り、伝え、又は受けることをいう。</p>\n<p class=\"opt\">② 電気通信役務とは、電気通信設備を用いて他人の通信を媒介し、その他電気通信設備を他人の通信の用に供することをいう。</p>\n<p class=\"opt\">③ 電気通信事業とは、電気通信役務を他人の需要に応ずるために提供する事業(放送法に規定する放送局設備供給役務に係る事業を除く。)をいう。</p>\n<p class=\"opt\">④ 電気通信業務とは、電気通信事業者の行う電気通信設備の維持及び運用に係る業務をいう。</p>\n<p class=\"opt\">⑤ データ伝送役務とは、専ら符号又は影像を伝送交換するための電気通信設備を他人の通信の用に供する電気通信役務をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法に規定する｢検閲の禁止｣、｢秘密の保護｣及び｢重要通信の確保｣について述べた次のＡ～Ｃの文章は、 (イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業者の取扱中に係る通信は、犯罪捜査に必要であると総務大臣が認めた場合を除き、検閲してはならない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者の取扱中に係る通信の秘密は、侵してはならない。電気通信事業に従事する者は、在職中電気通信事業者の取扱中に係る通信に関して知り得た他人の秘密を守らなければならない。その職を退いた後においても、同様とする。</p>\n<p class=\"stmt\">Ｃ 電気通信事業者は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、災害の予防若しくは救援、交通、通信若しくは電力の供給の確保又は秩序の維持のために必要な事項を内容とする通信を優先的に取り扱わなければならない。公共の利益のため緊急に行うことを要するその他の通信であって総務省令で定めるものについても、同様とする。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法の｢電気通信設備の維持｣に基づき総務省令で定める技術基準により確保されるべき事項について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 他の電気通信事業者の接続する電気通信設備との責任の分界が明確であるようにすること。</p>\n<p class=\"stmt\">Ｂ 利用者又は他の電気通信事業者の接続する電気通信設備を損傷し、又は人体に危害を及ぼさないようにすること。</p>\n<p class=\"stmt\">Ｃ 電気通信設備の損壊又は故障により、電気通信役務の提供に著しい支障を及ぼさないようにすること。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法の｢業務の改善命令｣に規定する、総務大臣が、業務の方法の改善その他の措置をとるべきことを命ずることができる場合について述べた次の文章のうち、誤っているものは、(エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信回線設備を設置することなく電気通信役務を提供する電気通信事業の経営によりこれと電気通信役務に係る需要を共通とする電気通信回線設備を設置して電気通信役務を提供する電気通信事業の当該需要に係る電気通信回線設備の保持が経営上困難となるため、公共の利益が著しく阻害されるおそれがあるとき。</p>\n<p class=\"opt\">② 電気通信事業者が国際電気通信事業に関する条約その他の国際約束により課された義務を誠実に履行していないため、公共の利益が著しく阻害されるおそれがあるとき。</p>\n<p class=\"opt\">③ 電気通信事業者の事業の運営が適正かつ合理的でないため、電気通信の健全な発達又は国民の利便の確保に支障が生ずるおそれがあるとき。</p>\n<p class=\"opt\">④ 事故により電気通信役務の提供に支障が生ずるおそれがある場合に電気通信事業者がその支障をあらかじめ回避するために必要な修理その他の措置を速やかに行わないとき。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信事業法に規定する｢管理規程｣について述べたものである。 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)管理規程は、電気通信役務の確実かつ安定的な提供を確保するために電気通信事業者が遵守すべき次の(ⅰ)～(ⅳ)に掲げる事項に関し、総務省令で定めるところにより、必要な内容を定めたものでなければならない。</p>\n<p class=\"item\">(ⅰ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の管理の方針に関する事項</p>\n<p class=\"item\">(ⅱ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の (オ)に関する事項</p>\n<p class=\"item\">(ⅲ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の管理の方法に関する事項</p>\n<p class=\"item\">(ⅳ) 電気通信事業法に規定する電気通信設備統括管理者の (カ) に関する事項</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① 管理の計画</p>\n<p class=\"opt\">② 権限</p>\n<p class=\"opt\">③ 管理の目標</p>\n<p class=\"opt\">④ 義務</p>\n<p class=\"opt\">⑤ 選任</p>\n<p class=\"opt\">⑥ 管理の体制</p>\n<p class=\"opt\">⑦ 職責</p>\n<p class=\"opt\">⑧ 管理の責任</p>\n<p class=\"opt\">⑨ 配置</p>\n<p class=\"opt\">⑩ 管理の条件</p>"}, {"tag": "R5-1", "title": "令和５年度 第１回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法に規定する｢電気通信主任技術者等の義務｣又は｢電気通信設備統括管理者等の義務｣について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信主任技術者は、事業用電気通信設備の工事、維持及び運用に関する事項の監督の職務を誠実に行わなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、電気通信主任技術者に対し、その業務の遂行に必要な専門知識及び能力を向上させるための支援を与えなければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、電気通信主任技術者のその職務を行う事業場における事業用電気通信設備の工事、維持又は運用に関する助言を尊重しなければならず、事業用電気通信設備の工事、維持又は運用に従事する者は、電気通信主任技術者がその職務を行うため必要であると認めてする指示に従わなければならない。</p>\n<p class=\"opt\">④ 電気通信設備統括管理者は、誠実にその職務を行わなければならない。</p>\n<p class=\"opt\">⑤ 電気通信事業者は、電気通信役務の確実かつ安定的な提供の確保に関し、電気通信設備統括管理者のその職務を行う上での意見を尊重しなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法の｢電気通信回線設備との接続｣に規定する、電気通信事業者が、他の電気通信事業者から当該他の電気通信事業者の電気通信設備をその設置する電気通信回線設備に接続すべき旨の請求を受けたとき、その請求に応じなくてもよい場合について述べた次のＡ～Ｃの文章は、(イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 当該電気通信事業者が契約約款で定める正当な理由があるとき。</p>\n<p class=\"stmt\">Ｂ 当該接続が当該電気通信事業者の利益を不当に害するおそれがあるとき。</p>\n<p class=\"stmt\">Ｃ 電気通信役務に関する料金の適正な算定に支障が生ずるおそれがあるとき。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢電気通信設備の維持｣、｢事業の休止及び廃止並びに法人の解散｣、｢業務の改善命令｣又は｢電気通信主任技術者｣について述べた次の文章のうち、誤っているものは、(ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信回線設備を設置する電気通信事業者は、その電気通信事業の用に供する電気通信設備(専らドメイン名電気通信役務を提供する電気通信事業の用に供する電気通信設備及びその損壊又は故障等による利用者の利益に及ぼす影響が軽微なものとして総務省令で定める電気通信設備を除く。)を総務省令で定める技術基準に適合するように維持しなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、電気通信事業の全部又は一部を休止し、又は廃止したときは、遅滞なく、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"opt\">③ 総務大臣は、事故により電気通信役務の提供に支障が生じている場合に電気通信事業者がその支障を除去するために必要な修理その他の措置を速やかに行わないと認めるときは、電気通信事業者に対し、利用者の利益又は公共の利益を確保するために必要な限度において、業務の方法の改善その他の措置をとるべきことを命ずることができる。</p>\n<p class=\"opt\">④ 電気通信事業者は、事業用電気通信設備を技術基準に適合するように維持するため、総務省令で定めるところにより、電気通信主任技術者資格者証の交付を受けている者のうちから、電気通信主任技術者を選任しなければならない。ただし、その事業用電気通信設備が小規模である場合その他の総務省令で定める場合は、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法施行規則に規定する緊急に行うことを要する通信に該当する通信について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 火災、集団的疫病、交通機関の重大な事故その他人命の安全に係る事態が発生し、又は発生するおそれがある場合において、その予防、救援、復旧等に関し、緊急を要する事項を内容とする通信であって、これらの事態が発生し、又は発生するおそれがあることを知った者と予防、救援、復旧等に直接関係がある機関との間において行われるものは該当する通信である。</p>\n<p class=\"stmt\">Ｂ 国会議員又は地方公共団体の長若しくはその議会の議員の選挙の執行又はその結果に関し、緊急を要する事項を内容とする通信であって、新聞社等の機関相互間において行われるものは該当する通信である。</p>\n<p class=\"stmt\">Ｃ 気象、水象、地象若しくは地動の観測の報告又は警報に関する事項であって、緊急に通報することを要する事項を内容とする通信で、気象機関相互間において行われるものは該当する通信である。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信事業法に規定する｢電気通信設備統括管理者｣について述べたものである。同法の規定に照らして、 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電気通信事業者は、管理規程に定める事項に関する業務を統括管理させるため、事業運営上の重要な (オ) する管理的地位にあり、かつ、電気通信設備の管理に関する一定の(カ) その他の総務省令で定める要件を備える者のうちから、総務省令で定めるところにより、電気通信設備統括管理者を選任しなければならない。</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① 資格を保有</p>\n<p class=\"opt\">② 組織に所属</p>\n<p class=\"opt\">③ 講習を修了</p>\n<p class=\"opt\">④ 業務を監督</p>\n<p class=\"opt\">⑤ 決定に参画</p>\n<p class=\"opt\">⑥ 施策を実行</p>\n<p class=\"opt\">⑦ 部門を統括</p>\n<p class=\"opt\">⑧ 技術の習得</p>\n<p class=\"opt\">⑨ 実務の経験</p>\n<p class=\"opt\">⑩ 専門的な知識</p>"}, {"tag": "R5-2", "title": "令和５年度 第２回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法又は電気通信事業法施行規則に規定する事項について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信設備とは、電気通信を行うための機械、器具、線路その他の電気的設備をいう。</p>\n<p class=\"opt\">② 音声伝送役務とは、おおむね４キロヘルツ帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう。</p>\n<p class=\"opt\">③ 電気通信事業に従事する者は、在職中電気通信事業者の取扱中に係る通信に関して知り得た他人の秘密を守らなければならない。その職を退いた後においても、同様とする。</p>\n<p class=\"opt\">④ 電気通信事業者は、重要通信の円滑な実施を他の電気通信事業者と相互に連携を図りつつ確保するため、他の電気通信事業者と電気通信設備を相互に接続する場合には、電気通信事業者の事業の規模又は業務区域に応じて、重要通信の優先的な取扱いについて取り決めることその他の必要な措置を講じなければならない。</p>\n<p class=\"opt\">⑤ 総務大臣は、電気通信事業者が管理規程を遵守していないと認めるときは、当該電気通信事業者に対し、電気通信役務の確実かつ安定的な提供を確保するために必要な限度において、管理規程を遵守すべきことを命ずることができる。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信事業法に規定する｢基礎的電気通信役務の提供｣について述べたものである。同法の規定に照らして、 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)基礎的電気通信役務とは、国民生活に不可欠であるためあまねく日本全国における提供が確保されるべき次の(ⅰ)、(ⅱ)に掲げる電気通信役務をいう。</p>\n<p class=\"item\">(ⅰ) (イ) に係る電気通信役務であって総務省令で定めるもの(第一号基礎的電気通信役務という。)</p>\n<p class=\"item\">(ⅱ) (ウ) 電気通信役務であって総務省令で定めるもの(第二号基礎的電気通信役務という。)</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 卸</p>\n<p class=\"opt\">② 指定</p>\n<p class=\"opt\">③ 緊急通報</p>\n<p class=\"opt\">④ ドメイン名</p>\n<p class=\"opt\">⑤ 電話</p>\n<p class=\"opt\">⑥ 携帯電話</p>\n<p class=\"opt\">⑦ 重要通信</p>\n<p class=\"opt\">⑧ 災害時優先通信</p>\n<p class=\"opt\">⑨ 移動</p>\n<p class=\"opt\">⑩ 高速度データ伝送</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢電気通信事業の登録｣及び｢登録の取消し｣について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業を営もうとする者は、総務大臣の登録を受けなければならない。ただし、その者の設置する電気通信回線設備の規模及び当該電気通信回線設備を設置する区域の人口が総務省令で定める基準を超えない場合は、この限りでない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業を営もうとして総務大臣の登録を受けようとする者は、総務省令で定めるところにより、次の事項を記載した申請書を総務大臣に提出しなければならない。</p>\n<p class=\"item\">(ⅰ) 氏名又は名称及び住所並びに法人にあっては、その代表者の氏名</p>\n<p class=\"item\">(ⅱ) 外国法人等(外国の法人及び団体並びに外国に住所を有する個人をいう。)にあっては、国内における代表者又は国内における代理人の氏名又は名称及び国内の住所</p>\n<p class=\"item\">(ⅲ) 業務区域</p>\n<p class=\"item\">(ⅳ) 電気通信設備の概要</p>\n<p class=\"item\">(ⅴ) その他総務省令で定める事項</p>\n<p class=\"stmt\">Ｃ 総務大臣は、電気通信事業の登録を受けた者が電気通信事業法又は同法に基づく命令若しくは処分に違反した場合において、１０日以内に業務の改善が図られないと認めるときは、電気通信事業の登録を取り消すことができる。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法の｢端末設備の接続の技術基準｣に基づき総務省令で定める技術基準により確保されなければならない事項について述べた次のＡ～Ｃの文章は、 (オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信回線設備を損傷し、又はその機能に障害を与えないようにすること。</p>\n<p class=\"stmt\">Ｂ 電気通信回線設備を利用する他の利用者に迷惑を及ぼさないようにすること。</p>\n<p class=\"stmt\">Ｃ 電気通信事業者の設置する電気通信回線設備と利用者の接続する端末設備との接続条件が開示されていること。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の(ⅰ)及び(ⅱ)の文章は、電気通信事業法施行規則に規定する緊急に行うことを要する通信について述べたものである。同規則の規定に照らして、 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 気象、水象、地象若しくは (カ) の報告又は警報に関する事項であって、緊急に通報することを要する事項を内容とする通信で、気象機関相互間において行われるものは該当する通信である。</p>\n<p class=\"item\">(ⅱ) 水道、ガス等の国民の日常生活に必要不可欠な (キ) その他生活基盤を維持するため緊急を要する事項を内容とする通信であって、これらの通信を行う者相互間において行われるものは該当する通信である。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 地動の観測</p>\n<p class=\"opt\">② 火山噴火の予兆</p>\n<p class=\"opt\">③ 通信の確保</p>\n<p class=\"opt\">④ 天象の変化</p>\n<p class=\"opt\">⑤ 災害の予防</p>\n<p class=\"opt\">⑥ 生活物資の調達</p>\n<p class=\"opt\">⑦ 役務の提供</p>\n<p class=\"opt\">⑧ 情報の共有</p>\n<p class=\"opt\">⑨ 海象の異常</p>\n<p class=\"opt\">⑩ ライフラインの復旧</p>"}, {"tag": "R6-1", "title": "令和６年度 第１回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、電気通信事業法の｢目的｣について述べたものである。 □内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電気通信事業法は、電気通信事業の公共性に鑑み、その運営を適正かつ (ア) なものとするとともに、その公正な競争を促進することにより、電気通信役務の円滑な提供を確保するとともにその (イ) し、もって電気通信の健全な発達及び国民の利便の確保を図り、公共の福祉を増進することを目的とする。</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 通信の秘密を保護</p>\n<p class=\"opt\">② サービスの品質を維持</p>\n<p class=\"opt\">③ 妥当</p>\n<p class=\"opt\">④ 正当</p>\n<p class=\"opt\">⑤ 事業の秩序を維持</p>\n<p class=\"opt\">⑥ 能率的</p>\n<p class=\"opt\">⑦ 合理的</p>\n<p class=\"opt\">⑧ 安定的</p>\n<p class=\"opt\">⑨ 利用の公平を確保</p>\n<p class=\"opt\">⑩ 利用者等の利益を保護</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法に規定する用語について述べた次の文章のうち、誤っているものは、 (ウ)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信設備とは、電気通信を行うための機械、器具、線路その他の電気的設備をいう。</p>\n<p class=\"opt\">② 電気通信役務とは、国民生活に不可欠であるためあまねく日本全国における提供が確保されるべきものとして総務省令で定める電気通信サービスを提供する役務をいう。</p>\n<p class=\"opt\">③ 電気通信事業とは、電気通信役務を他人の需要に応ずるために提供する事業(放送法に規定する放送局設備供給役務に係る事業を除く。)をいう。</p>\n<p class=\"opt\">④ 電気通信事業者とは、電気通信事業を営むことについて、電気通信事業法の規定による登録を受けた者及び同法の規定による届出をした者をいう。</p>\n<p class=\"opt\">⑤ 端末設備とは、電気通信回線設備の一端に接続される電気通信設備であって、一の部分の設置の場所が他の部分の設置の場所と同一の構内(これに準ずる区域内を含む。)又は同一の建物内であるものをいう。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢業務の停止等の報告｣、｢管理規程｣、｢電気通信主任技術者｣又は｢電気通信主任技術者等の義務｣について述べた次の文章のうち、正しいものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業者は、電気通信業務に関し総務省令で定める重大な事故が生ずるおそれがあると認められる事態として総務省令で定めるものが生じたと認めたときは、その旨をその理由又は原因とともに、遅滞なく、総務大臣に報告しなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、総務省令で定めるところにより、事業用電気通信設備の管理規程を定め、電気通信事業の開始後、２０日以内に、総務大臣に届け出なければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、事業用電気通信設備を技術基準に適合するように維持するため、総務省令で定めるところにより、電気通信主任技術者資格者証の交付を受けている者のうちから、電気通信主任技術者を選任しなければならない。ただし、その事業用電気通信設備が小規模である場合その他の総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信主任技術者のその職務を行う事業場における事業用電気通信設備の工事、維持又は運用に関する助言を尊重しなければならず、事業用電気通信設備の工事、維持又は運用に従事する者は、電気通信主任技術者がその職務を行うため必要であると認めてする意見を尊重しなければならない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法施行規則に規定する用語について述べた次のＡ～Ｃの文章は、 (オ) 。(４点)</p>\n<p class=\"stmt\">Ａ データ伝送役務とは、専ら符号又は影像を伝送交換するための電気通信設備を他人の通信の用に供する電気通信役務をいう。</p>\n<p class=\"stmt\">Ｂ 特定移動通信役務とは、電気通信事業法に規定する特定移動端末設備を他人の通信の用に供する電気通信役務をいう。</p>\n<p class=\"stmt\">Ｃ 端末系伝送路設備とは、専ら専用役務を提供するために設置される伝送路設備をいう。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信事業法施行規則の｢重要通信の優先的取扱いについての取り決めるべき事項｣に規定する、電気通信事業者が、他の電気通信事業者と電気通信設備を相互に接続する場合に、当該他の電気通信事業者との間で取り決めなければならない事項について述べた次のＡ～Ｃの文章は、(カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 重要通信を確保するために必要があるときは、業務区域の範囲の一部を制限し、その旨を速やかに総務大臣に届け出ること。</p>\n<p class=\"stmt\">Ｂ 電気通信設備の工事又は保守等により相互に接続する電気通信設備の接続点における重要通信の取扱いを一時的に中断する場合は、その日時及び理由を速やかに総務大臣に届け出ること。</p>\n<p class=\"stmt\">Ｃ 重要通信を識別することができるよう重要通信に付される信号を識別した場合は、当該重要通信を優先的に取り扱うこと。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R6-2", "title": "令和６年度 第２回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法又は電気通信事業法施行規則に規定する用語について述べた次の文章のうち、正しいものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信とは、有線、無線その他の電気的方式により、符号、音声又は影像を送り、伝え、又は転送することをいう。</p>\n<p class=\"opt\">② 電気通信事業とは、電気通信回線設備を他人に提供する事業をいう。</p>\n<p class=\"opt\">③ 電気通信業務とは、電気通信事業者の行う電気通信設備の維持及び運用に係る業務をいう。</p>\n<p class=\"opt\">④ 電気通信回線設備とは、送信の場所と受信の場所との間を接続する伝送路設備及びこれと一体として設置される線路設備並びにこれらの附属設備をいう。</p>\n<p class=\"opt\">⑤ 音声伝送役務とは、おおむね４キロヘルツ帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法の｢基礎的電気通信役務の届出契約約款｣に規定する、総務大臣が、該当すると認めるときに電気通信事業者に対し、相当の期限を定め、基礎的電気通信役務の届出契約約款を変更すべきことを命ずることができる場合について述べた次のＡ～Ｃの文章は、 (イ) 。(４点)</p>\n<p class=\"stmt\">Ａ 重要通信に関する事項について適切に配慮されているものでないとき。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者及びその利用者の責任に関する事項並びに電気通信設備の設置の工事その他の工事に関する費用の負担の方法が適正かつ明確に定められていないとき。</p>\n<p class=\"stmt\">Ｃ 他の電気通信事業者との間に不当な競争を引き起こすものであり、その他社会的経済的事情に照らして著しく不適当であるため、利用者の利益を阻害するものであるとき。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法の｢電気通信設備の維持｣に基づき総務省令で定める技術基準により確保されなければならない事項について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信役務の品質が適正であるようにすること。</p>\n<p class=\"stmt\">Ｂ 電気通信設備の損壊又は故障により、電気通信役務の提供に著しい支障を及ぼさないようにすること。</p>\n<p class=\"stmt\">Ｃ 利用者又は他の電気通信事業者の接続する電気通信設備を損傷し、又は人体に危害を及ぼさないようにすること。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法に規定する ｢電気通信主任技術者等の義務 ｣、 ｢電気通信設備統括管理者 ｣又は ｢電気通信設備統括管理者等の義務｣について述べた次の文章のうち、誤っているものは、 (エ)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業者は、電気通信主任技術者のその職務を行う事業場における事業用電気通信設備の工事、維持又は運用に関する助言を尊重しなければならず、事業用電気通信設備の工事、維持又は運用に従事する者は、電気通信主任技術者がその職務を行うため必要であると認めてする指示に従わなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、総務省令で定める期間ごとに、電気通信主任技術者に、登録講習機関が行う事業用電気通信設備の工事、維持及び運用に関する事項の監督に関する講習を受けさせなければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、管理規程に定めた事項に関する業務を統括管理させるため、事業運営上の重要な決定に参画する管理的地位にあり、かつ、電気通信設備の管理に関する一定の実務の経験その他の総務省令で定める要件を備える者のうちから、総務省令で定めるところにより、電気通信設備統括管理者を選任しなければならない。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信設備統括管理者を選任し、又は解任したときは、総務省令で定めるところにより、遅滞なく、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"opt\">⑤ 電気通信設備統括管理者は、誠実にその職務を行わなければならない。電気通信事業者は、電気通信役務の確実かつ安定的な提供の確保に関し、電気通信設備統括管理者のその職務を行う上での指示に従わなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信事業法に規定する｢業務の停止等の報告｣及び電気通信事業法施行規則に規定する｢報告を要する事故｣について述べたものである。 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電気通信事業者は、電気通信業務に関し総務省令で定める重大な事故が生じたときは、その旨をその理由又は原因とともに、遅滞なく、総務大臣に報告しなければならない。上記の総務省令で定める報告を要する重大な事故の一つに、以下の表に掲げる電気通信役務の区分において、同表に掲げる時間以上電気通信設備の故障により電気通信役務の全部又は一部の提供を停止又は品質を低下させた事故であって、その影響を受けた利用者の数が同表に掲げる数以上のものがある。電気通信役務の区分時間利用者の数緊急通報を取り扱う音声伝送役務 (オ) (カ)</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① １時間</p>\n<p class=\"opt\">② ９０分</p>\n<p class=\"opt\">③ ２時間</p>\n<p class=\"opt\">④ ３時間</p>\n<p class=\"opt\">⑤ ５時間</p>\n<p class=\"opt\">⑥ １万</p>\n<p class=\"opt\">⑦ ２万</p>\n<p class=\"opt\">⑧ ３万</p>\n<p class=\"opt\">⑨ ５万</p>\n<p class=\"opt\">⑩ １０万</p>"}, {"tag": "R7-1", "title": "令和７年度 第１回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法に規定する｢重要通信の確保｣、｢業務の停止等の報告｣、｢電気通信主任技術者｣又は｢電気通信設備の維持｣について述べた次の文章のうち、正しいものは、 (ア) である。(４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業者は、重要通信の円滑な実施を他の電気通信事業者と相互に連携を図りつつ確保するため、他の電気通信事業者と電気通信設備を相互に接続する場合には、電気通信事業者の事業の規模又は業務区域に応じて、重要通信の優先的な取扱いについて取り決めることその他の必要な措置を講じなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、電気通信事業法の規定により電気通信業務の一部を停止したときは、その旨をその経緯及び対応状況とともに、遅滞なく、総務大臣に報告しなければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、事業用電気通信設備を技術基準に適合するように維持するため、総務省令で定めるところにより、電気通信主任技術者資格者証の交付を受けている者のうちから、電気通信主任技術者を選任しなければならない。ただし、その事業用電気通信設備が小規模である場合その他の総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">④ 電気通信回線設備を設置する電気通信事業者は、その電気通信事業の用に供する電気通信設備(専らドメイン名電気通信役務を提供する電気通信事業の用に供するもの及びその損壊又は故障等による利用者の利益に及ぼす影響が軽微なものとして総務省令で定めるものを除く。)を総務省令で定める技術基準に適合するように維持しなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信事業法に規定する｢管理規程｣について述べたものである。 内の (イ )、 (ウ )に最も適したものを 、 下記の解答群から選び 、 その番号を記せ 。 (２点×２＝４点)管理規程は、電気通信役務の確実かつ安定的な提供を確保するために電気通信事業者が遵守すべき次の(ⅰ)～(ⅳ)に掲げる事項に関し、総務省令で定めるところにより、必要な内容を定めたものでなければならない。</p>\n<p class=\"item\">(ⅰ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の管理の(イ) に関する事項</p>\n<p class=\"item\">(ⅱ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の管理の体制に関する事項</p>\n<p class=\"item\">(ⅲ) 電気通信役務の確実かつ安定的な提供を確保するための事業用電気通信設備の管理の方法に関する事項</p>\n<p class=\"item\">(ⅳ) 電気通信事業法に規定する (ウ) の選任に関する事項</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信主任技術者</p>\n<p class=\"opt\">② 計画</p>\n<p class=\"opt\">③ 目的</p>\n<p class=\"opt\">④ 概要</p>\n<p class=\"opt\">⑤ 電気通信設備統括管理者</p>\n<p class=\"opt\">⑥ 監理技術者</p>\n<p class=\"opt\">⑦ 基準</p>\n<p class=\"opt\">⑧ 方針</p>\n<p class=\"opt\">⑨ 認定電気通信事業者</p>\n<p class=\"opt\">⑩ 電気通信工事施工管理技士</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法の｢電気通信回線設備との接続｣に規定する、電気通信事業者が、他の電気通信事業者から当該他の電気通信事業者の電気通信設備をその設置する電気通信回線設備に接続すべき旨の請求を受けたとき、その請求に応じなくてもよい場合について述べた次のＡ～Ｃの文章は、(エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 当該電気通信事業者が契約約款で定める正当な理由があるとき。</p>\n<p class=\"stmt\">Ｂ 当該接続が当該電気通信事業者の利益を不当に害するおそれがあるとき。</p>\n<p class=\"stmt\">Ｃ 電気通信役務の円滑な提供に支障が生ずるおそれがあるとき。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法の｢業務の改善命令｣に規定する、総務大臣が、該当すると認めるときは、電気通信事業者に対し、利用者の利益又は公共の利益を確保するために必要な限度において、業務の方法の改善その他の措置をとるべきことを命ずることができる場合について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 事故により電気通信役務の提供に支障が生ずるおそれがある場合に電気通信事業者がその支障をあらかじめ回避するために必要な修理その他の措置を速やかに行わないとき。</p>\n<p class=\"opt\">② 電気通信回線設備を設置することなく電気通信役務を提供する電気通信事業の経営によりこれと電気通信役務に係る需要を共通とする電気通信回線設備を設置して電気通信役務を提供する電気通信事業の当該需要に係る電気通信回線設備の保持が経営上困難となるため、公共の利益が著しく阻害されるおそれがあるとき。</p>\n<p class=\"opt\">③ 電気通信事業者が国際電気通信事業に関する条約その他の国際約束により課された義務を誠実に履行していないため、公共の利益が著しく阻害されるおそれがあるとき。</p>\n<p class=\"opt\">④ 電気通信事業者が電気通信設備の接続、共用又は卸電気通信役務の提供について特定の電気通信事業者に対し不当な差別的取扱いを行いその他これらの業務に関し不当な運営を行っていることにより他の電気通信事業者の業務の適正な実施に支障が生じているため、公共の利益が著しく阻害されるおそれがあるとき。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信事業法施行規則に規定する緊急に行うことを要する通信について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 国会議員又は地方公共団体の長若しくはその議会の議員の選挙の執行又はその結果に関し、緊急を要する事項を内容とする通信であって、新聞社等の機関相互間において行われるものは規定に該当する通信である。</p>\n<p class=\"stmt\">Ｂ 火災、集団的疫病、交通機関の重大な事故その他人命の安全に係る事態が発生し、又は発生するおそれがある場合において、その予防、救援、復旧等に関し、緊急を要する事項を内容とする通信であって、これらの事態が発生し、又は発生するおそれがあることを知った者と予防、救援、復旧等に直接関係がある機関との間において行われるものは規定に該当する通信である。</p>\n<p class=\"stmt\">Ｃ 水道、ガス等の国民の日常生活に必要不可欠な役務の提供その他生活基盤を維持するため緊急を要する事項を内容とする通信であって、これらの通信を行う者相互間において行われるものは規定に該当する通信である。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R7-2", "title": "令和７年度 第２回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信事業法又は電気通信事業法施行規則に規定する用語について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業とは、電気通信役務を他人の需要に応ずるために提供する事業(放送法に規定する放送局設備供給役務に係る事業を除く。)をいう。</p>\n<p class=\"opt\">② 電気通信役務とは、電気通信設備を用いて他人の通信を媒介し、その他電気通信設備を他人の通信の用に供することをいう。</p>\n<p class=\"opt\">③ 音声伝送役務とは、おおむね４キロヘルツ帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であって専用役務以外のものをいう。</p>\n<p class=\"opt\">④ 特定移動通信役務とは、電気通信事業法に規定する特定移動端末設備と接続される伝送路設備を用いる電気通信役務をいう。</p>\n<p class=\"opt\">⑤ データ伝送役務とは、専ら符号又は影像を伝送交換するための電気通信設備を他人の通信の用に供する電気通信役務をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信事業法に規定する｢基礎的電気通信役務の提供｣について述べたものである。同法の規定に照らして、 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)基礎的電気通信役務とは、国民生活に不可欠であるためあまねく日本全国における提供が確保されるべき次の(ⅰ)、(ⅱ)に掲げる電気通信役務をいう。</p>\n<p class=\"item\">(ⅰ) (イ) に係る電気通信役務であって総務省令で定めるもの(第一号基礎的電気通信役務という。)</p>\n<p class=\"item\">(ⅱ) (ウ) 電気通信役務であって総務省令で定めるもの(第二号基礎的電気通信役務という。)</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 卸</p>\n<p class=\"opt\">② 電話</p>\n<p class=\"opt\">③ 緊急通報</p>\n<p class=\"opt\">④ ドメイン名</p>\n<p class=\"opt\">⑤ 指定</p>\n<p class=\"opt\">⑥ 携帯電話</p>\n<p class=\"opt\">⑦ 重要通信</p>\n<p class=\"opt\">⑧ 高速度データ伝送</p>\n<p class=\"opt\">⑨ 移動</p>\n<p class=\"opt\">⑩ 災害時優先通信</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢電気通信事業の登録｣、｢登録の取消し｣などについて述べた次の文章のうち、正しいものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業を営もうとする者は、総務大臣の登録を受けなければならない。ただし、その者の設置する電気通信回線設備の規模及び当該電気通信回線設備を設置する区域の範囲が総務省令で定める基準を超えない場合は、この限りでない。</p>\n<p class=\"opt\">② 電気通信事業を営もうとして総務大臣の登録を受けようとする者は、総務省令で定めるところにより、次の事項を記載した申請書を総務大臣に提出しなければならない。</p>\n<p class=\"item\">(ⅰ) 氏名又は名称及び住所並びに法人にあっては、その代表者の氏名</p>\n<p class=\"item\">(ⅱ) 外国法人等(外国の法人及び団体並びに外国に住所を有する個人をいう。)にあっては、国内における代表者又は国内における代理人の氏名又は名称及び国内の住所</p>\n<p class=\"item\">(ⅲ) 電気通信の方式の別</p>\n<p class=\"item\">(ⅳ) 電気通信設備の概要</p>\n<p class=\"item\">(ⅴ) その他総務省令で定める事項</p>\n<p class=\"opt\">③ 総務大臣は、電気通信事業の登録を受けた者が電気通信事業法又は同法に基づく命令若しくは処分に違反した場合において、国民の利便の確保を阻害すると認めるときは、電気通信事業の登録を取り消すことができる。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信事業の全部又は一部を休止し、又は廃止しようとするときは、総務大臣の認可を受けなければならない。</p>\n<p class=\"opt\">⑤ 総務大臣は、事故により電気通信役務の提供に支障が生ずるおそれがある場合に電気通信事業者がその支障をあらかじめ回避するために必要な修理その他の措置を速やかに行わないと認めるときは、当該電気通信事業者に対し、利用者の利益又は公共の利益を確保するために必要な限度において、業務の方法の改善その他の措置をとるべきことを命ずることができる。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法の｢電気通信設備の維持｣に基づき総務省令で定める技術基準により確保されなければならない事項について述べた次のＡ～Ｃの文章は、 (オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 利用者又は他の電気通信事業者の接続する電気通信設備を損傷し、又は人体に危害を及ぼさないようにすること。</p>\n<p class=\"stmt\">Ｂ 電気通信設備の損壊又は故障により、電気通信役務の提供に著しい支障を及ぼさないようにすること。</p>\n<p class=\"stmt\">Ｃ 電気通信役務の提供が公平であるようにすること。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信事業法に規定する｢電気通信設備統括管理者｣について述べたものである。同法の規定に照らして、 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電気通信事業者は、管理規程に定めた事項に関する業務を統括管理させるため、事業運営上の重要な (カ) する管理的地位にあり、かつ、電気通信設備の管理に関する一定の(キ) その他の総務省令で定める要件を備える者のうちから、総務省令で定めるところにより、電気通信設備統括管理者を選任しなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 資格の保有</p>\n<p class=\"opt\">② 決定に参画</p>\n<p class=\"opt\">③ 法令の理解</p>\n<p class=\"opt\">④ 業務を監督</p>\n<p class=\"opt\">⑤ 改善を命令</p>\n<p class=\"opt\">⑥ 施策を実行</p>\n<p class=\"opt\">⑦ 実務の経験</p>\n<p class=\"opt\">⑧ 部門を統括</p>\n<p class=\"opt\">⑨ 技術の習得</p>\n<p class=\"opt\">⑩ 専門的な知識</p>"}, {"tag": "R8-1", "title": "令和８年度 第１回", "html": "<h3 class=\"q-h\">問１ 次の各問いは、｢電気通信事業法｣又は｢電気通信事業法施行規則｣に規定する内容に関するものである。同法又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 総務大臣が、該当すると認めるときに電気通信事業者に対し、相当の期限を定め、基礎的電気通信役務の届出契約約款を変更すべきことを命ずることができる場合について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 料金の額の算出方法が適正かつ明確に定められていないとき。</p>\n<p class=\"opt\">② 電気通信回線設備の使用の態様を不当に制限するものであるとき。</p>\n<p class=\"opt\">③ 重要通信に関する事項について適切に配慮されているものでないとき。</p>\n<p class=\"opt\">④ 他の電気通信事業者の電気通信設備と相互に接続する方法が適正かつ明確に定められていないものであり、その他社会的経済的事情に照らして著しく不適当であるため、利用者の利益を阻害するものであるとき。</p>\n<p class=\"opt\">⑤ 電気通信事業者及びその利用者の責任に関する事項並びに電気通信設備の設置の工事その他の工事に関する費用の負担の方法が適正かつ明確に定められていないとき。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信事業法に規定する｢検閲の禁止｣、｢重要通信の確保｣及び｢秘密の保護｣について述べた次のＡ～Ｃの文章は、 (イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業者の取扱中に係る通信は、犯罪捜査に必要であると総務大臣が認めた場合を除き、検閲してはならない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、災害の予防若しくは救援、交通、通信若しくは電力の供給の確保又は秩序の維持のために必要な事項を内容とする通信を優先的に取り扱わなければならない。公共の利益のため緊急に行うことを要するその他の通信であって総務省令で定めるものについても、同様とする。</p>\n<p class=\"stmt\">Ｃ 電気通信事業者の取扱中に係る通信の秘密は、侵してはならない。電気通信事業に従事する者は、在職中電気通信事業者の取扱中に係る通信に関して知り得た他人の秘密を守らなければならない。ただし、その職を退いた後においては、この限りでない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信事業法に規定する｢電気通信主任技術者等の義務｣及び｢電気通信設備統括管理者等の義務｣について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信主任技術者は、事業用電気通信設備の工事、維持及び運用に関する事項の監督の職務を誠実に行わなければならない。電気通信事業者は、電気通信主任技術者に対し、その職務の執行に必要な権限を与えなければならない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者は、電気通信主任技術者のその職務を行う事業場における事業用電気通信設備の工事、維持又は運用に関する助言を尊重しなければならず、事業用電気通信設備の工事、維持又は運用に従事する者は、電気通信主任技術者がその職務を行うため必要であると認めてする指導を守るよう努めなければならない。</p>\n<p class=\"stmt\">Ｃ 電気通信設備統括管理者は、誠実にその職務を行わなければならない。電気通信事業者は、電気通信役務の確実かつ安定的な提供の確保に関し、電気通信設備統括管理者のその職務を行う上での意見を尊重しなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信事業法に規定する｢端末設備の接続の技術基準｣について述べた次の文章のうち、誤っているものは、 (エ) である。ただし、技術基準には、電気通信回線設備を設置する電気通信事業者又は当該電気通信事業者とその電気通信設備を接続する他の電気通信事業者であって総務省令で定めるものが総務大臣の認可を受けて定める技術的条件を含む。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 端末設備とは、電気通信回線設備の一端に接続される電気通信設備であって、一の部分の設置の場所が他の部分の設置の場所と同一の構内(これに準ずる区域内を含む。)又は同一の建物内であるものをいう。</p>\n<p class=\"opt\">② 電気通信事業者は、利用者から端末設備をその電気通信回線設備(その損壊又は故障等による利用者の利益に及ぼす影響が軽微なものとして総務省令で定めるものを除く。)に接続すべき旨の請求を受けたときは、その接続が総務省令で定める技術基準に適合しない場合その他総務省令で定める場合を除き、その請求を拒むことができない。</p>\n<p class=\"opt\">③ 端末設備の接続の技術基準は、電気通信回線設備を損傷し、又はその機能に障害を与えないようにすることが確保されるものとして定められなければならない。</p>\n<p class=\"opt\">④ 端末設備の接続の技術基準は、電気通信回線設備を利用する他の利用者に迷惑を及ぼさないようにすることが確保されるものとして定められなければならない。</p>\n<p class=\"opt\">⑤ 端末設備の接続の技術基準は、電気通信事業者の設置する電気通信回線設備と利用者の接続する端末設備との接続条件が開示されていることが確保されるものとして定められなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の(ⅰ)及び(ⅱ)の文章は、電気通信事業法施行規則に規定する緊急に行うことを要する通信について述べたものである。同規則の規定に照らして、 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 気象、水象、地象若しくは地動の観測の報告又は (オ) に関する事項であって、緊急に通報することを要する事項を内容とする通信で、気象機関相互間において行われるものは規定に該当する通信である。</p>\n<p class=\"item\">(ⅱ) 水道、ガス等の国民の日常生活に必要不可欠な役務の提供その他 (カ) を維持するため緊急を要する事項を内容とする通信であって、これらの通信を行う者相互間において行われるものは規定に該当する通信である。</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① 予報</p>\n<p class=\"opt\">② 報道</p>\n<p class=\"opt\">③ 利用者の利益</p>\n<p class=\"opt\">④ 公共の福祉</p>\n<p class=\"opt\">⑤ 動向</p>\n<p class=\"opt\">⑥ 被害</p>\n<p class=\"opt\">⑦ 文化的な生活</p>\n<p class=\"opt\">⑧ 社会経済活動</p>\n<p class=\"opt\">⑨ 警報</p>\n<p class=\"opt\">⑩ 生活基盤</p>"}], "2": [{"tag": "R4-1", "title": "令和４年度 第１回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信主任技術者規則に規定する｢選任等の届出｣、｢電気通信主任技術者の選任等｣又は｢講習の期間｣について述べた次の文章のうち、正しいものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信事業法の規定による電気通信主任技術者の選任又は解任の届出をしようとする者は、別に定める様式の電気通信主任技術者選任又は解任届出書を事業場が所在する都道府県知事を経由して総務大臣に提出しなければならない。</p>\n<p class=\"opt\">② 電気通信事業法の規定による電気通信主任技術者の選任は、事業用電気通信設備(線路設備及びこれに附属する設備を除く。)については、これを直接に管理する事業場ごとに、それぞれ当該事業場に常に勤務する者であって、伝送交換主任技術者資格者証の交付を受けている者のうちから行うものとする。</p>\n<p class=\"opt\">③ 電気通信主任技術者に監督させる工事、維持及び運用に関する事項の一つとして、事業用電気通信設備の事故発生時の従事者への指揮及び命令並びに事故の収束後の影響利用者への対応に向けた計画の策定に関する事項がある。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信主任技術者資格者証の種類に応じ講習を受けた電気通信主任技術者に、その講習の行われた日の属する月の翌月の１日から起算して２年以内に講習を受けさせなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の(ⅰ)、(ⅱ)の文章は、電波法に規定する｢電波の質｣及び｢受信設備の条件｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 送信設備に使用する電波の周波数の偏差及び (イ) 、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。</p>\n<p class=\"item\">(ⅱ) 受信設備は、その副次的に発する電波又は高周波電流が、総務省令で定める限度をこえて他の無線設備の (ウ) を与えるものであってはならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 許容値</p>\n<p class=\"opt\">② 運用に妨害</p>\n<p class=\"opt\">③ 幅</p>\n<p class=\"opt\">④ 利用者に迷惑</p>\n<p class=\"opt\">⑤ 型式</p>\n<p class=\"opt\">⑥ 機能に支障</p>\n<p class=\"opt\">⑦ 電力</p>\n<p class=\"opt\">⑧ 誤差</p>\n<p class=\"opt\">⑨ 損壊又は故障の要因</p>\n<p class=\"opt\">⑩ 利便性の確保に不利益</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢連合の目的｣について述べた次のＡ～Ｃの文章は、 (エ) 。(４点)</p>\n<p class=\"stmt\">Ａ 電気通信の分野において開発途上国に対する技術援助を促進し及び提供すること、その実施に必要な物的資源、人的資源及び資金の移動を促進すること並びに情報の取得を促進すること。</p>\n<p class=\"stmt\">Ｂ 電気通信業務の能率を増進し、その有用性を増大し、及び公衆によるその利用をできる限り普及するため、技術的手段の発達及びその最も能率的な運用を促進すること。</p>\n<p class=\"stmt\">Ｃ すべての種類の電気通信の改善及び合理的利用のため、すべての構成国の間における国際協力を維持し及び増進すること。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する｢目的｣、｢定義｣、｢アクセス管理者による防御措置｣又は｢都道府県公安委員会による援助等｣について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① この法律は、不正アクセス行為を禁止するとともに、これについての罰則及びその再発防止のための都道府県公安委員会による援助措置等を定めることにより、電気通信回線を通じて行われるインターネットに関する犯罪の防止及びアクセス制御機能により実現される電気通信に関する秩序の維持を図り、もって電子商取引の健全な発展に寄与することを目的とする。</p>\n<p class=\"opt\">② アクセス制御機能を有する特定電子計算機に電気通信回線を通じて当該アクセス制御機能に係る他人の識別符号を入力して当該特定電子計算機を作動させ、当該アクセス制御機能により制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者又は当該識別符号に係る利用権者の承諾を得てするものを除く。)は、不正アクセス行為に該当する行為である。</p>\n<p class=\"opt\">③ アクセス制御機能を特定電子計算機に付加したアクセス管理者は、当該アクセス制御機能に係る識別符号又はこれを当該アクセス制御機能により確認するために用いる符号の適正な管理に努めるとともに、常に当該アクセス制御機能の有効性を検証し、必要があると認めるときは速やかにその機能の高度化その他当該特定電子計算機を不正アクセス行為から防御するため必要な措置を講ずるよう努めるものとする。</p>\n<p class=\"opt\">④ 国家公安委員会、総務大臣及び経済産業大臣は、アクセス制御機能を有する特定電子計算機の不正アクセス行為からの防御に資するため、毎年少なくとも１回、不正アクセス行為の発生状況及びアクセス制御機能に関する技術の研究開発の状況を公表するものとする。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電子署名及び認証業務に関する法律に規定する用語について述べた次のＡ～Ｃの文章は、(カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電子署名とは、電磁的記録に記録することができる情報について行われる措置であって、当該情報が当該措置を行った者の証明に係るものであることを示すためのものであること、並びに当該情報について認証が行われていないかどうかを確認することができるものであることのいずれの要件にも該当するものをいう。</p>\n<p class=\"stmt\">Ｂ 電磁的記録とは、電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。</p>\n<p class=\"stmt\">Ｃ 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを確認するために用いられる事項が当該利用者に係るものであることを証明する業務をいう。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R4-2", "title": "令和４年度 第２回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(ク)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の(ⅰ)～(ⅳ)は、電気通信主任技術者規則の｢電気通信主任技術者の選任等｣に規定する、電気通信主任技術者に監督させる事業用電気通信設備の工事、維持及び運用に関する業務の計画の立案並びにその計画に基づく業務の適切な実施に関して含むべき事項について述べたものである。同規則の規定に照らして、 □内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 工事の実施体制(工事の実施者及び設備の運用者による確認を含む。)及び工事の手順に関する事項</p>\n<p class=\"item\">(ⅱ) 運転又は操作の運用の監視に係る方針、体制及び方法に関する事項</p>\n<p class=\"item\">(ⅲ) 定期的な (ア) 及び更新に関する事項</p>\n<p class=\"item\">(ⅳ) 適正な (イ) の確保に関する事項</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 教育及び訓練計画の策定</p>\n<p class=\"opt\">② 設備容量</p>\n<p class=\"opt\">③ 重要通信</p>\n<p class=\"opt\">④ 利便性</p>\n<p class=\"opt\">⑤ 管理規程の実施状況の把握</p>\n<p class=\"opt\">⑥ 電力の供給</p>\n<p class=\"opt\">⑦ 保守記録の保存</p>\n<p class=\"opt\">⑧ 安全管理体制の点検</p>\n<p class=\"opt\">⑨ 通信の秘密</p>\n<p class=\"opt\">⑩ ソフトウェアのリスク分析</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する｢定義｣及び｢目的外使用の禁止等｣について述べた次のＡ～Ｃの文章は、(ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電波とは、３００万メガヘルツ以下の周波数の電磁波をいう。</p>\n<p class=\"stmt\">Ｂ 緊急通信とは、船舶又は航空機が重大かつ急迫の危険に陥った場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"stmt\">Ｃ 非常通信とは、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の(ⅰ)、(ⅱ)の文章は、国際電気通信連合憲章に規定する｢国際電気通信業務を利用する公衆の権利｣及び｢電気通信の秘密｣について述べたものである。同憲章の規定に照らして、□内の(エ)、(オ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 構成国は、公衆に対し、国際公衆通信業務によって通信する権利を承認する。各種類の通信において、業務、 (エ) は、すべての利用者に対し、いかなる優先権又は特恵も与えることなく同一とする。</p>\n<p class=\"item\">(ⅱ) 構成国は、国際通信の秘密を確保するため、使用される電気通信の (オ) するすべての可能な措置をとることを約束する。</p>\n<p class=\"cg-h\">&lt;(エ)、(オ)の解答群&gt;</p>\n<p class=\"opt\">① システムに適合</p>\n<p class=\"opt\">② 規約及び約款</p>\n<p class=\"opt\">③ 国際法に準拠</p>\n<p class=\"opt\">④ 方式及び機能</p>\n<p class=\"opt\">⑤ 犯罪防止に対応</p>\n<p class=\"opt\">⑥ 標準化に寄与</p>\n<p class=\"opt\">⑦ 料金及び保障</p>\n<p class=\"opt\">⑧ 維持及び運用</p>\n<p class=\"opt\">⑨ 技術基準に規定</p>\n<p class=\"opt\">⑩ サービス及び品質</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する ｢定義 ｣、 ｢不正アクセス行為を助長する行為の禁止｣などについて述べた次の文章のうち、誤っているものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信回線を介して接続された他の特定電子計算機が有するアクセス制御機能によりその特定利用を制限されている特定電子計算機に電気通信回線を通じてその制限を免れることができる情報又は指令を入力して当該特定電子計算機を作動させ、その制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者の承諾を得てするものを除く。)は、不正アクセス行為に該当する行為である。</p>\n<p class=\"opt\">② 何人も、業務その他正当な理由による場合を除いては、アクセス制御機能に係る他人の識別符号を、当該アクセス制御機能に係るアクセス管理者及び当該識別符号に係る利用権者以外の者に提供してはならない。</p>\n<p class=\"opt\">③ 何人も、不正アクセス行為の用に供する目的で、不正に取得されたアクセス制御機能に係る他人の識別符号を保管してはならない。</p>\n<p class=\"opt\">④ 何人も、アクセス制御機能を特定電子計算機に付加したアクセス管理者になりすまし、その他当該アクセス管理者であると誤認させて、当該アクセス管理者が当該アクセス制御機能に係る識別符号を付された利用権者に対し当該識別符号を特定電子計算機に入力することを求める旨の情報を、インターネットにより当該利用権者が閲覧できるようにする行為をしてはならない。ただし、当該アクセス管理者の承諾を得てする場合は、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電子署名及び認証業務に関する法律に規定する｢目的｣について述べたものである。□内の(キ)、(ク)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)電子署名及び認証業務に関する法律は、電子署名に関し、電磁的記録の (キ) 、特定認証業務に関する認定の制度その他必要な事項を定めることにより、電子署名の円滑な利用の確保による情報の電磁的方式による (ク) の促進を図り、もって国民生活の向上及び国民経済の健全な発展に寄与することを目的とする。</p>\n<p class=\"cg-h\">&lt;(キ)、(ク)の解答群&gt;</p>\n<p class=\"opt\">① 電子商取引</p>\n<p class=\"opt\">② 複製又は持出しの防止対策</p>\n<p class=\"opt\">③ 真正な成立の推定</p>\n<p class=\"opt\">④ 情報化の均衡ある発展</p>\n<p class=\"opt\">⑤ 不正利用の防止</p>\n<p class=\"opt\">⑥ 不正アクセス行為の禁止</p>\n<p class=\"opt\">⑦ 個人番号の利用</p>\n<p class=\"opt\">⑧ 保護及び適正な管理</p>\n<p class=\"opt\">⑨ 高度情報通信社会</p>\n<p class=\"opt\">⑩ 流通及び情報処理</p>"}, {"tag": "R5-1", "title": "令和５年度 第１回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の(ⅰ)～(ⅲ)は、電気通信主任技術者規則の｢電気通信主任技術者の選任等｣に規定する、事業用電気通信設備の事故発生時の従事者への指揮及び命令並びに事故の収束後の再発防止に向けた計画の策定に関して含むべき事項について述べたものである。同規則の規定に照らして、□内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 速やかな故障検知及び (ア) のために必要な対応に関する事項</p>\n<p class=\"item\">(ⅱ) 定型的な応急復旧措置に係る取組並びに製造業者等及び (イ) との連携に関する事項</p>\n<p class=\"item\">(ⅲ) 障害の極小化のための対策に関する事項</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 故障箇所の特定</p>\n<p class=\"opt\">② 故障復旧方法の策定</p>\n<p class=\"opt\">③ 運用部門</p>\n<p class=\"opt\">④ 故障原因の究明</p>\n<p class=\"opt\">⑤ 故障復旧体制の構築</p>\n<p class=\"opt\">⑥ 保守部門</p>\n<p class=\"opt\">⑦ 接続事業者</p>\n<p class=\"opt\">⑧ 工事業者</p>\n<p class=\"opt\">⑨ 保守業者</p>\n<p class=\"opt\">⑩ 影響を与えた利用者数の推計</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する用語について述べた次の文章のうち、正しいものは、 (ウ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 無線電話とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。</p>\n<p class=\"opt\">② 無線従事者とは、無線設備の操作又はその監督を行う者であって、総務大臣の許可を受けたものをいう。</p>\n<p class=\"opt\">③ 無線電信とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。</p>\n<p class=\"opt\">④ 無線局とは、無線設備及び無線設備の操作を行う者の総体をいい、受信のみを目的とするものを含まない。</p>\n<p class=\"opt\">⑤ 無線設備とは、無線電信、無線電話その他電波を利用して、他人の通信を媒介し、他人の通信の用に供するための電気的設備をいう。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢電気通信の停止｣及び｢電気通信路及び電気通信設備の設置、運用及び保護｣について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 構成国は、国内法令に従って、国の安全を害すると認められる私報又はその法令、公の秩序若しくは善良の風俗に反すると認められる私報の伝送を停止する権利を留保する。この場合には、私報の全部又は一部の停止を直ちに発信局に通知する。ただし、その通知が国の安全を害すると認められる場合は、この限りでない。</p>\n<p class=\"stmt\">Ｂ 構成国は、国際電気通信の迅速なかつ不断の交換を確保するために必要な通信路及び設備を最良の技術的条件で設置するため、有用な措置をとる。</p>\n<p class=\"stmt\">Ｃ 国際電気通信の迅速なかつ不断の交換を確保するために設置された通信路及び設備は、できる限り、実際の運用上の経験から最良と認められた方法及び手続によって運用し、良好に使用することができる状態に維持し、並びに科学及び技術の進歩に合わせて進歩していくようにしなければならない。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する事項について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① この法律は、不正アクセス行為を禁止するとともに、これについての罰則及びその再発防止のための都道府県公安委員会による援助措置等を定めることにより、電気通信回線を通じて行われる電子計算機に係る犯罪の防止及びアクセス制御機能により実現される電気通信に関する秩序の維持を図り、もって高度情報通信社会の健全な発展に寄与することを目的とする。</p>\n<p class=\"opt\">② 電気通信回線を介して接続された他の特定電子計算機が有するアクセス制御機能によりその特定利用を制限されている特定電子計算機に電気通信回線を通じてその制限を免れることができる情報又は指令を入力して当該特定電子計算機を作動させ、その制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者の承諾を得てするものを除く。)は、不正アクセス行為に該当する行為である。</p>\n<p class=\"opt\">③ アクセス制御機能を特定電子計算機に付加したアクセス管理者は、当該アクセス制御機能に係る識別符号又はこれを当該アクセス制御機能により転送するために用いる符号の適正な管理に努めるとともに、常に当該アクセス制御設備の保守管理を励行し、必要があると認めるときは速やかにその機能の高度化その他当該特定電子計算機を不正アクセス行為から防御するため必要な措置を講ずるよう努めるものとする。</p>\n<p class=\"opt\">④ 国家公安委員会、総務大臣及び経済産業大臣は、アクセス制御機能を有する特定電子計算機の不正アクセス行為からの防御に資するため、毎年少なくとも１回、不正アクセス行為の発生状況及びアクセス制御機能に関する技術の研究開発の状況を公表するものとする。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電子署名及び認証業務に関する法律に規定する電子署名の定義について述べたものである。 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電子署名とは、電磁的記録(電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。)に (カ) について行われる措置であって、次の要件のいずれにも該当するものをいう。</p>\n<p class=\"item\">(ⅰ) 当該情報が当該措置を行った者の (キ) に係るものであることを示すためのものであること。</p>\n<p class=\"item\">(ⅱ) 当該情報について改変が行われていないかどうかを確認することができるものであること。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 登録することができる氏名</p>\n<p class=\"opt\">② 所有</p>\n<p class=\"opt\">③ 申請</p>\n<p class=\"opt\">④ 要求</p>\n<p class=\"opt\">⑤ 記録することができる情報</p>\n<p class=\"opt\">⑥ 利用</p>\n<p class=\"opt\">⑦ 変換することができる暗号</p>\n<p class=\"opt\">⑧ 保存することができる文書</p>\n<p class=\"opt\">⑨ 作成</p>\n<p class=\"opt\">⑩ 接続することができる情報</p>"}, {"tag": "R5-2", "title": "令和５年度 第２回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信主任技術者規則に規定する｢資格者証の交付の申請｣、｢資格者証の再交付｣及び｢資格者証の返納｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 資格者証の交付の申請は、試験に合格した日、電気通信主任技術者資格の養成課程を修了した日又は電気通信主任技術者資格の認定を受けた日から３月以内に行わなければならない。</p>\n<p class=\"stmt\">Ｂ 資格者証の交付を受けている者は、氏名に変更を生じたとき又は資格者証を汚し、破り若しくは失ったために資格者証の再交付の申請をしようとするときは、所定の様式の申請書に資格者証(資格者証を失った場合を除く。)、写真１枚及び氏名の変更の事実を証する書類(氏名に変更を生じたときに限る。)を添えて、総務大臣に提出しなければならない。</p>\n<p class=\"stmt\">Ｃ 電気通信事業法の規定により資格者証の返納を命ぜられた者は、その処分を受けた日から２週間以内にその資格者証を総務大臣に返納しなければならない。資格者証の再交付を受けた後、失った資格者証を発見したときも同様とする。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法の｢目的外使用の禁止等｣において規定する用語について述べた次のＡ～Ｃの文章は、(イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 遭難通信とは、船舶又は航空機が重大かつ急迫の危険に陥るおそれがある場合その他緊急の事態が発生するおそれがある場合に遭難信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"stmt\">Ｂ 安全通信とは、船舶又は航空機の航行に対する重大な危険を予防するために安全信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"stmt\">Ｃ 非常通信とは、地震、台風、洪水、津波、雪害、火災、暴動その他非常の事態が発生し、又は発生するおそれがある場合において、有線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢国際電気通信業務を利用する公衆の権利｣、｢電気通信の停止｣又は｢電気通信路及び電気通信設備の設置、運用及び保護｣について述べた次の文章のうち 、誤っているものは、 (ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 構成国は、公衆に対し、国際公衆通信業務によって通信する権利を承認する。各種類の通信において、業務、料金及び保障は、すべての利用者に対し、いかなる優先権又は特恵も与えることなく同一とする。</p>\n<p class=\"opt\">② 構成国は、国内法令に従って、国の安全を害すると認められる私報又はその法令、公の秩序若しくは善良の風俗に反すると認められる私報の伝送を停止する権利を留保する。この場合には、私報の全部又は一部の停止を直ちに発信局に通知する。ただし、その通知が国の安全を害すると認められる場合は、この限りでない。</p>\n<p class=\"opt\">③ 構成国は、国内法令に従って、他の私用の電気通信であって基本的人権を侵害すると認められるもの又はその法令、公の秩序若しくは善良の風俗に反すると認められるものを切断する権利を留保する。</p>\n<p class=\"opt\">④ 構成国は、国際電気通信の迅速なかつ不断の交換を確保するために必要な通信路及び設備を最良の技術的条件で設置するため、有用な措置をとる。</p>\n<p class=\"opt\">⑤ 国際電気通信の迅速なかつ不断の交換を確保するために設置された通信路及び設備は、できる限り、実際の運用上の経験から最良と認められた方法及び手続によって運用し、良好に使用することができる状態に維持し、並びに科学及び技術の進歩に合わせて進歩していくようにしなければならない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する｢目的｣、｢識別符号の入力を不正に要求する行為の禁止｣又は｢定義｣について述べた次の文章のうち、誤っているものは、 (エ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① この法律は、不正アクセス行為を禁止するとともに、これについての罰則及びその再発防止のための都道府県公安委員会による援助措置等を定めることにより、電気通信回線を通じて行われるインターネットに関する犯罪の防止及びアクセス制御機能により実現される電気通信に関する秩序の維持を図り、もって電子商取引の健全な発展に寄与することを目的とする。</p>\n<p class=\"opt\">② 何人も、アクセス制御機能を特定電子計算機に付加したアクセス管理者になりすまし、その他当該アクセス管理者であると誤認させて、当該アクセス管理者が当該アクセス制御機能に係る識別符号を付された利用権者に対し当該識別符号を特定電子計算機に入力することを求める旨の情報を、電子メールにより当該利用権者に送信する行為をしてはならない。ただし、当該アクセス管理者の承諾を得てする場合は、この限りでない。</p>\n<p class=\"opt\">③ 電気通信回線を介して接続された他の特定電子計算機が有するアクセス制御機能によりその特定利用を制限されている特定電子計算機に電気通信回線を通じてその制限を免れることができる情報又は指令を入力して当該特定電子計算機を作動させ、その制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者の承諾を得てするものを除く。)は、不正アクセス行為に該当する。</p>\n<p class=\"opt\">④ アクセス制御機能を有する特定電子計算機に電気通信回線を通じて当該アクセス制御機能に係る他人の識別符号を入力して当該特定電子計算機を作動させ、当該アクセス制御機能により制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者又は当該識別符号に係る利用権者の承諾を得てするものを除く。)は、不正アクセス行為に該当する。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の(ⅰ)、(ⅱ)の文章は、電子署名及び認証業務に関する法律に規定する｢定義｣について述べたものである。 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを (オ)するために用いられる事項が当該利用者に係るものであることを証明する業務をいう。</p>\n<p class=\"item\">(ⅱ) 特定認証業務とは、電子署名のうち、その方式に応じて (カ) だけが行うことができるものとして主務省令で定める基準に適合するものについて行われる認証業務をいう。</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① 保証</p>\n<p class=\"opt\">② 公務員</p>\n<p class=\"opt\">③ 立証</p>\n<p class=\"opt\">④ 審査に適合する者</p>\n<p class=\"opt\">⑤ 精査</p>\n<p class=\"opt\">⑥ 推定</p>\n<p class=\"opt\">⑦ 本人</p>\n<p class=\"opt\">⑧ システム管理者</p>\n<p class=\"opt\">⑨ 確認</p>\n<p class=\"opt\">⑩ 指定審査機関</p>"}, {"tag": "R6-1", "title": "令和６年度 第１回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、電気通信主任技術者規則の｢講習の期間｣に規定する、電気通信事業者が電気通信主任技術者を選任した日から１年以内に講習を受けさせなくてもよい場合について述べたものである。 の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。なお、文章中にある講習とは、事業用電気通信設備の工事、維持及び運用に関する事項の監督に関し登録講習機関が行う講習をいう。 (２点×２＝４点)電気通信事業者は、電気通信主任技術者資格者証の交付を受けた日から (ア) を経過しない者(講習の修了証の交付を受けた日から (ア) を経過しない者を除く。)を電気通信主任技術者に選任したときは、その電気通信主任技術者資格者証の種類に応じ、当該電気通信主任技術者に電気通信主任技術者資格者証の交付を受けた日から (イ) 以内に講習を受けさせなければならない。</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① ３月</p>\n<p class=\"opt\">② ６月</p>\n<p class=\"opt\">③ １年</p>\n<p class=\"opt\">④ ２年</p>\n<p class=\"opt\">⑤ ３年</p>\n<p class=\"opt\">⑥ ４年</p>\n<p class=\"opt\">⑦ ５年</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する用語又は｢電波の質｣について述べた次の文章のうち、正しいものは、(ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 無線電話とは、電波を利用して、音声その他の音響を送り、又は受けるための通信設備をいう。</p>\n<p class=\"opt\">② 無線局とは、無線設備及び無線設備の操作を行う者の総体をいい、受信のみを目的とするものを含む。</p>\n<p class=\"opt\">③ 緊急通信とは、船舶又は航空機が重大かつ急迫の危険に陥った場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"opt\">④ 送信設備に使用する電波の周波数の偏差及び幅、波形のひずみ率等電波の質は、総務省令で定めるところに適合するものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢連合の目的｣について述べた次のＡ～Ｃの文章は、 (エ) 。(４点)</p>\n<p class=\"stmt\">Ａ すべての種類の電気通信の改善及び合理的利用のため、すべての構成国の間における国際協力を維持し及び増進すること。</p>\n<p class=\"stmt\">Ｂ 電気通信の分野において開発途上国に対する技術援助を促進し及び提供すること、その実施に必要な物的資源、人的資源及び資金の移動を促進すること並びに情報の取得を促進すること。</p>\n<p class=\"stmt\">Ｃ 電気通信業務の能率を増進し、その有用性を増大し、及び公衆によるその利用をできる限り普及するため、技術的手段の発達及びその知的財産権の保護を促進すること。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律の｢定義｣に規定する、アクセス管理者において利用権者等を識別することができるように付される符号である識別符号になり得る符号の条件について述べた次のＡ～Ｃの文章は、 (オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 当該アクセス管理者によってその内容をみだりに第三者に知らせてはならないものとされている符号であること。</p>\n<p class=\"stmt\">Ｂ 当該利用権者等の署名を用いて当該アクセス管理者が定める方法により作成される符号であること。</p>\n<p class=\"stmt\">Ｃ 当該利用権者等の身体の全部若しくは一部の影像又は音声を用いて当該アクセス管理者が定める方法により作成される符号であること。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電子署名及び認証業務に関する法律に規定する事項について述べた次の文章のうち、誤っているものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 電子署名及び認証業務に関する法律は、電子署名に関し、電磁的記録に係る犯罪の防止、特定認証業務に関する認定の制度その他必要な事項を定めることにより、電子署名の円滑な利用の確保による情報の電磁的方式による流通及び情報処理の促進を図り、もって国民生活の向上及び電子商取引等に係る安全の確保に寄与することを目的とする。</p>\n<p class=\"opt\">② 電磁的記録であって情報を表すために作成されたもの(公務員が職務上作成したものを除く。)は、当該電磁的記録に記録された情報について本人による電子署名(これを行うために必要な符号及び物件を適正に管理することにより、本人だけが行うことができることとなるものに限る。)が行われているときは、真正に成立したものと推定する。</p>\n<p class=\"opt\">③ 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを確認するために用いられる事項が当該利用者に係るものであることを証明する業務をいう。</p>\n<p class=\"opt\">④ 特定認証業務とは、電子署名のうち、その方式に応じて本人だけが行うことができるものとして主務省令で定める基準に適合するものについて行われる認証業務をいう。</p>"}, {"tag": "R6-2", "title": "令和６年度 第２回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信主任技術者規則に規定する｢電気通信主任技術者の選任等｣、｢選任等の届出｣、｢資格者証の交付｣又は｢講習の期間｣について述べた次の文章のうち、誤っているものは、 (ア)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信主任技術者に監督させる工事、維持及び運用に関する事項の一つとして、事業用電気通信設備の事故発生時の従事者への指揮及び命令並びに事故の収束後の影響利用者への対応に関する事項がある。</p>\n<p class=\"opt\">② 電気通信事業法の規定による電気通信主任技術者の選任又は解任の届出をしようとする者は、別表に掲げる様式の電気通信主任技術者選任又は解任届出書を総務大臣に提出しなければならない。</p>\n<p class=\"opt\">③ 資格者証の交付を受けた者は、事業用電気通信設備の工事、維持及び運用に関する専門的な知識及び能力の向上を図るように努めなければならない。</p>\n<p class=\"opt\">④ 電気通信事業者は、電気通信主任技術者資格者証の種類に応じ講習を受けた電気通信主任技術者に、その講習の行われた日の属する月の翌月の１日から起算して３年以内に講習を受けさせなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する用語について述べた次の文章のうち、正しいものは、 (イ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 無線設備とは、無線電信、無線電話その他電波を利用して、他人の通信を媒介し、他人の通信の用に供するための電気的設備をいう。</p>\n<p class=\"opt\">② 無線局とは、無線設備及び無線設備の操作を行う者の総体をいい、受信のみを目的とするものを含む。</p>\n<p class=\"opt\">③ 無線従事者とは、無線設備の操作又はその監督を行う者であって、総務大臣の登録を受けたものをいう。</p>\n<p class=\"opt\">④ 安全通信とは、鉄道の運行に対する重大な危険を予防するために安全信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"opt\">⑤ 遭難通信とは、船舶又は航空機が重大かつ急迫の危険に陥った場合に遭難信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢国際電気通信業務を利用する公衆の権利｣、｢責任｣、｢電気通信路及び電気通信設備の設置、運用及び保護｣、｢有害な混信｣又は｢遭難の呼出し及び通報｣について述べた次の文章のうち、誤っているものは、 (ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 構成国は、公衆に対し、国際公衆通信業務によって通信する権利を承認する。各種類の通信において、業務、料金及び保障は、すべての利用者に対し、いかなる優先権又は特恵も与えることなく同一とする。</p>\n<p class=\"opt\">② 構成国は、国際電気通信業務の利用者に対し、特に損害賠償の請求に関しては、責任に基づく義務を果たす。</p>\n<p class=\"opt\">③ 国際電気通信の迅速なかつ不断の交換を確保するために設置された通信路及び設備は、できる限り、実際の運用上の経験から最良と認められた方法及び手続によって運用し、良好に使用することができる状態に維持し、並びに科学及び技術の進歩に合わせて進歩していくようにしなければならない。</p>\n<p class=\"opt\">④ すべての局は、その目的のいかんを問わず、他の構成国、認められた事業体その他正当に許可を得て、かつ、無線通信規則に従って無線通信業務を行う事業体の無線通信又は無線業務に有害な混信を生じさせないように設置し及び運用しなければならない。</p>\n<p class=\"opt\">⑤ 無線通信の局は、遭難の呼出し及び通報を、いずれから発せられたかを問わず、絶対的優先順位において受信し、同様にこの通報に応答し、及び直ちに必要な措置をとる義務を負う。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する事項について述べた次のＡ～Ｃの文章は、(エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ この法律は、不正アクセス行為を禁止するとともに、これについての罰則及びその再発防止のための都道府県公安委員会による援助措置等を定めることにより、電気通信回線を通じて行われる電子計算機に係る犯罪の防止及びアクセス制御機能により実現される電気通信に関する秩序の維持を図り、もって高度情報通信社会の健全な発展に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 国家公安委員会、総務大臣及び経済産業大臣は、アクセス制御機能を有する特定電子計算機の不正アクセス行為からの防御に資するため、毎年少なくとも１回、不正アクセス行為の発生状況及びアクセス制御機能に関する技術の研究開発の状況を公表するものとする。</p>\n<p class=\"stmt\">Ｃ 何人も、アクセス制御機能を特定電子計算機に付加したアクセス管理者になりすまし、その他当該アクセス管理者であると誤認させて、当該アクセス管理者が当該アクセス制御機能に係る識別符号を付された利用権者に対し当該識別符号を特定電子計算機に入力することを求める旨の情報を、電子メールにより当該利用権者に送信する行為をしてはならない。ただし、当該アクセス管理者の承諾を得てする場合は、この限りでない。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電子署名及び認証業務に関する法律に規定する電子署名の定義について述べたものである。 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)電子署名とは、電磁的記録(電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。)に (オ) について行われる措置であって、次の要件のいずれにも該当するものをいう。</p>\n<p class=\"item\">(ⅰ) 当該情報が当該措置を行った者の作成に係るものであることを示すためのものであること。</p>\n<p class=\"item\">(ⅱ) 当該情報について改変が行われていないかどうかを (カ) することができるものであること。</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① 復元することができる情報</p>\n<p class=\"opt\">② 証明</p>\n<p class=\"opt\">③ 確認</p>\n<p class=\"opt\">④ 精査</p>\n<p class=\"opt\">⑤ 情報を暗号化できるもの</p>\n<p class=\"opt\">⑥ 保証</p>\n<p class=\"opt\">⑦ 記録することができる情報</p>\n<p class=\"opt\">⑧ 情報を文書化できるもの</p>\n<p class=\"opt\">⑨ 立証</p>\n<p class=\"opt\">⑩ 情報を圧縮できるもの</p>"}, {"tag": "R7-1", "title": "令和７年度 第１回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の(ⅰ)～(ⅲ)は、電気通信主任技術者規則の｢電気通信主任技術者の選任等｣に規定する、事業用電気通信設備の事故発生時の従事者への指揮及び命令並びに事故の収束後の再発防止に向けた計画の策定に関して含むべき事項について述べたものである。同規則の規定に照らして、□内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 速やかな故障検知及び故障箇所の特定のために必要な対応に関する事項</p>\n<p class=\"item\">(ⅱ) 定型的な応急復旧措置に係る取組並びに (ア) 及び接続事業者との連携に関する事項</p>\n<p class=\"item\">(ⅲ) (イ) のための対策に関する事項</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 故障対応の迅速化</p>\n<p class=\"opt\">② 工事業者</p>\n<p class=\"opt\">③ 保守業者</p>\n<p class=\"opt\">④ 利用者の利益確保</p>\n<p class=\"opt\">⑤ 広報部門</p>\n<p class=\"opt\">⑥ 製造業者等</p>\n<p class=\"opt\">⑦ セキュリティ管理</p>\n<p class=\"opt\">⑧ 保守部門</p>\n<p class=\"opt\">⑨ 障害の極小化</p>\n<p class=\"opt\">⑩ 適正な設備容量の確保</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する用語又は｢電波の質｣について述べた次の文章のうち、正しいものは、(ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 無線電話とは、電波を利用して、音声又は符号を送り、又は受けるための通信設備をいう。</p>\n<p class=\"opt\">② 緊急通信とは、船舶又は航空機が重大かつ急迫の危険に陥るおそれがある場合その他緊急の事態が発生した場合に緊急信号を前置する方法その他総務省令で定める方法により行う無線通信をいう。</p>\n<p class=\"opt\">③ 非常通信とは、地震、台風、洪水、津波、雪害、火災、暴動その他の非常の事態が発生し、又は発生するおそれがある場合において、電気通信事業者が提供する無線通信を利用することができないか又はこれを利用することが著しく困難であるときに人命の救助、災害の救援、交通通信の確保又は秩序の維持のために行われる無線通信をいう。</p>\n<p class=\"opt\">④ 送信設備に使用する電波の周波数の偏差及び波形ひずみ、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢電気通信の停止｣及び｢電気通信路及び電気通信設備の設置、運用及び保護｣について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 構成国は、国内法令に従って、国の安全を害すると認められる私報又はその法令、公の秩序若しくは善良の風俗に反すると認められる私報の伝送を停止する権利を留保する。この場合には、私報の全部又は一部の停止を直ちに発信局に通知する。ただし、その通知が国の安全を害すると認められる場合は、この限りでない。</p>\n<p class=\"stmt\">Ｂ 構成国は、国内法令に従って、他の私用の電気通信であって国の安全を害すると認められるもの又はその法令、公の秩序若しくは善良の風俗に反すると認められるものを切断する権利を留保する。</p>\n<p class=\"stmt\">Ｃ 構成国は、国際電気通信の迅速なかつ不断の交換を確保するために必要な通信路及び設備を最良の技術的条件で設置するため、有用な措置をとる。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する事項について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信回線を介して接続された他の特定電子計算機が有するアクセス制御機能によりその特定利用を制限されている特定電子計算機に電気通信回線を通じてその制限を免れることができる情報又は指令を入力して当該特定電子計算機を作動させ、その制限されている特定利用をし得る状態にさせる行為(当該アクセス制御機能を付加したアクセス管理者がするもの及び当該アクセス管理者の承諾を得てするものを除く。)は、不正アクセス行為に該当する。</p>\n<p class=\"opt\">② 何人も、業務その他正当な理由による場合を除いては、アクセス制御機能に係る他人の識別符号を、当該アクセス制御機能に係るアクセス管理者及び当該識別符号に係る利用権者以外の者に提供してはならない。</p>\n<p class=\"opt\">③ アクセス制御機能を特定電子計算機に付加したアクセス管理者は、当該アクセス制御機能に係る識別符号又はこれを当該アクセス制御機能により転送するために用いる符号の適正な管理に努めるとともに、常に当該アクセス制御設備の保守管理を励行し、必要があると認めるときは速やかにその機能の高度化その他当該特定電子計算機を不正アクセス行為から防御するため必要な措置を講ずるよう努めるものとする。</p>\n<p class=\"opt\">④ 何人も、不正アクセス行為の用に供する目的で、不正に取得されたアクセス制御機能に係る他人の識別符号を保管してはならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電子署名及び認証業務に関する法律に規定する｢定義｣及び｢電磁的記録の真正な成立の推定｣について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを確認するために用いられる事項が当該利用者に係るものであることを証明する業務をいう。</p>\n<p class=\"stmt\">Ｂ 特定認証業務とは、電子署名のうち、その方式に応じて本人及び指定審査機関の審査項目に適合する者が行うことができるものとして主務省令で定める基準に適合するものについて行われる認証業務をいう。</p>\n<p class=\"stmt\">Ｃ 電磁的記録であって情報を表すために作成されたもの(公務員が職務上作成したものを除く。)は、当該電磁的記録に記録された情報について本人による電子署名(これを行うために必要な符号及び物件を適正に管理することにより、本人だけが行うことができることとなるものに限る。)が行われているときは、真正に成立したものと推定する。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R7-2", "title": "令和７年度 第２回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信主任技術者規則に規定する｢選任等の届出｣、｢講習の期間｣及び｢資格者証の交付｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業法の規定による電気通信主任技術者の選任又は解任の届出をしようとする者は、別表に掲げる様式の電気通信主任技術者選任又は解任届出書を事業場が所在する都道府県知事を経由して総務大臣に提出しなければならない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者は、電気通信主任技術者資格者証の交付を受けた日から２年を経過しない者(講習の修了証の交付を受けた日から２年を経過しない者を除く。)を電気通信主任技術者に選任したときは、その電気通信主任技術者資格者証の種類に応じ、当該電気通信主任技術者に電気通信主任技術者資格者証の交付を受けた日から３年以内に講習を受けさせなければならない。</p>\n<p class=\"stmt\">Ｃ 資格者証の交付を受けた者は、端末設備等の工事、維持及び運用に関する専門的な知識及び能力の向上を図るように努めなければならない。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する用語について述べた次の文章のうち、誤っているものは、 (イ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 電波とは、３００万メガヘルツ以下の周波数の電磁波をいう。</p>\n<p class=\"opt\">② 無線電信とは、電波を利用して、符号を送り、又は受けるための通信設備をいう。</p>\n<p class=\"opt\">③ 無線設備とは、無線電信、無線電話その他電波を利用して、他人の通信を媒介し、他人の通信の用に供するための電気的設備をいう。</p>\n<p class=\"opt\">④ 無線局とは、無線設備及び無線設備の操作を行う者の総体をいい、受信のみを目的とするものを含まない。</p>\n<p class=\"opt\">⑤ 無線従事者とは、無線設備の操作又はその監督を行う者であって、総務大臣の免許を受けたものをいう。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の(ⅰ)、(ⅱ)の文章は、国際電気通信連合憲章に規定する｢国際電気通信業務を利用する公衆の権利｣及び｢電気通信の秘密｣について述べたものである。同憲章の規定に照らして、□内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 構成国は、公衆に対し、国際公衆通信業務によって通信する権利を承認する。各種類の通信において、業務、 (ウ) は、すべての利用者に対し、いかなる優先権又は特恵も与えることなく同一とする。</p>\n<p class=\"item\">(ⅱ) 構成国は、国際通信の秘密を確保するため、使用される電気通信の (エ) するすべての可能な措置をとることを約束する。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① 犯罪防止に対応</p>\n<p class=\"opt\">② 規約及び約款</p>\n<p class=\"opt\">③ 国際法に準拠</p>\n<p class=\"opt\">④ 方式及び機能</p>\n<p class=\"opt\">⑤ 技術基準に規定</p>\n<p class=\"opt\">⑥ 標準化に寄与</p>\n<p class=\"opt\">⑦ 維持及び運用</p>\n<p class=\"opt\">⑧ 料金及び保障</p>\n<p class=\"opt\">⑨ システムに適合</p>\n<p class=\"opt\">⑩ サービス及び品質</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律に規定する事項について述べた次のＡ～Ｃの文章は、(オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ この法律は、不正アクセス行為を禁止するとともに、これについての罰則及びその再発防止のための都道府県公安委員会による援助措置等を定めることにより、電気通信回線を通じて行われる電子計算機に係る犯罪の防止及びアクセス制御機能により実現される電気通信に関する秩序の維持を図り、もって高度情報通信社会の健全な発展に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 国家公安委員会、総務大臣及び経済産業大臣は、アクセス制御機能を有する特定電子計算機の不正アクセス行為からの防御に資するため、半年ごとに少なくとも１回、不正アクセス行為の発生状況及びアクセス制御機能に関する技術の研究開発の状況を公表するものとする。</p>\n<p class=\"stmt\">Ｃ アクセス制御機能を特定電子計算機に付加したアクセス管理者は、当該アクセス制御機能に係る識別符号又はこれを当該アクセス制御機能により確認するために用いる符号の適正な管理に努めるとともに、常に当該アクセス制御機能の有効性を検証し、必要があると認めるときは速やかにその機能の高度化その他当該特定電子計算機を不正アクセス行為から防御するため必要な措置を講ずるよう努めるものとする。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電子署名及び認証業務に関する法律に規定する事項について述べた次の文章のうち、誤っているものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① この法律は、電子署名に関し、電磁的記録の真正な成立の推定、特定認証業務に関する認定の制度その他必要な事項を定めることにより、電子署名の円滑な利用の確保による情報の電磁的方式による流通及び情報処理の促進を図り、もって国民生活の向上及び国民経済の健全な発展に寄与することを目的とする。</p>\n<p class=\"opt\">② 電磁的記録とは、電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。</p>\n<p class=\"opt\">③ 電子署名とは、電磁的記録に記録することができる情報について行われる措置であって、当該情報が当該措置を行った者の作成に係るものであることを示すためのものであること及び当該情報について認証が行われていることを確認することができるものであることのいずれの要件にも該当するものをいう。</p>\n<p class=\"opt\">④ 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを確認するために用いられる事項が当該利用者に係るものであることを証明する業務をいう。</p>"}, {"tag": "R8-1", "title": "令和８年度 第１回", "html": "<h3 class=\"q-h\">問２ 次の各問いは、｢電気通信主任技術者規則｣、｢電波法｣、｢国際電気通信連合憲章｣、｢不正アクセス行為の禁止等に関する法律｣又は｢電子署名及び認証業務に関する法律｣に規定する内容に関するものである。それぞれの規定に照らして、 □内の(ア)～(オ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 電気通信主任技術者規則に規定する｢資格者証の交付の申請｣、｢資格者証の再交付｣及び｢資格者証の返納｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 資格者証の交付の申請は、試験に合格した日、電気通信主任技術者資格の養成課程を修了した日又は電気通信主任技術者資格の認定を受けた日から６月以内に行わなければならない。</p>\n<p class=\"stmt\">Ｂ 資格者証の交付を受けている者は、住所に変更を生じたとき又は資格者証を汚し、破り若しくは失ったために資格者証の再交付の申請をしようとするときは、所定の様式の申請書に資格者証(資格者証を失った場合を除く。)、写真１枚及び住所の変更の事実を証する書類(住所に変更を生じたときに限る。)を添えて、総務大臣に提出しなければならない。</p>\n<p class=\"stmt\">Ｃ 電気通信事業法の規定により資格者証の返納を命ぜられた者は、その処分を受けた日から２週間以内にその資格者証を総務大臣に返納しなければならない。資格者証の再交付を受けた後、失った資格者証を発見したときも同様とする。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電波法に規定する｢電波の質｣、｢受信設備の条件｣、｢安全施設｣又は｢周波数測定装置の備えつけ｣について述べた次の文章のうち、誤っているものは、 (イ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 送信設備に使用する電波の周波数の偏差及び幅、高調波の強度等電波の質は、総務省令で定めるところに適合するものでなければならない。</p>\n<p class=\"opt\">② 受信設備は、その副次的に発する電波又は低周波雑音が、総務省令で定める限度をこえて他の無線設備の機能に支障を与えるものであってはならない。</p>\n<p class=\"opt\">③ 無線設備には、人体に危害を及ぼし、又は物件に損傷を与えることがないように、総務省令で定める施設をしなければならない。</p>\n<p class=\"opt\">④ 総務省令で定める送信設備には、その誤差が使用周波数の許容偏差の２分の１以下である周波数測定装置を備えつけなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 国際電気通信連合憲章に規定する｢電気通信の停止｣、｢電気通信路及び電気通信設備の設置、運用及び保護｣又は｢国際電気通信業務を利用する公衆の権利｣について述べた次の文章のうち、誤っているものは、 (ウ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 構成国は、国内法令に従って、国の安全を害すると認められる私報又はその法令、公の秩序若しくは善良の風俗に反すると認められる私報の伝送を停止する権利を留保する。この場合には、私報の全部又は一部の停止を直ちに発信局に通知する。ただし、その通知が国の安全を害すると認められる場合は、この限りでない。</p>\n<p class=\"opt\">② 構成国は、国内法令に従って、他の私用の電気通信であって国の安全を害すると認められるもの又はその法令、公の秩序若しくは善良の風俗に反すると認められるものを切断する権利を留保する。</p>\n<p class=\"opt\">③ 構成国は、国際電気通信の迅速なかつ不断の交換を確保するために必要な通信路及び設備を最良の技術的条件で設置するため、有用な措置をとる。</p>\n<p class=\"opt\">④ 構成国は、公衆に対し、国際公衆通信業務によって通信する権利を承認する。各種類の通信において、業務、料金及び保障は、自国の利用者に対し、優先的に便益を供与する権利を有する。</p>\n<p class=\"opt\">⑤ 国際電気通信の迅速なかつ不断の交換を確保するために設置された通信路及び設備は、できる限り、実際の運用上の経験から最良と認められた方法及び手続によって運用し、良好に使用することができる状態に維持し、並びに科学及び技術の進歩に合わせて進歩していくようにしなければならない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 不正アクセス行為の禁止等に関する法律の｢定義｣に規定する、アクセス管理者において利用権者等を識別することができるように付される符号である識別符号になり得る符号の条件について述べた次のＡ～Ｃの文章は、 (エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 当該アクセス管理者によってその内容をみだりに第三者に知らせてはならないものとされている符号であること。</p>\n<p class=\"stmt\">Ｂ 当該利用権者等の署名を用いて総務大臣が定める方法により作成される符号であること。</p>\n<p class=\"stmt\">Ｃ 当該利用権者等の身体の全部若しくは一部の影像又は音声を用いて当該アクセス管理者の許諾を得た者が定める方法により作成される符号であること。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電子署名及び認証業務に関する法律に規定する事項について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 電子署名及び認証業務に関する法律は、電子署名に関し、電磁的記録に係る犯罪の防止、特定認証業務に関する認定の制度その他必要な事項を定めることにより、電子署名の円滑な利用の確保による情報の電磁的方式による流通及び情報処理の促進を図り、もって国民生活の向上及び国民経済の健全な発展に寄与することを目的とする。</p>\n<p class=\"opt\">② 認証業務とは、自らが行う電子署名についてその業務を利用する者(以下｢利用者｣という。)その他の者の求めに応じ、当該利用者が電子署名を行ったものであることを公表するために用いられる事項が当該利用者に係るものであることを推定する業務をいう。</p>\n<p class=\"opt\">③ 特定認証業務とは、電子署名のうち、その方式に応じて本人だけが行うことができるものとして主務省令で定める基準に適合するものについて行われる認証業務をいう。</p>\n<p class=\"opt\">④ 電磁的記録であって情報を表すために作成されたもの(公務員が職務上作成したものを除く。)は、当該電磁的記録に記録された情報について暗号化によるセキュリティ対策が行われているときは、真正に成立したものと推定する。</p>"}], "3": [{"tag": "R4-1", "title": "令和４年度 第１回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち 、 正しいものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① ワイヤレス固定電話用設備とは、４線式アナログ電話用設備のうち、認定電気通信事業者が基礎的電気通信役務を提供する電気通信事業の用に供する電気通信設備であって、その伝送路設備の一部に他の電気通信事業者が設置する携帯電話用設備を用いるものをいう。</p>\n<p class=\"opt\">② インターネットプロトコル電話用設備とは、事業用電気通信設備のうち、端末設備等をパケット交換プロトコルを使用してパケット交換網に接続するもの(携帯電話用設備を除く。)であって、音声伝送役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ 総合デジタル通信用設備とは、事業用電気通信設備のうち、主として６４キロビット毎秒を単位とするデジタル信号の伝送速度により、主として音声又は符号を伝送交換することを目的とする電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">④ 絶対レベルとは、一の皮相電力の１ミリワットに対する比をデシベルで表したものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢故障検出｣、｢防火対策等｣及び｢電源設備｣について述べた次のＡ～Ｃの文章は、 (イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備は、電源停止、共通制御機器の動作停止その他電気通信役務の提供に直接係る機能に重大な支障を及ぼす故障等の発生時には、これを直ちに検出し、当該事業用電気通信設備を維持し、又は運用する者に通知する機能を備えなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備を収容し、又は設置し、かつ、当該事業用電気通信設備を工事、維持又は運用
