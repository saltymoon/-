する者が立ち入る通信機械室に代わるコンテナ等の構造物及びとう道は、消火設備の設置及び非常出入り口の確保がされているものでなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備の電力の供給に直接係る電源設備の機器(自家用発電機及び蓄電池を除く。)は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢電源供給｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)事業用電気通信設備は、監視信号送出条件に係る呼出信号の送出時を除き、端末設備等を接続する点において次の(ⅰ)～(ⅲ)に掲げる条件に適合する通信用電源を供給しなければならない。</p>\n<p class=\"item\">(ⅰ) 端末設備等を切り離した時の線間電圧が４２ボルト以上かつ (ウ) ボルト以下であること。</p>\n<p class=\"item\">(ⅱ) 両線間を３００オームの純抵抗で終端した時の回路電流が１５ミリアンペア以上であること。</p>\n<p class=\"item\">(ⅲ) 両線間を５０オームの純抵抗で終端した時の回路電流が (エ) ミリアンペア以下であること。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① ５３</p>\n<p class=\"opt\">② ６３</p>\n<p class=\"opt\">③ ７３</p>\n<p class=\"opt\">④ ８３</p>\n<p class=\"opt\">⑤ １１０</p>\n<p class=\"opt\">⑥ １３０</p>\n<p class=\"opt\">⑦ １５０</p>\n<p class=\"opt\">⑧ １７０</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢停電対策｣、｢屋外設備｣、｢耐震対策｣又は｢事業用電気通信設備を設置する建築物等｣について述べた次の文章のうち、誤っているものは、(オ) である。ただし、適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機又は蓄電池の設置その他これに準ずる措置(交換設備にあっては、自家用発電機及び蓄電池の設置その他これに準ずる措置)が講じられていなければならない。</p>\n<p class=\"opt\">② 屋外に設置する電線(その中継器を含む。)、空中線及びこれらの附属設備並びにこれらを支持し又は保蔵するための工作物(建築物及びコンテナ等を除く。)は、通常想定される気象の変化、振動、衝撃、圧力その他その設置場所における外部環境の影響を容易に受けないものでなければならない。</p>\n<p class=\"opt\">③ 事業用電気通信設備の据付けに当たっては、通常想定される規模の地震による転倒又は移動を防止するため、免震支承の設置その他の免震措置が講じられなければならない。</p>\n<p class=\"opt\">④ 事業用電気通信設備を収容し、又は設置する建築物及びコンテナ等が適合しなければならない事項の一つとして、当該事業用電気通信設備が安定に動作する温度及び湿度を維持することができることがある。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 音声伝送役務の提供の用に供する電気通信設備のアナログ電話相当の機能を有するインターネットプロトコル電話用設備における緊急通報を扱う事業用電気通信設備が適合しなければならない事項について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 緊急通報を、その発信に係る端末設備等の場所を管轄する警察機関等に接続すること。</p>\n<p class=\"stmt\">Ｂ 緊急通報を発信した端末設備等に係る電気通信番号その他当該発信に係る情報として、電気通信事業者が別に定める情報を、当該緊急通報に係る警察機関等の端末設備に送信する機能を有すること。ただし、他の方法により同等の機能を実現できる場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 緊急通報を受信した端末設備から通信の終了を表す信号が送出されない限りその通話を継続する機能又は警察機関等に送信した電気通信番号による呼び返し若しくはこれに準ずる機能を有すること。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R4-2", "title": "令和４年度 第２回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、誤っているものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 携帯電話用設備とは、事業用電気通信設備のうち、無線設備規則に規定する携帯無線通信による電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">② 総合デジタル通信用設備とは、事業用電気通信設備のうち、主として６４キロビット毎秒を単位とするデジタル信号の伝送速度により、符号、音声その他の音響又は影像を統合して伝送交換することを目的とする電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ アナログ電話用設備とは、事業用電気通信設備のうち、端末設備又は自営電気通信設備を接続する点において音声信号を入出力するものであって、主として音声の伝送交換を目的とする電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">④ 特定端末設備とは、自らの電気通信事業の用に供する端末設備であって事業用電気通信設備であるもののうち、自ら設置する電気通信回線設備の一端に接続されるものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の｢通信内容の秘匿措置｣、｢蓄積情報保護｣及び｢損傷防止｣について述べた次のＡ～Ｃの文章は、(イ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線放送設備の線路と同一の線路を使用する事業用電気通信設備(電気通信回線設備に限る。)は、電気通信事業者が、有線一般放送の受信設備を接続する点において、通信の内容が有線一般放送の受信設備の通常の使用の状態で判読できないように必要な秘匿措置が講じられなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備に利用者の通信の内容その他これに係る情報を蓄積する場合にあっては、当該事業用電気通信設備は、当該利用者以外の者が端末設備等を用いて容易にその情報を知得し、又は流用することを防止するため、当該利用者のみに与えた呼出符号の照合確認その他の防止措置が講じられなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、利用者又は他の電気通信事業者の接続する電気通信設備(以下｢接続設備｣という。)を損傷するおそれのある電力若しくは電流を送出し、又は接続設備を損傷するおそれのある電圧若しくは光出力により送出するものであってはならない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢故障検出｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)事業用電気通信設備は、電源停止、 (ウ) の動作停止その他電気通信役務の提供に直接係る機能に重大な支障を及ぼす故障等の発生時には、これを直ちに検出し、当該事業用電気通信設備を (エ) 機能を備えなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① 整流装置</p>\n<p class=\"opt\">② 無停電電源装置</p>\n<p class=\"opt\">③ 維持し、又は運用する者に通知する</p>\n<p class=\"opt\">④ 現用機器</p>\n<p class=\"opt\">⑤ 共通制御機器</p>\n<p class=\"opt\">⑥ 保守センタから遠隔で応急復旧できる</p>\n<p class=\"opt\">⑦ 停止し、予備機器に切り替える</p>\n<p class=\"opt\">⑧ 事業用電気通信回線設備から切り離す</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣、｢耐震対策｣などについて述べた次の文章のうち、正しいものは、 (オ) である。ただし、適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 交換設備は、異常ふくそう(特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が継続して著しく低下する現象をいう。)が発生した場合に、これを検出し、かつ、通信の疎通を停止する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が同時に集中することがないようこれを制御することができる交換設備については、この限りでない。</p>\n<p class=\"opt\">② 事業用電気通信設備は、通常想定される規模の地震による構成部品の接触不良及び脱落を防止するため、構成部品の固定その他の耐震措置が講じられたものでなければならない。</p>\n<p class=\"opt\">③ 線路設備は、強電流電線からの静電誘導作用により事業用電気通信設備の機能に重大な支障を及ぼすおそれのある異常電圧又は異常電流が発生しないように設置しなければならない。</p>\n<p class=\"opt\">④ 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機及び蓄電池の設置その他これに準ずる措置が講じられていなければならない。この場合において、事業用電気通信設備のうち交換設備にあっては、自家用発電機はその機能を代替することができる予備機器の設置が講じられていなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢事業用電気通信設備を設置する建築物等｣について述べた次のＡ～Ｃの文章は、 (カ) 。ただし、適用除外規定は考慮しないものとする。(４点)</p>\n<p class=\"stmt\">Ａ 当該事業用電気通信設備を安全に設置することができる堅固で耐久性に富むものであること。</p>\n<p class=\"stmt\">Ｂ 当該事業用電気通信設備が安定に動作する温度及び湿度を維持することができること。</p>\n<p class=\"stmt\">Ｃ 当該事業用電気通信設備を収容し、又は設置する通信機械室に、小動物が容易に出入りし、又は容易に事業用電気通信設備に触れることができないよう金網による囲いその他必要な措置が講じられていること。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R5-1", "title": "令和５年度 第１回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、誤っているものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 音声伝送役務とは、おおむね４キロヘルツ帯域の音声その他の音響を伝送交換する機能を有する電気通信設備を他人の通信の用に供する電気通信役務であってデータ伝送役務以外のものをいう。</p>\n<p class=\"opt\">② ２線式アナログ電話用設備とは、アナログ電話用設備のうち、事業用電気通信設備と端末設備等を接続する点において２線式の接続形式を有するものをいう。</p>\n<p class=\"opt\">③ インターネットプロトコル電話用設備とは、事業用電気通信設備のうち、端末設備等をパケット交換プロトコルを使用してパケット交換網に接続するもの(携帯電話用設備を除く。)であって、音声伝送役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">④ 平均繁忙時とは、１日のうち年間を平均して電気通信設備の負荷が最大となる連続した１時間をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢事業用電気通信設備の防護措置｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。(２点×２＝４点)事業用電気通信設備は、利用者又は他の電気通信事業者の電気通信設備から受信した(イ) によって当該事業用電気通信設備が当該事業用電気通信設備を設置する電気通信事業者の (ウ) を行うことその他の事由により電気通信役務の提供に重大な支障を及ぼすことがないよう当該 (イ) の機能の制限その他の必要な防護措置が講じられなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 通信容量の変更</p>\n<p class=\"opt\">② プログラム</p>\n<p class=\"opt\">③ 選択信号</p>\n<p class=\"opt\">④ 交換設備の制御</p>\n<p class=\"opt\">⑤ 監視信号</p>\n<p class=\"opt\">⑥ 制御信号</p>\n<p class=\"opt\">⑦ 意図に反する動作</p>\n<p class=\"opt\">⑧ 保守分界点の制限</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢故障検出｣、｢電源設備｣及び｢防火対策等｣について述べた次のＡ～Ｃの文章は、 (エ) 。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備は、電源停止、共通制御機器の動作停止その他電気通信役務の提供に直接係る機能に重大な支障を及ぼす故障等の発生時には、これを直ちに検出し、記録する機能を備えなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備の電力の供給に直接係る電源設備の機器(自家用発電機及び蓄電池を除く。)は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備を収容し、又は設置し、かつ、当該事業用電気通信設備を工事、維持又は運用する者が立ち入る通信機械室に代わるコンテナ等の構造物及びとう道は、消火設備の設置及び非常出入り口の確保がされているものでなければならない。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の他の電気通信設備の損傷又は機能の障害の防止における｢損傷防止｣、｢機能障害の防止｣、｢漏えい対策｣又は｢保安装置｣について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、利用者又は他の電気通信事業者の接続する電気通信設備(以下｢接続設備｣という。)を損傷するおそれのある電力若しくは電流を送出し、又は接続設備を損傷するおそれのある電圧若しくは光出力により送出するものであってはならない。</p>\n<p class=\"opt\">② 事業用電気通信設備は、接続設備の機能に障害を与えるおそれのある電気信号又は磁気信号を送出するものであってはならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、総務大臣が別に告示するところに従い特定端末設備又は自営電気通信設備と配線設備との間の電気通信回線に伝送される信号の漏えいに関し、あらかじめ基準を定め、その基準を維持するように努めなければならない。</p>\n<p class=\"opt\">④ 落雷又は強電流電線との混触により線路設備に発生した異常電圧及び異常電流によって接続設備を損傷するおそれのある場合は、交流２００ボルト以下で動作する避雷器及び９アンペア以下で動作するヒューズ若しくは２００ミリアンペア以下で動作する熱線輪からなる保安装置又はこれと同等の保安機能を有する装置が事業用電気通信設備と接続設備を接続する点又はその近傍に設置されていなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢信号極性｣について述べたものである。 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)事業用電気通信設備は、事業用電気通信設備規則に規定する (カ) を受信できる状態において、同規則で規定する電源の極性を端末設備等を接続する点において一方を地気(接地の電位をいう。)、他方を (キ) としなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 発呼信号</p>\n<p class=\"opt\">② 着信信号</p>\n<p class=\"opt\">③ 正極性</p>\n<p class=\"opt\">④ 信号と同極性</p>\n<p class=\"opt\">⑤ 切断信号</p>\n<p class=\"opt\">⑥ 終話信号</p>\n<p class=\"opt\">⑦ 負極性</p>\n<p class=\"opt\">⑧ 信号と逆極性</p>"}, {"tag": "R5-2", "title": "令和５年度 第２回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、正しいものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① アナログ電話用設備とは、事業用電気通信設備のうち、端末設備又は自営電気通信設備を接続する点において音声信号を入出力するものであって、主として音声の伝送交換を目的とする電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">② 総合デジタル通信用設備とは、事業用電気通信設備のうち、主として６４キロビット毎秒を単位とするデジタル信号の伝送速度により、主として音声又は符号を伝送交換することを目的とする電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ メタルインターネットプロトコル電話用設備とは、２線式アナログ電話用設備のうち、他の電気通信事業者の電気通信設備を接続する点においてインターネットプロトコルを使用するもの(ワイヤレス固定電話用設備を除く。)をいう。</p>\n<p class=\"opt\">④ ワイヤレス固定電話用設備とは、２線式アナログ電話用設備のうち、認定電気通信事業者が認定電気通信事業に係る電気通信役務を提供する電気通信事業の用に供する電気通信設備であって、その伝送路設備の一部に他の電気通信事業者が設置する携帯電話用設備を用いるものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢予備機器等｣について述べた次のＡ～Ｃの文章は、 (イ) 。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 通信路の設定に直接係る交換設備の機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その損壊又は故障(以下｢故障等｣という。)の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。ただし、端末回線(端末設備等と交換設備との間の電気通信回線をいう。)を当該交換設備に接続するための機器、及び当該交換設備の故障等の発生時に、他の交換設備によりその疎通が確保できる交換設備の機器については、この限りでない。</p>\n<p class=\"stmt\">Ｂ 交換設備相互間を接続する伝送路設備は、複数の経路により設置されなければならない。ただし、地形の状況により複数の経路の設置が困難な場合又は伝送路設備の故障等の対策として複数の経路による設置と同等以上の効果を有する措置が講じられる場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 伝送路設備には、予備の電気通信回線を設置しなければならない。ただし、端末回線その他不特定かつ多数の者の通信を取り扱う区間に使用するものについては、この限りでない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣、｢耐震対策｣又は｢防火対策等｣について述べた次の文章のうち、誤っているものは、 (ウ) である。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 交換設備は、異常ふくそう(特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が継続して著しく低下する現象をいう。)が発生した場合に、これを検出し、かつ、通信の集中を規制する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が同時に集中することがないようこれを制御することができる交換設備については、この限りでない。</p>\n<p class=\"opt\">② 事業用電気通信設備の据付けに当たっては、通常想定される規模の地震による転倒又は移動を防止するため、床への緊結その他の耐震措置が講じられなければならない。</p>\n<p class=\"opt\">③ 事業用電気通信設備は、通常想定される規模の地震による構成部品の接触不良及び脱落を防止するため、構成部品の固定その他の耐震措置が講じられたものでなければならない。</p>\n<p class=\"opt\">④ 事業用電気通信設備を収容し、又は設置する通信機械室は、避難設備及び消火設備が適切に設置されたものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢屋外設備｣について述べたものである。 □内の(エ)、(オ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、第１６条の適用除外規定は考慮しないものとする。 (２点×２＝４点)屋外に設置する電線(その中継器を含む。)、 (エ) 及びこれらの附属設備並びにこれらを支持し又は保蔵するための工作物(建築物及びコンテナ等を除く。)は、通常想定される(オ) 、振動、衝撃、圧力その他その設置場所における外部環境の影響を容易に受けないものでなければならない。</p>\n<p class=\"cg-h\">&lt;(エ)、(オ)の解答群&gt;</p>\n<p class=\"opt\">① 水象の発生</p>\n<p class=\"opt\">② ケーブル</p>\n<p class=\"opt\">③ 地震の影響</p>\n<p class=\"opt\">④ 地中線</p>\n<p class=\"opt\">⑤ 水底線路</p>\n<p class=\"opt\">⑥ 気象の変化</p>\n<p class=\"opt\">⑦ 空中線</p>\n<p class=\"opt\">⑧ 摩耗や化学的な腐食</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の秘密の保持における｢蓄積情報保護｣及び｢通信内容の秘匿措置｣について述べた次のＡ～Ｃの文章は、(カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備(特定端末設備を除く。)に利用者の通信の内容その他これに係る情報を蓄積する場合にあっては、当該事業用電気通信設備は、当該利用者以外の者が端末設備等を用いて容易にその情報を知得し、又は流用することを防止するため、当該利用者のみに与えた呼出符号の照合確認その他の防止措置が講じられなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備(特定端末設備を除く。)は、利用者が端末設備等を接続する点において、他の通信の内容が電気通信設備の通常の使用の状態で判読できないように必要な秘匿措置が講じられなければならない。</p>\n<p class=\"stmt\">Ｃ 有線放送設備の線路と同一の線路を使用する事業用電気通信設備(電気通信回線設備に限る。)は、電気通信事業者が、有線一般放送の受信設備を接続する点において、通信の内容が有線一般放送の受信設備の通常の使用の状態で判読できないように必要な秘匿措置が講じられなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R6-1", "title": "令和６年度 第１回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(オ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、正しいものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① ２線式アナログ電話用設備とは、アナログ電話用設備のうち、事業用電気通信設備と端末設備等を接続する点においてモジュラジャック式の接続形式を有するものをいう。</p>\n<p class=\"opt\">② インターネットプロトコル電話用設備とは、事業用電気通信設備のうち、端末設備等をインターネットプロトコルを使用してパケット交換網に接続するもの(携帯電話用設備を除く。)であって、音声伝送役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ インターネットプロトコルを用いた総合デジタル通信用設備とは、総合デジタル通信用設備のうち、端末設備又は自営電気通信設備を接続する点においてインターネットプロトコルを使用するものをいう。</p>\n<p class=\"opt\">④ 直流回路とは、電気通信回線設備に接続して電気通信事業者の端末系伝送路設備の動作の開始及び終了の制御を行うための回路をいう。</p>\n<p class=\"opt\">⑤ 呼量とは１時間に発生した呼の同時接続時間の総和を１時間で除したものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢予備機器等｣及び｢故障検出｣について述べた次のＡ～Ｃの文章は、 (イ) 。ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 伝送路設備には、予備の電気通信回線を設置しなければならない。ただし、当該伝送路設備の故障等の発生時に、端末回線によりその疎通が確保できるものについては、この限りでない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備は、電源停止、共通制御機器の動作停止その他電気通信役務の提供に直接係る機能に重大な支障を及ぼす故障等の発生時には、これを直ちに検出し、記録する機能を備えなければならない。</p>\n<p class=\"stmt\">Ｃ 固定電話接続用設備は、その故障等の発生時に他の地域に設置された固定電話接続用設備に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣について述べた次の文章のうち、誤っているものは、 (ウ) である。ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 異常ふくそうとは、特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が継続して著しく低下する現象をいう。</p>\n<p class=\"opt\">② 交換設備は、異常ふくそうが発生した場合に、これを検出し、かつ、通信の疎通を停止する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が同時に集中することがないようこれを制御することができる交換設備については、この限りでない。</p>\n<p class=\"opt\">③ 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、多数の移動端末設備が同時に電気通信設備と接続する場合等に生じるトラヒックの瞬間的かつ急激な増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置を講じられなければならない。選択可能な措置の一つに、トラヒックの瞬間的かつ急激な増加の発生を防止又は抑制する措置がある。</p>\n<p class=\"opt\">④ 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、移動端末設備に由来する制御信号の増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置を講じられなければならない。選択可能な措置の一つに、制御信号の増加による電気通信設備の負荷を軽減させる措置がある。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢事業用電気通信設備を設置する建築物等｣に規定される、事業用電気通信設備を収容し、又は設置する建築物及びコンテナ等について述べた次の文章のうち、誤っているものは、 (エ) である 。 ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 風水害その他の自然災害及び火災の被害を容易に受けない環境に設置されたものでなければならない。ただし、やむを得ず風水害その他の自然災害及び火災の被害を受けやすい環境に設置されたものであって、防水壁又は防火壁の設置その他の必要な防護措置が講じられているものは、この限りでない。</p>\n<p class=\"opt\">② 当該事業用電気通信設備が安定に動作する温度及び湿度を維持することができるものでなければならない。</p>\n<p class=\"opt\">③ 当該事業用電気通信設備を安全に設置することができる堅固で絶縁性に優れ、特別保安接地を施した電気的遮へい層を有する隔壁で保護されているものでなければならない。</p>\n<p class=\"opt\">④ 当該事業用電気通信設備を収容し、又は設置する通信機械室に、公衆が容易に立ち入り、又は公衆が容易に事業用電気通信設備に触れることができないよう施錠その他必要な措置が講じられているものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢電源設備｣及び｢停電対策｣について述べた次のＡ～Ｃの文章は、 (オ) 。ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備の電源設備は、最繁忙時に事業用電気通信設備の消費電流を安定的に供給できる容量があり、かつ、電源設備の動作電圧を変動許容範囲内に維持できるものでなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備の電力の供給に直接係る電源設備の機器(自家用発電機及び蓄電池を除く。)は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機及び蓄電池の設置その他これに準ずる措置が講じられていなければならない。この場合において、事業用電気通信設備のうち交換設備にあっては、自家用発電機はその機能を代替することができる予備機器の設置が講じられていなければならない。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R6-2", "title": "令和６年度 第２回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、誤っているものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 携帯電話用設備とは、事業用電気通信設備のうち、無線設備規則に規定する携帯無線通信による電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">② 特定携帯電話用設備とは、事業用電気通信設備のうち、電気通信設備又は提供すべき電気通信役務の種類又は内容を電気通信番号規則別表に掲げる音声伝送携帯電話番号により識別するための電気通信設備及びこれと一体として設置される電気通信設備(携帯電話用設備を除く。)であって、音声伝送役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ 固定電話接続用設備とは、事業用電気通信設備であって、他の電気通信事業者の電気通信設備との接続を行うために設置される電気通信設備の機器(専ら特定の一の者の電気通信設備との接続を行うために設置されるものを除く。)と同一の構内に設置されるものをいう。ただし、事業用電気通信設備及び他の電気通信事業者の電気通信設備は、メタルインターネットプロトコル電話用設備、ワイヤレス固定電話用設備、インターネットプロトコルを用いた総合デジタル通信用設備及び電気通信番号規則別表に掲げる固定電話番号を使用して電気通信役務を提供するインターネットプロトコル電話用設備に限る。</p>\n<p class=\"opt\">④ 基礎トラヒックとは、１日のうち、１年間を平均して呼量(１時間に発生した呼の保留時間の総和を１時間で除したものをいう。)が最大となる連続した１時間について１年間の呼量及び呼数の最大のものから順に１０日分の呼量及び呼数を抜き取ってそれぞれ平均した呼量及び呼数又はその予測呼量及び予測呼数をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢事業用電気通信設備の防護措置｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。(２点×２＝４点)事業用電気通信設備は、利用者又は他の電気通信事業者の電気通信設備から受信した(イ) によって当該事業用電気通信設備が当該事業用電気通信設備を設置する電気通信事業者の (ウ) を行うことその他の事由により電気通信役務の提供に重大な支障を及ぼすことがないよう当該 (イ) の機能の制限その他の必要な防護措置が講じられなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 意図に反する動作</p>\n<p class=\"opt\">② 制御信号</p>\n<p class=\"opt\">③ 選択信号</p>\n<p class=\"opt\">④ プログラム</p>\n<p class=\"opt\">⑤ 交換設備の制御</p>\n<p class=\"opt\">⑥ 設備の運用</p>\n<p class=\"opt\">⑦ 呼出信号</p>\n<p class=\"opt\">⑧ 通信容量の変更</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣又は｢耐震対策｣について述べた次の文章のうち、誤っているものは、 (エ) である。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、移動端末設備に由来する制御信号の増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置を講じられなければならない。選択可能な措置の一つに、制御信号の増加に対応するための十分な通信容量を有する電気通信設備の設置の措置がある。</p>\n<p class=\"opt\">② 携帯電話用設備及び特定携帯電話用設備のうち、その損壊又は故障等による利用者の利益に及ぼす影響が大きいものとして告示した設備は、トラヒックの瞬間的かつ急激な増加及び制御信号の増加を想定した過負荷試験を実施し、電気通信役務の提供に重大な支障を及ぼすことがないようにするために講じた措置の実効性を確保しなければならない。</p>\n<p class=\"opt\">③ 事業用電気通信設備の据付けに当たっては、通常想定される規模の地震による転倒又は移動を防止するため、免震支承の設置その他の免震措置が講じられなければならない。</p>\n<p class=\"opt\">④ 事業用電気通信設備は、通常想定される規模の地震による構成部品の接触不良及び脱落を防止するため、構成部品の固定その他の耐震措置が講じられたものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢防火対策等｣について述べた次のＡ～Ｃの文章は、 (オ) 。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備を収容し、又は設置する通信機械室は、避難設備及び消火設備が適切に設置されたものでなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備を収容し、又は設置し、かつ、当該事業用電気通信設備を工事、維持又は運用する者が立ち入る通信機械室に代わるコンテナ等の構造物(以下｢コンテナ等｣という。)及びとう道は、消火設備の設置及び非常出入り口の確保がされているものでなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備を収容し、又は設置する通信機械室、コンテナ等及びとう道において、他の電気通信事業者に電気通信設備を設置する場所を提供する場合は、当該電気通信設備が発火等により他の電気通信設備に損傷を与えないよう措置されたものであることを当該他の電気通信事業者からその旨を記載した書面の提出を受ける方法その他の方法により確認しなければならない。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢大規模災害対策｣について述べた次の文章のうち、正しいものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① ３以上の交換設備をループ状に接続する大規模な伝送路設備は、複数箇所の故障等により広域にわたり通信が停止することのないよう、当該伝送路設備により囲まれる地域を横断する伝送路設備の追加的な設置、臨時の電気通信回線の設置に必要な技術を有する者の配置の措置を講じること。</p>\n<p class=\"opt\">② 電気通信役務に係る情報の管理、電気通信役務の制御又は端末設備等の認証等を行うための電気通信設備であって、その故障等により、広域にわたり電気通信役務の提供に重大な支障を及ぼすおそれのあるものは、複数の地域に分散して設置すること。この場合において、一の電気通信設備の故障等の発生時に、他の電気通信設備によりなるべくその機能を代替することができるようにすること。</p>\n<p class=\"opt\">③ 伝送路設備を複数の経路により設置する場合には、互いに交差しないように設置すること。</p>\n<p class=\"opt\">④ 地方公共団体が定める防災に関する計画及び地方公共団体が公表する自然災害の想定に関する情報を考慮し、電気通信設備の使用の態様を決定若しくは変更し、又は適切な防災措置を講じること。</p>\n<p class=\"opt\">⑤ 固定電話接続用設備は、大規模な災害により電気通信役務の提供に重大な支障が生じることを防止するため、他の電気通信設備によりその機能を代替することができるようにしなければならない。</p>"}, {"tag": "R7-1", "title": "令和７年度 第１回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、正しいものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 固定電話接続用設備とは、事業用電気通信設備であって、他の電気通信事業者の電気通信設備との接続を行うために設置される電気通信設備の機器(専ら特定の一の者の電気通信設備との接続を行うために設置されるものを除く。)と同一の業務区域に設置されるものをいう。ただし、事業用電気通信設備及び他の電気通信事業者の電気通信設備は、メタルインターネットプロトコル電話用設備、ワイヤレス固定電話用設備、インターネットプロトコルを用いた総合デジタル通信用設備及び電気通信番号規則別表に掲げる固定電話番号を使用して電気通信役務を提供するインターネットプロトコル電話用設備に限る。</p>\n<p class=\"opt\">② インターネットプロトコル電話用設備とは、事業用電気通信設備のうち、端末設備等をインターネットプロトコルを使用して回線交換網に接続するもの(携帯電話用設備を除く。)であって、音声伝送役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ ワイヤレス固定電話用設備とは、２線式アナログ電話用設備のうち、認定電気通信事業者が認定電気通信事業に係る電気通信役務を提供する電気通信事業の用に供する電気通信設備であって、その伝送路設備の一部に他の電気通信事業者が設置する携帯電話用設備を用いるものをいう。</p>\n<p class=\"opt\">④ 直流回路とは、電気通信回線設備に接続して電気通信事業者の端末系伝送路設備の動作の開始及び終了の制御を行うための回路をいう。</p>\n<p class=\"opt\">⑤ 平均繁忙時とは、１日のうち年間を平均して電気通信設備の負荷が最大となる連続した１時間をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢故障検出｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)事業用電気通信設備は、電源停止、 (イ) の動作停止その他電気通信役務の提供に直接係る機能に重大な支障を及ぼす故障等の発生時には、これを直ちに検出し、当該事業用電気通信設備を (ウ) 機能を備えなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 共通制御機器</p>\n<p class=\"opt\">② 監視装置</p>\n<p class=\"opt\">③ 停止し、予備機器に切り替える</p>\n<p class=\"opt\">④ 現用予備切替装置</p>\n<p class=\"opt\">⑤ 現用機器</p>\n<p class=\"opt\">⑥ 維持し、又は運用する者に通知する</p>\n<p class=\"opt\">⑦ 遠隔で再起動する</p>\n<p class=\"opt\">⑧ 事業用電気通信回線設備から切り離す</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣について述べた次のＡ～Ｃの文章は、 (エ) 。ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 交換設備は、異常ふくそう(特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が継続して著しく低下する現象をいう。)が発生した場合に、これを検出し、かつ、通信の疎通を停止する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が同時に集中することがないようこれを制御することができる交換設備については、この限りでない。</p>\n<p class=\"stmt\">Ｂ 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、多数の移動端末設備が同時に電気通信設備と接続する場合等に生じるトラヒックの瞬間的かつ急激な増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置が講じられなければならない。選択可能な措置の一つに、トラヒックの瞬間的かつ急激な増加の発生を防止又は抑制する措置がある。</p>\n<p class=\"stmt\">Ｃ 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、移動端末設備に由来する制御信号の増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置が講じられなければならない。選択可能な措置の一つに、制御信号の増加による電気通信設備の負荷を軽減させる措置がある。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢停電対策｣又は｢誘導対策｣について述べた次の文章のうち、誤っているものは、 (オ) である。ただし、事業用電気通信設備規則第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機及び蓄電池の設置その他これに準ずる措置が講じられていなければならない。この場合において、事業用電気通信設備のうち交換設備にあっては、自家用発電機はその機能を代替することができる予備機器の設置が講じられていなければならない。</p>\n<p class=\"opt\">② 通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機の設置又は移動式の電源設備の配備を行う場合には、それらに使用される燃料について、十分な量の備蓄又は補給手段の確保に努めなければならない。</p>\n<p class=\"opt\">③ 電気通信事業者は、固定電話接続用設備について、通常受けている電力の供給が長時間にわたり停止した場合においてその取り扱う通信が停止することのないよう自家用発電機又は蓄電池の設置その他これに準ずる措置を講ずるよう努めなければならない。</p>\n<p class=\"opt\">④ 線路設備は、強電流電線からの電磁誘導作用により事業用電気通信設備の機能に重大な支障を及ぼすおそれのある異常電圧又は異常電流が発生しないように設置しなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の秘密の保持における｢蓄積情報保護｣について述べたものである。 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)事業用電気通信設備に利用者の通信の内容その他これに係る情報を蓄積する場合にあっては、当該事業用電気通信設備は、当該利用者以外の者が端末設備等を用いて容易にその情報を知得し、又は (カ) することを防止するため、当該利用者のみに与えた (キ) その他の防止措置が講じられなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 暗証番号の変更</p>\n<p class=\"opt\">② 消去</p>\n<p class=\"opt\">③ 破壊</p>\n<p class=\"opt\">④ 識別符号の照合確認</p>\n<p class=\"opt\">⑤ 権限の制限</p>\n<p class=\"opt\">⑥ 解読</p>\n<p class=\"opt\">⑦ 改変</p>\n<p class=\"opt\">⑧ 電気通信番号の再設定</p>"}, {"tag": "R7-2", "title": "令和７年度 第２回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する用語について述べた次の文章のうち、誤っているものは、(ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① メタルインターネットプロトコル電話用設備とは、２線式アナログ電話用設備のうち、他の電気通信事業者の電気通信設備を接続する点においてインターネットプロトコルを使用するもの(ワイヤレス固定電話用設備を除く。)をいう。</p>\n<p class=\"opt\">② インターネットプロトコルを用いた総合デジタル通信用設備とは、総合デジタル通信用設備のうち、他の電気通信事業者の電気通信設備を接続する点においてインターネットプロトコルを使用するものをいう。</p>\n<p class=\"opt\">③ 固定電話接続用設備とは、事業用電気通信設備(メタルインターネットプロトコル電話用設備、ワイヤレス固定電話用設備、インターネットプロトコルを用いた総合デジタル通信用設備及び電気通信番号規則別表に掲げる固定電話番号を使用して電気通信役務を提供するインターネットプロトコル電話用設備に限る。)であって、他の電気通信事業者の電気通信設備(メタルインターネットプロトコル電話用設備、ワイヤレス固定電話用設備、インターネットプロトコルを用いた総合デジタル通信用設備及び電気通信番号規則別表に掲げる固定電話番号を使用して電気通信役務を提供するインターネットプロトコル電話用設備に限る。)との接続を行うために設置される電気通信設備の機器(専ら特定の一の者の電気通信設備との接続を行うために設置されるものを除く。)と同一の構内に設置されるものをいう。</p>\n<p class=\"opt\">④ 特定携帯電話用設備とは、事業用電気通信設備のうち、電気通信設備又は提供すべき電気通信役務の種類又は内容を電気通信番号規則別表に掲げる特定接続電話番号により識別するための電気通信設備及びこれと一体として設置される電気通信設備(携帯電話用設備を除く。)であって、携帯無線通信による電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">⑤ 国際交換設備とは、本邦外の場所への発信又は本邦外からの着信を行う機能を有する交換設備をいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢予備機器等｣について述べた次の文章のうち、誤っているものは、 (イ) である。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 伝送路設備には、予備の電気通信回線を設置しなければならない。ただし、当該伝送路設備の故障等の発生時に、端末回線によりその疎通が確保できるものは、この限りでない。</p>\n<p class=\"opt\">② 伝送路設備において当該伝送路設備に設けられた電気通信回線に共通に使用される機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"opt\">③ 交換設備相互間を接続する伝送路設備は、複数の経路により設置されなければならない。ただし、地形の状況により複数の経路の設置が困難な場合又は伝送路設備の故障等の対策として複数の経路による設置と同等以上の効果を有する措置が講じられる場合は、この限りでない。</p>\n<p class=\"opt\">④ 固定電話接続用設備は、その故障等の発生時に他の地域に設置された固定電話接続用設備に速やかに切り替えられるようにしなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢試験機器及び応急復旧機材の配備｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)事業用電気通信設備の工事、維持又は運用を行う事業場には、当該事業用電気通信設備の(ウ) に必要な試験機器の配備又はこれに準ずる措置がなされていなければならない。当該事業用電気通信設備の故障等が発生した場合における応急復旧工事、 (エ) の設置、電力の供給その他の応急復旧措置を行うために必要な機材の配備又はこれに準ずる措置がなされていなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① 機能の確認</p>\n<p class=\"opt\">② 代替の機器</p>\n<p class=\"opt\">③ 人工衛星局</p>\n<p class=\"opt\">④ 点検及び検査</p>\n<p class=\"opt\">⑤ 認証及び検定</p>\n<p class=\"opt\">⑥ 免許の申請</p>\n<p class=\"opt\">⑦ 緊急通報装置</p>\n<p class=\"opt\">⑧ 評価及び認定</p>\n<p class=\"opt\">⑨ 一時的な端末設備</p>\n<p class=\"opt\">⑩ 臨時の電気通信回線</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢異常ふくそう対策等｣又は｢誘導対策｣について述べた次の文章のうち、正しいものは、 (オ) である。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 異常ふくそうとは、特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が一時的に著しく低下する現象をいう。</p>\n<p class=\"opt\">② 交換設備は、異常ふくそうが発生した場合に、これを検出し、かつ、通信の集中を規制する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が一時的に遮断することがないようこれを制御することができる交換設備については、この限りでない。</p>\n<p class=\"opt\">③ 携帯電話用設備、特定携帯電話用設備及びＰＨＳ用設備は、移動端末設備に由来する制御信号の増加により電気通信役務の提供に重大な支障を及ぼすことがないよう、措置が講じられなければならない。選択可能な措置の一つに、制御信号の増加に対応するための十分な通信容量を有する電気通信設備の設置がある。</p>\n<p class=\"opt\">④ 携帯電話用設備及び特定携帯電話用設備のうち、その損壊又は故障等による利用者の利益に及ぼす影響が大きいものとして告示した設備は、トラヒックの瞬間的かつ急激な増加及び制御信号の増加を想定した加速劣化試験を実施し、電気通信役務の提供に重大な支障を及ぼすことがないようにするために講じた措置の実効性を確保しなければならない。</p>\n<p class=\"opt\">⑤ 線路設備は、強電流電線からの静電誘導作用により事業用電気通信設備の機能に重大な支障を及ぼすおそれのある異常電圧又は異常電流が発生しないように設置しなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 音声伝送役務の提供の用に供する電気通信設備のアナログ電話用設備における、事業用電気通信設備が発信側の端末設備等に対して、事業用電気通信設備規則で規定する場合にその状態を可聴音により通知するとき、端末設備等を接続する点において送出しなければならない可聴音及びその信号送出形式について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 端末設備等が送出する発呼信号を受信した後、選択信号を受信することが可能となった場合に送出する可聴音を呼出音といい、接続の要求をされた着信側の端末設備等を呼出し中である場合に送出する可聴音を着信音という。</p>\n<p class=\"stmt\">Ｂ 接続の要求をされた着信側の端末設備等が着信可能な状態でない場合又は接続の要求をされた着信側の端末設備等への接続が不可能な場合に送出する可聴音を話中音という。</p>\n<p class=\"stmt\">Ｃ 発信音の場合における信号送出形式は、４００ヘルツの周波数の信号を連続送出するものであること。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R8-1", "title": "令和８年度 第１回", "html": "<h3 class=\"q-h\">問３ 次の各問いは、｢事業用電気通信設備規則｣に規定する内容に関するものである。同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 用語について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① ワイヤレス固定電話用設備とは、２線式アナログ電話用設備のうち、第１種適格電気通信事業者が認定電気通信事業に係る電気通信役務を提供する電気通信事業の用に供する電気通信設備であって、その伝送路設備の一部に他の電気通信事業者が設置する携帯電話用設備を用いるものをいう。</p>\n<p class=\"opt\">② 携帯電話用設備とは、事業用電気通信設備のうち、無線設備規則に規定する携帯無線通信による電気通信役務の提供の用に供するものをいう。</p>\n<p class=\"opt\">③ 呼量とは、１時間に発生した呼の保留時間の総和を１時間で除したものをいう。</p>\n<p class=\"opt\">④ 異常ふくそうとは、特定の交換設備に対し通信が集中することにより、交換設備の通信の疎通能力が継続して著しく低下する現象をいう。</p>\n<p class=\"opt\">⑤ インターネットプロトコル携帯電話用設備とは、携帯電話用設備であって、端末設備等をインターネットプロトコルを使用してパケット交換網に接続するもののうち、電気通信番号規則別表に掲げる音声伝送携帯電話番号を使用するものをいう。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢予備機器等｣について述べた次のＡ～Ｃの文章は、 (イ) 。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 通信路の設定に直接係る交換設備の機器は、その機能を代替することができる予備の機器による同期運転若しくは冗長構成の措置又はこれに準ずる措置が講じられ、かつ、その損壊又は故障(以下｢故障等｣という。)の発生時に当該予備の機器に速やかに切り替えられるようにしなければならない。ただし、端末回線(端末設備等と交換設備との間の電気通信回線をいう。)を当該交換設備に接続するための機器、及び当該交換設備の故障等の発生時に、他の交換設備によりその疎通が確保できる交換設備の機器については、この限りでない。</p>\n<p class=\"stmt\">Ｂ 伝送路設備には、予備の電気通信回線を設置しなければならない。ただし、端末回線その他不特定かつ多数の者の通信を取り扱う区間に使用するものについては、この限りでない。</p>\n<p class=\"stmt\">Ｃ 交換設備相互間を接続する伝送路設備は、複数の経路により設置されなければならない。ただし、地形の状況により複数の経路の設置が困難な場合又は伝送路設備の故障等の対策として複数の経路による設置と同等以上の効果を有する措置が講じられる場合は、この限りでない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢電源設備｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)事業用電気通信設備の電源設備は、平均繁忙時に事業用電気通信設備の (ウ) を安定的に供給できる容量があり、かつ、供給電圧又は供給電流を常に事業用電気通信設備の動作電圧又は動作電流の変動許容範囲内に維持できるものでなければならない。ここで、平均繁忙時とは、１日のうち年間を平均して電気通信設備の (エ) が最大となる連続した１時間をいう。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① 出線能率</p>\n<p class=\"opt\">② 能力</p>\n<p class=\"opt\">③ 呼量</p>\n<p class=\"opt\">④ 負荷</p>\n<p class=\"opt\">⑤ 呼数</p>\n<p class=\"opt\">⑥ 出力</p>\n<p class=\"opt\">⑦ 最大電力</p>\n<p class=\"opt\">⑧ 消費電流</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢事業用電気通信設備を設置する建築物等｣に規定される、事業用電気通信設備を収容し、又は設置する建築物及びコンテナ等について述べた次の文章のうち、正しいものは、 (オ) である。ただし、第１６条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 風水害その他の自然災害及び火災の被害を容易に受けない環境に設置されたものでなければならない。ただし、やむを得ず風水害その他の自然災害及び火災の被害を受けやすい環境に設置されたものであって、防水壁又は防火壁の設置その他の必要な防護措置が講じられているものは、この限りでない。</p>\n<p class=\"opt\">② 当該事業用電気通信設備を収容し、又は設置する通信機械室に、小動物が容易に出入りし、又は小動物が容易に事業用電気通信設備に触れることができないよう金網による囲いその他必要な措置が講じられているものでなければならない。</p>\n<p class=\"opt\">③ 当該事業用電気通信設備を安全に設置することができる堅固で絶縁性に優れ、特別保安接地を施した電気的遮へい層を有する隔壁で保護されているものでなければならない。</p>\n<p class=\"opt\">④ 当該事業用電気通信設備が安定に動作する電力の供給及び電線路を維持することができるものでなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 音声伝送役務の提供の用に供する電気通信設備のメタルインターネットプロトコル電話用設備が、警察機関等に送信した電気通信番号による呼び返しを行う場合にあって確保されなければならない機能について述べた次の文章のうち、誤っているものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 緊急通報を発信した端末設備等に当該緊急通報に係る電気通信番号規則別表に掲げる緊急通報番号を送信する機能を有すること。</p>\n<p class=\"opt\">② 緊急通報を発信した端末設備等が、当該端末設備等に係る着信を他の端末設備等と三者通話する機能を有する場合にあっては、当該機能を解除する機能を有すること。</p>\n<p class=\"opt\">③ 緊急通報を発信した端末設備等が、特定の電気通信番号を有する端末設備等からの着信を拒否する機能を有する場合にあっては、当該機能を解除する機能を有すること。</p>\n<p class=\"opt\">④ 緊急通報を発信した端末設備等からの発信(緊急通報に係るものを除く。)及び当該端末設備等への着信(呼び返しに係るものを除く。)を当該端末設備等からの当該緊急通報に係る終話信号の送出後一定の時間制限する機能を有すること。</p>\n<p class=\"opt\">⑤ 呼び返しに係る通信を災害時優先通信(緊急通報及び電気通信事業法に規定する重要通信のうち電気通信事業法施行規則に定める機関が発信する通信)として取り扱う機能を有すること。</p>"}], "4": [{"tag": "R4-1", "title": "令和４年度 第１回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備における他の電気通信設備との責任の分界について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備は、他の電気通信事業者の接続する電気通信設備との責任の分界を明確にするため、他の電気通信事業者の電気通信設備との間に分界点を有しなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備は、分界点において他の電気通信事業者が接続する電気通信設備から切り離せるものでなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、分界点において他の電気通信事業者の電気通信設備を切り離し又はこれに準ずる方法により当該事業用電気通信設備の保安装置を切り替えできる措置が講じられていなければならない。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の他の電気通信設備の損傷又は機能の障害の防止における｢損傷防止｣、｢機能障害の防止｣、｢異常ふくそう対策｣又は｢保安装置｣について述べた次の文章のうち、誤っているものは、 (イ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、利用者又は他の電気通信事業者の接続する電気通信設備(以下｢接続設備｣という。)を損傷するおそれのある電力若しくは電流を送出し、又は接続設備を損傷するおそれのある電圧若しくは光出力により送出するものであってはならない。</p>\n<p class=\"opt\">② 事業用電気通信設備は、接続設備の機能に障害を与えるおそれのある電気信号又は磁気信号を送出するものであってはならない。</p>\n<p class=\"opt\">③ 他の電気通信事業者の電気通信設備を接続する交換設備は、異常ふくそうの発生により当該交換設備が他の電気通信事業者の接続する電気通信設備に対して重大な支障を及ぼすことのないよう、直ちに異常ふくそうの発生を検出し、及び通信の集中を規制する機能又はこれと同等の機能を有するものでなければならない。ただし、通信が集中することがないようこれを制御することができる交換設備についてはこの限りでない。</p>\n<p class=\"opt\">④ 落雷又は強電流電線との混触により線路設備に発生した異常電圧及び異常電流によって接続設備を損傷するおそれのある場合は、交流５００ボルト以下で動作する避雷器及び７アンペア以下で動作するヒューズ若しくは５００ミリアンペア以下で動作する熱線輪からなる保安装置又はこれと同等の保安機能を有する装置が事業用電気通信設備と接続設備を接続する点又はその近傍に設置されていなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、端末設備等規則に規定する｢絶縁抵抗等｣について述べたものである。□内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)きょう端末設備の機器は、その電源回路と筐体及びその電源回路と (ウ) との間において、使用電圧が３００ボルト以下の場合にあっては、 (エ) メガオーム以上の絶縁抵抗を有しなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① ０.１</p>\n<p class=\"opt\">② ０.２</p>\n<p class=\"opt\">③ 保安装置</p>\n<p class=\"opt\">④ 自営電気通信設備</p>\n<p class=\"opt\">⑤ ０.３</p>\n<p class=\"opt\">⑥ ０.４</p>\n<p class=\"opt\">⑦ 直流回路</p>\n<p class=\"opt\">⑧ 大地</p>\n<p class=\"opt\">⑨ ０.５</p>\n<p class=\"opt\">⑩ 事業用電気通信設備</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、端末設備の安全性等について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 端末設備は、事業用電気通信設備との間で鳴音(電気的又は音響的結合により生ずる発振状態をいう。)を発生することを防止するために総務大臣が別に告示する条件を満たすものでなければならない。</p>\n<p class=\"opt\">② 通話機能を有する端末設備は、通話中に受話器から過大な音響衝撃が発生することを防止する機能を備えなければならない。</p>\n<p class=\"opt\">③ 配線設備等の電線相互間及び電線と大地間の絶縁抵抗は、直流２００ボルト以上の一の電圧で測定した値で１メガオーム以上であること。</p>\n<p class=\"opt\">④ 端末設備を構成する一の部分と他の部分相互間において電波を使用する端末設備は、使用する電波の周波数が空き状態であるかどうかについて、総務大臣が別に告示するところにより判定を行い、空き状態である場合にのみ直流回路を開くものでなければならない。ただし、総務大臣が別に告示するものについては、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する、電話用設備に接続される端末設備におけるアナログ電話端末の｢発信の機能｣及び｢緊急通報機能｣について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 自動的に選択信号を送出する場合にあっては、直流回路を閉じてから３秒以上経過後に選択信号の送出を開始するものであること。ただし、電気通信回線からの発信音又はこれに相当する可聴音を確認した後に選択信号を送出する場合にあっては、この限りでない。</p>\n<p class=\"stmt\">Ｂ 自動再発信(応答のない相手に対し引き続いて繰り返し自動的に行う発信をいう。以下同じ。)を行う場合(自動再発信の回数が１５回以内の場合を除く。)にあっては、その回数は最初の発信から３分間に２回以内であること。この場合において、最初の発信から３分を超えて行われる発信は、別の発信とみなす。なお、この規定は、火災、盗難その他の非常の場合にあっては、適用しない。</p>\n<p class=\"stmt\">Ｃ アナログ電話端末であって、通話の用に供するものは、電気通信番号規則に掲げる緊急通報番号を使用した警察機関、医療機関又は消防機関への通報を発信する機能を備えなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R4-2", "title": "令和４年度 第２回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の損壊又は故障の対策におけるアナログ電話用設備等の｢大規模災害対策｣について述べた次の文章のうち、誤っているものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① ３以上の交換設備をループ状に接続する大規模な伝送路設備は、複数箇所の故障等により広域にわたり通信が停止することのないよう、当該伝送路設備により囲まれる地域を横断する伝送路設備の追加的な設置、臨時の電気通信回線の設置に必要な技術を有する者の配置の措置を講じること。</p>\n<p class=\"opt\">② 電気通信役務に係る情報の管理、電気通信役務の制御又は端末設備等の認証等を行うための電気通信設備であって、その故障等により、広域にわたり電気通信役務の提供に重大な支障を及ぼすおそれのあるものは、複数の地域に分散して設置すること。この場合において、一の電気通信設備の故障等の発生時に、他の電気通信設備によりなるべくその機能を代替することができるようにすること。</p>\n<p class=\"opt\">③ 伝送路設備を複数の経路により設置する場合には、互いになるべく離れた場所に設置すること。</p>\n<p class=\"opt\">④ 地方公共団体が定める防災に関する計画及び地方公共団体が公表する自然災害の想定に関する情報を考慮し、電気通信設備の設置場所を決定若しくは変更し、又は適切な防災措置を講じること。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、音声伝送役務の提供の用に供する電気通信設備のアナログ電話用設備における、事業用電気通信設備が発信側の端末設備等に対して、同規則で規定する場合にその状態を可聴音により通知するとき、端末設備等を接続する点において送出しなければならない可聴音及びその信号送出形式について述べた次の文章のうち、正しいものは、 (イ)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 端末設備等が送出する発呼信号を受信した後、選択信号を受信することが可能となった場合に送出する可聴音を呼出音という。</p>\n<p class=\"opt\">② 接続の要求をされた着信側の端末設備等を呼出し中である場合に送出する可聴音を話中音という。</p>\n<p class=\"opt\">③ 接続の要求をされた着信側の端末設備等が着信可能な状態でない場合又は接続の要求をされた着信側の端末設備等への接続が不可能な場合に送出する可聴音を発信音という。</p>\n<p class=\"opt\">④ 発信音の場合における信号送出形式は、４００ヘルツの周波数の信号を連続送出するものであること。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は 、 端末設備等規則に規定する 、 電話用設備に接続される移動電話端末の ｢重要通信の確保のための機能｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)移動電話端末は、重要通信を確保するため、移動電話用設備からの (ウ) 場合にあっては、 (エ) 機能を備えなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① 災害時優先通信の指示を受けた</p>\n<p class=\"opt\">② 発信しない</p>\n<p class=\"opt\">③ 送信が衝突した信号を受信した</p>\n<p class=\"opt\">④ 自動的にその着信を拒否する</p>\n<p class=\"opt\">⑤ 発信の規制を要求する信号を受信した</p>\n<p class=\"opt\">⑥ 自動的に回線を切断する</p>\n<p class=\"opt\">⑦ 位置情報を更新し、かつ、保持する</p>\n<p class=\"opt\">⑧ 位置情報の登録を拒否する信号を受信した</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、アナログ電話端末の｢直流回路の電気的条件等｣について述べた次のＡ～Ｃの文章は、 (オ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 直流回路を閉じているときのアナログ電話端末の直流回路の直流抵抗値は、２０ミリアンペア以上１２０ミリアンペア以下の電流で測定した値で１０オーム以上１００オーム以下でなければならない。ただし、直流回路の直流抵抗値と電気通信事業者の交換設備からアナログ電話端末までの線路の直流抵抗値の和が５０オーム以上１,７００オーム以下の場合にあっては、この限りでない。</p>\n<p class=\"stmt\">Ｂ 直流回路を閉じているときのアナログ電話端末のダイヤルパルスによる選択信号送出時における直流回路の静電容量は、１０マイクロファラド以下でなければならない。</p>\n<p class=\"stmt\">Ｃ アナログ電話端末は、電気通信回線に対して直流の電圧を加えるものであってはならない。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する安全性等について述べた次の文章のうち 、 誤っているものは、(カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 配線設備等の評価雑音電力は、絶対レベルで表した値で定常時においてマイナス６４デシベル以下であり、かつ、最大時においてマイナス５８デシベル以下であること。きょう</p>\n<p class=\"opt\">② 端末設備の機器は、その電源回路と筐体及びその電源回路と事業用電気通信設備との間において、使用電圧が７５０ボルトを超える直流及び６００ボルトを超える交流の場合にあっては、その使用電圧の１.５倍の電圧を連続して１０分間加えたときこれに耐える絶縁耐力を有しなければならない。</p>\n<p class=\"opt\">③ 通話機能を有する端末設備は、通話中に受話器から過大な誘導雑音が発生することを防止する機能を備えなければならない。</p>\n<p class=\"opt\">④ 端末設備を構成する一の部分と他の部分相互間において電波を使用する端末設備において使用される無線設備は、一の筐体に収められており、かつ、容易に開けることができないものでなければならない。ただし、総務大臣が別に告示するものについては、この限りでない。</p>"}, {"tag": "R5-1", "title": "令和５年度 第１回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備における総合デジタル通信用設備の｢基本機能｣について述べた次の文章のうち、誤っているものは、 (ア)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 発信側の端末設備等からの発信を認識し、着信側の端末設備等に通知すること。</p>\n<p class=\"opt\">② 電気通信番号を認識すること。</p>\n<p class=\"opt\">③ 着信側の端末設備等の応答を認識し、発信側の端末設備等に通知すること。</p>\n<p class=\"opt\">④ インターネットプロトコルを用いた総合デジタル通信用設備にあっては、ファクシミリによる誤送信が防止できること。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、基礎的電気通信役務を提供する電気通信事業の用に供する電気通信設備の損壊又は故障の対策における｢予備機器｣及び｢停電対策｣について述べた次のＡ～Ｃの文章は、 (イ) 。ただし、第４０条の適用除外規定は考慮しないものとする。(４点)</p>\n<p class=\"stmt\">Ａ 通信路の設定に直接係る交換設備の機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に速やかに当該予備の機器に切り替えられるようにしなければならない。ただし、専ら一の者の通信を取り扱う電気通信回線を当該交換設備に接続するための機器、又は当該交換設備の故障等の発生時に、他の交換設備によりその疎通が確保できる交換設備の機器については、この限りでない。</p>\n<p class=\"stmt\">Ｂ 多重変換装置等の伝送設備において当該伝送設備に接続された電気通信回線に共通に使用される機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に速やかに当該予備の機器と切り替えられるようにしなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機及び蓄電池の設置その他これに準ずる措置が講じられていなければならない。ただし、事業用電気通信設備のうち交換設備にあっては、自家用発電機はその機能を代替することができる予備の機器の設置が講じられていなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、端末設備等規則に規定する、端末設備の機器の絶縁耐力について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)きょう端末設備の機器は、その電源回路と筐体及びその電源回路と (ウ) との間において、使用電圧が７５０ボルトを超える直流及び６００ボルトを超える交流の場合にあっては、その使用電圧の (エ) 倍の電圧を連続して１０分間加えたときこれに耐える絶縁耐力を有しなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① １.５</p>\n<p class=\"opt\">② １０</p>\n<p class=\"opt\">③ 配線設備</p>\n<p class=\"opt\">④ 雷防護回路</p>\n<p class=\"opt\">⑤ ２</p>\n<p class=\"opt\">⑥ ２０</p>\n<p class=\"opt\">⑦ 事業用電気通信設備</p>\n<p class=\"opt\">⑧ ５</p>\n<p class=\"opt\">⑨ 大地</p>\n<p class=\"opt\">⑩ 自営電気通信設備</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、電話用設備に接続される端末設備におけるアナログ電話端末の｢直流回路の電気的条件等｣、｢発信の機能｣又は｢選択信号の条件｣について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 直流回路を開いているときのアナログ電話端末の呼出信号受信時における直流回路の静電容量は、５マイクロファラド以下であり、インピーダンスは、７５ボルト、１６ヘルツの交流に対して１キロオーム以上でなければならない。</p>\n<p class=\"opt\">② アナログ電話端末は、電気通信回線に対して直流の電圧を加えるものであってはならない。</p>\n<p class=\"opt\">③ アナログ電話端末は、自動的に選択信号を送出する場合にあっては、直流回路を閉じてから３秒以上経過後に選択信号の送出を開始する機能を備えなければならない。ただし、電気通信回線からの発信音又はこれに相当する可聴音を確認した後に選択信号を送出する場合にあっては、この限りでない。</p>\n<p class=\"opt\">④ 押しボタンダイヤル信号のダイヤル番号は、低群周波数及び高群周波数の中からそれぞれ一つを選び、これら二つの周波数の組合せで規定されている。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 次の文章は、端末設備等規則に規定する、電話用設備に接続される端末設備における移動電話端末の｢受信レベル通知機能｣について述べたものである。 □内の(カ)、(キ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。 (２点×２＝４点)移動電話端末は、受信レベルの通知に関する次の機能を備えなければならない。</p>\n<p class=\"item\">(ⅰ) 移動電話用設備から指定された条件に基づき、移動電話端末の周辺の移動電話用設備の指定された (カ) の受信レベルについて検出を行い、指定された時間間隔ごとに移動電話用設備にその結果を通知するものであること。</p>\n<p class=\"item\">(ⅱ) (キ) の受信レベルと移動電話端末の周辺の移動電話用設備の (カ) の最大受信レベルが移動電話用設備から指定された条件を満たす場合にあっては、その結果を移動電話用設備に通知するものであること。</p>\n<p class=\"cg-h\">&lt;(カ)、(キ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信番号</p>\n<p class=\"opt\">② 制御チャネル</p>\n<p class=\"opt\">③ 選択信号</p>\n<p class=\"opt\">④ 応答信号</p>\n<p class=\"opt\">⑤ 通話チャネル</p>\n<p class=\"opt\">⑥ 音声信号</p>\n<p class=\"opt\">⑦ 呼出信号</p>\n<p class=\"opt\">⑧ 受信データ</p>"}, {"tag": "R5-2", "title": "令和５年度 第２回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備における他の電気通信設備との責任の分界について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 事業用電気通信設備は、他の電気通信事業者の接続する電気通信設備との責任の分界を明確にするため、他の電気通信事業者の電気通信設備との間に分界点を有しなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備は、分界点において他の電気通信事業者の接続する電気通信設備のふくそうを検知することができるものでなければならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、分界点において他の電気通信事業者の電気通信設備を切り離し又はこれに準ずる方法により当該事業用電気通信設備の正常性を確認できる措置が講じられていなければならない。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、音声伝送役務の提供の用に供する電気通信設備のアナログ電話相当の機能を有するインターネットプロトコル電話用設備における緊急通報を扱う事業用電気通信設備が適合しなければならない事項について述べた次のＡ～Ｃの文章は、 (イ) 。(４点)</p>\n<p class=\"stmt\">Ａ 緊急通報を、その発信に係る端末設備等の場所を管轄する警察機関等に接続すること。</p>\n<p class=\"stmt\">Ｂ 緊急通報を発信した端末設備等に係る電気通信番号その他当該発信に係る情報として、電気通信事業者が別に定める情報を、当該緊急通報に係る警察機関等の端末設備に送信する機能を有すること。ただし、他の方法により同等の機能を実現できる場合は、この限りでない。</p>\n<p class=\"stmt\">Ｃ 緊急通報を受信した端末設備から通信の終了を表す信号が送出されない限りその通話を継続する機能又は警察機関等に送信した電気通信番号による呼び返し若しくはこれに準ずる機能を有すること。</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 次の文章は、端末設備等規則に規定する、安全性等における｢配線設備等｣について述べたものである。 □内の(ウ)、(エ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)利用者が端末設備を事業用電気通信設備に接続する際に使用する線路及び保安器その他の機器(以下｢配線設備等｣という。)は、次により設置されなければならない。</p>\n<p class=\"item\">(ⅰ) 配線設備等の (ウ) は、絶対レベルで表した値で定常時においてマイナス６４デシベル以下であり、かつ、最大時においてマイナス５８デシベル以下であること。</p>\n<p class=\"item\">(ⅱ) 配線設備等の電線相互間及び電線と大地間の絶縁抵抗は、直流２００ボルト以上の一の電圧で測定した値で (エ) メガオーム以上であること。</p>\n<p class=\"cg-h\">&lt;(ウ)、(エ)の解答群&gt;</p>\n<p class=\"opt\">① ０.２</p>\n<p class=\"opt\">② ０.４</p>\n<p class=\"opt\">③ １</p>\n<p class=\"opt\">④ ２</p>\n<p class=\"opt\">⑤ 絶縁耐力</p>\n<p class=\"opt\">⑥ 熱雑音電力</p>\n<p class=\"opt\">⑦ 漏話減衰量</p>\n<p class=\"opt\">⑧ 評価雑音電力</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、電話用設備に接続される端末設備におけるアナログ電話端末の｢直流回路の電気的条件等｣又は｢送出電力｣について述べた次の文章のうち、正しいものは、(オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 直流回路を閉じているときのアナログ電話端末の直流回路の直流抵抗値は、２０ミリアンペア以上１２０ミリアンペア以下の電流で測定した値で５０オーム以上３００オーム以下でなければならない。ただし、直流回路の直流抵抗値と電気通信事業者の交換設備からアナログ電話端末までの線路の直流抵抗値の和が５０オーム以上１,７００オーム以下の場合にあっては、この限りでない。</p>\n<p class=\"opt\">② 直流回路を閉じているときのアナログ電話端末のダイヤルパルスによる選択信号送出時における直流回路の静電容量は、１０マイクロファラド以下でなければならない。</p>\n<p class=\"opt\">③ アナログ電話端末の４キロヘルツまでの送出電力の許容範囲は、通話の用に供する場合を除き、平均レベルで０ｄＢｍ以下で、かつ、最大レベルで８ｄＢｍを超えないこと。</p>\n<p class=\"opt\">④ アナログ電話端末は、電気通信回線に対して交流の電圧を加えるものであってはならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する、総合デジタル通信用設備に接続される端末設備の｢基本的機能｣、｢発信の機能｣又は｢電気的条件等｣について述べた次の文章のうち、正しいものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 総合デジタル通信端末は、発信又は応答を行う場合にあっては、呼設定用メッセージを送出する機能を備えなければならない。ただし、総務大臣が別に告示する場合はこの限りでない。</p>\n<p class=\"opt\">② 発信に際して相手の端末設備からの応答を自動的に確認する場合にあっては、電気通信回線からの応答が確認できない場合呼設定メッセージ送出終了後３分以内に呼切断用メッセージを送出するものであること。</p>\n<p class=\"opt\">③ 自動再発信を行う場合(自動再発信の回数が１５回以内の場合を除く。)にあっては、その回数は最初の発信から２分間に３回以内であること。この場合において、最初の発信から２分を超えて行われる発信は、別の発信とみなす。なお、この規定は、火災、盗難その他の非常の場合にあっては、適用しない。</p>\n<p class=\"opt\">④ 総合デジタル通信端末は、総務大臣が別に告示する電気的条件及び機械的条件のいずれかの条件に適合するものでなければならない。</p>"}, {"tag": "R6-1", "title": "令和６年度 第１回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(オ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の他の電気通信設備の損傷又は機能の障害の防止における｢漏えい対策｣、｢損傷防止｣及び｢機能障害の防止｣について述べた次のＡ～Ｃの文章は、 (ア) 。(４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業者は、総務大臣が別に告示するところに従い特定端末設備又は自営電気通信設備と配線設備との間の電気通信回線に伝送される信号の漏えいに関し、あらかじめ基準を定め、その基準を維持するように努めなければならない。</p>\n<p class=\"stmt\">Ｂ 事業用電気通信設備は、利用者又は他の電気通信事業者の接続する電気通信設備(以下｢接続設備｣という。)を損傷するおそれのある電力若しくは電流を送出し、又は接続設備を損傷するおそれのある電圧若しくは光出力により送出するものであってはならない。</p>\n<p class=\"stmt\">Ｃ 事業用電気通信設備は、接続設備の機能に障害を与えるおそれのある電気信号又は磁気信号を送出するものであってはならない。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢電源供給｣又は｢信号極性｣について述べた次の文章のうち、誤っているものは、 (イ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、事業用電気通信設備規則に規定する呼出信号の送出時を除き、端末設備等を接続する点において端末設備等を切り離した時の線間電圧が４２ボルト以上かつ５３ボルト以下であることに適合する通信用電源を供給しなければならない。</p>\n<p class=\"opt\">② 事業用電気通信設備は、事業用電気通信設備規則に規定する呼出信号の送出時を除き、端末設備等を接続する点において両線間を３００オームの純抵抗で終端した時の回路電流が１５ミリアンペア以上であることに適合する通信用電源を供給しなければならない。</p>\n<p class=\"opt\">③ 事業用電気通信設備は、事業用電気通信設備規則に規定する呼出信号の送出時を除き、端末設備等を接続する点において両線間を５０オームの純抵抗で終端した時の回路電流が１５０ミリアンペア以下であることに適合する通信用電源を供給しなければならない。</p>\n<p class=\"opt\">④ 事業用電気通信設備は、事業用電気通信設備規則に規定する発呼信号を受信できる状態において、電源供給で規定する電源の極性(監視信号送出条件において｢信号極性｣という。)を端末設備等を接続する点において一方を地気(接地の電位をいう。)、他方を負極性としなければならない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 端末設備等規則に規定する安全性等について述べた次のＡ～Ｃの文章は、 (ウ) 。(４点)</p>\n<p class=\"stmt\">Ａ 端末設備は、事業用電気通信設備との間で鳴音(電気的又は音響的結合により生ずる発振状態をいう。)を発生することを防止するために電気通信事業者が定める技術的条件を満たすものでなければならない。</p>\n<p class=\"stmt\">Ｂ 端末設備は、事業用電気通信設備から漏えいする通信の内容を意図的に識別する機能を有してはならない。</p>\n<p class=\"stmt\">Ｃ 通話機能を有する端末設備は、通話中に受話器から過大な音響衝撃が発生することを防止する機能を備えなければならない。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、インターネットプロトコル電話端末の｢基本的機能｣、｢発信の機能｣又は｢ふくそう通知機能｣について述べた次の文章のうち、正しいものは、 (エ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 発信又は応答を行う場合にあっては、呼の設定を行うためのメッセージ又は当該メッセージに対応するためのメッセージを確認するものであること。</p>\n<p class=\"opt\">② 通信を終了する場合にあっては、呼の切断、解放若しくは取消しを行うためのメッセージ又は当該メッセージに対応するためのメッセージを確認するものであること。</p>\n<p class=\"opt\">③ 発信に際して相手の端末設備からの応答を自動的に確認する場合にあっては、電気通信回線からの応答が確認できない場合呼の設定を行うためのメッセージ送出終了後３分以内に通信終了メッセージを送出するものであること。</p>\n<p class=\"opt\">④ インターネットプロトコル電話端末は、インターネットプロトコル電話用設備からふくそうが発生している旨の信号を受信した場合にその旨を利用者に通知するための機能を備えなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する専用通信回線設備又はデジタルデータ伝送用設備に接続される端末設備の｢インターネットプロトコルを使用する専用通信回線設備等端末｣において規定される専用通信回線設備等端末が、適合しなければならない条件について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 当該専用通信回線設備等端末に備えられた電気通信の機能に係る設定を変更するための電気通信番号を有すること。</p>\n<p class=\"opt\">② 当該専用通信回線設備等端末が有する電気通信番号に係る識別符号であって、初めて当該専用通信回線設備等端末を利用するときにあらかじめ設定されているものの記録を促す機能若しくはこれに準ずるものを有すること又は当該識別符号について当該専用通信回線設備等端末の機器ごとに異なるものが付されていること若しくはこれに準ずる措置が講じられていること。</p>\n<p class=\"opt\">③ 当該専用通信回線設備等端末は、電気通信回線に対して交流の電圧を加えるものであってはならない。ただし、当該専用通信回線設備等端末の電気的条件等に規定する総務大臣が別に告示する条件において交流重畳が認められる場合にあっては、この限りでない。</p>\n<p class=\"opt\">④ 複数の電気通信回線と接続される当該専用通信回線設備等端末の回線相互間の漏話減衰量は、１,５００ヘルツにおいて７０デシベル以上でなければならない。</p>"}, {"tag": "R6-2", "title": "令和６年度 第２回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(オ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢監視信号受信条件｣又は｢監視信号送出条件｣で定める監視信号について述べた次の文章のうち、正しいものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 端末設備等から発信を行うため、当該端末設備等の直流回路を閉じて３００オーム以下の直流抵抗値を形成することにより送出する監視信号は、起動信号という。</p>\n<p class=\"opt\">② 端末設備等において当該端末設備等への着信に応答するため、当該端末設備等の直流回路を閉じて３００オーム以下の直流抵抗値を形成することにより送出する監視信号は、端末応答信号という。</p>\n<p class=\"opt\">③ 発信側の端末設備等において通話を終了するため、当該端末設備等の直流回路を開いて１メガオーム以上の直流抵抗値を形成することにより送出する監視信号は、終話信号という。</p>\n<p class=\"opt\">④ 着信側の端末設備等において通話を終了するため、当該端末設備等の直流回路を開いて１メガオーム以上の直流抵抗値を形成することにより送出する監視信号は、切断信号という。</p>\n<p class=\"opt\">⑤ 着信側の端末設備等が送出する端末応答信号を受信したとき、発信側の端末設備等に対して、信号極性を反転することにより送出する監視信号は、課金信号という。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話相当の機能を有するインターネットプロトコル電話用設備の｢基本機能｣について述べた次の文章のうち、誤っているものは、 (イ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(イ)の解答群&gt;</p>\n<p class=\"opt\">① 発信側の端末設備等からの発信を認識し、着信側の端末設備等に通知すること。</p>\n<p class=\"opt\">② 着信側の端末設備等の応答を認識し、発信側の端末設備等に通知すること。</p>\n<p class=\"opt\">③ 電気通信番号を認識すること。</p>\n<p class=\"opt\">④ 通信の終了を通知すること。</p>\n<p class=\"opt\">⑤ ファクシミリによる送受信が正常に行えること。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話相当の機能を有するインターネットプロトコル電話用設備の｢総合品質｣、｢安定品質｣及び｢異なる電気通信番号の送信の防止｣について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 電気通信事業者は、当該電気通信事業者の設置する事業用電気通信設備に接続する端末設備等相互間における通話の総合品質に関して、総務大臣が別に告示するところに従い、あらかじめ基準を定め、その基準を維持するように努めなければならない。ただし、当該端末設備等と国際中継回線を接続している国際交換設備との間の通話は、この限りでない。</p>\n<p class=\"stmt\">Ｂ 電気通信事業者は、当該電気通信事業者の設置する事業用電気通信設備について、総務大臣が別に告示するところにより、当該事業用電気通信設備を介して提供される音声伝送役務の安定性が確保されるよう必要な措置を講じなければならない。</p>\n<p class=\"stmt\">Ｃ 電気通信事業者は、当該電気通信事業者が利用者に付与した電気通信番号について、当該利用者の発信に係る電気通信番号と異なる電気通信番号を端末設備等又は他の電気通信事業者に送信することがないよう必要な措置を講じなければならない。ただし、他の利用者に対し、発信元を誤認させるおそれがない場合は、この限りでない。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する、端末設備の安全性等について述べた次の文章のうち、誤っているものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 通話機能を有する端末設備は、通話中に受話器から過大な音響衝撃が発生することを防止する機能を備えなければならない。</p>\n<p class=\"opt\">② 配線設備等の評価雑音電力は、絶対レベルで表した値で定常時においてマイナス６４デシベル以下であり、かつ、最大時においてマイナス５８デシベル以下であること。</p>\n<p class=\"opt\">③ 配線設備等の電線相互間及び電線と大地間の絶縁抵抗は、直流２００ボルト以上の一の電圧で測定した値で１メガオーム以上であること。</p>\n<p class=\"opt\">④ 端末設備を構成する一の部分と他の部分相互間において電波を使用する端末設備は、使用する電波の周波数が空き状態であるかどうかについて、総務大臣が別に告示するところにより判定を行い、空き状態である場合にのみ直流回路を開くものでなければならない。ただし、総務大臣が別に告示するものについては、この限りでない。</p>\n<p class=\"opt\">⑤ 端末設備を構成する一の部分と他の部分相互間において電波を使用する端末設備にきょうおいて使用される無線設備は、一の筐体に収められており、かつ、容易に開けることができないものでなければならない。ただし、総務大臣が別に告示するものについては、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する移動電話端末(インターネットプロトコル移動電話用設備に接続されるものを除く。)に関する用語について述べた次の文章のうち、誤っているものは、 (オ)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 移動電話端末とは、端末設備であって、移動電話用設備に接続されるものをいう。</p>\n<p class=\"opt\">② ランダムアクセス制御とは、複数の移動電話端末からの送信が衝突した場合、再び送信が衝突することを避けるために各移動電話端末が移動電話用設備から指定された値に従い再び送信することをいう。</p>\n<p class=\"opt\">③ タイムアラインメント制御とは、移動電話端末が、移動電話用設備から指示された値に従い送信タイミングを調整することをいう。</p>\n<p class=\"opt\">④ 位置登録制御とは、移動電話端末が、移動電話用設備に位置情報(移動電話端末の位置を示す情報をいう。)の登録を行うことをいう。</p>\n<p class=\"opt\">⑤ 移動電話端末固有情報とは、移動電話端末を特定するための情報であって、チャネルの設定に当たって使用されるものをいう。</p>"}, {"tag": "R7-1", "title": "令和７年度 第１回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(キ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備における他の電気通信設備の損傷又は機能の障害の防止について述べた次の文章のうち、正しいものは、 (ア) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、利用者又は他の電気通信事業者の接続する電気通信設備(以下｢接続設備｣という。)を損傷するおそれのある特定利用の制限を免れることができる情報、又は指令を入力するものであってはならない。</p>\n<p class=\"opt\">② 事業用電気通信設備は、接続設備の機能に障害を与えるおそれのある電気信号又は磁気信号を送出するものであってはならない。</p>\n<p class=\"opt\">③ 落雷又は強電流電線との混触により線路設備に発生した異常電圧及び異常電流によって接続設備を損傷するおそれのある場合は、交流５００ボルト以下で動作する避雷器及び７アンペア以下で動作するヒューズ若しくは５００ミリアンペア以下で動作する熱線輪からなる保安装置又はこれと同等の保安機能を有する装置が事業用電気通信設備と接続設備を接続する点又はその近傍に設置されていなければならない。</p>\n<p class=\"opt\">④ 電気通信事業者は、総務大臣が別に告示するところに従い特定端末設備又は自営電気通信設備と配線設備との間の電気通信回線に伝送される信号の漏えいに関し、あらかじめ基準を定め、その基準を維持するように努めなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢監視信号受信条件｣、｢信号極性｣について述べたものである。□内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)事業用電気通信設備は、端末設備等を接続する点において当該端末設備等が送出する監視信号を受信し、かつ、認識できるものでなければならない。端末設備等から発信を行うため、当該端末設備等の直流回路を閉じて (イ) オーム以下の直流抵抗値を形成することにより送出する監視信号を発呼信号という。事業用電気通信設備は、発呼信号を受信できる状態において、事業用電気通信設備規則で規定する電源の極性を端末設備等を接続する点において一方を (ウ) としなければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① ２００</p>\n<p class=\"opt\">② ３００</p>\n<p class=\"opt\">③ ６００</p>\n<p class=\"opt\">④ ７５０</p>\n<p class=\"opt\">⑤ 短絡、他方を正極性</p>\n<p class=\"opt\">⑥ 短絡、他方を負極性</p>\n<p class=\"opt\">⑦ 地気、他方を正極性</p>\n<p class=\"opt\">⑧ 地気、他方を負極性</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 端末設備等規則に規定する安全性等について述べた次の文章のうち 、 誤っているものは、(エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 端末設備は、事業用電気通信設備との間で鳴音(電気的又は音響的結合により生ずる発振状態をいう。)を発生することを防止するために総務大臣が別に告示する条件を満たすものでなければならない。きょう</p>\n<p class=\"opt\">② 端末設備の機器は、その電源回路と筐体及びその電源回路と事業用電気通信設備との間において、使用電圧が２５０ボルト以下の場合にあっては、２メガオーム以上の絶縁抵抗を有しなければならない。</p>\n<p class=\"opt\">③ 端末設備の機器は、その電源回路と筐体及びその電源回路と事業用電気通信設備との間において、使用電圧が２５０ボルトを超える場合にあっては、２,５００ボルトの電圧を連続して１分間加えたときこれに耐える絶縁耐力を有しなければならない。</p>\n<p class=\"opt\">④ 端末設備の機器の金属製の台及び筐体は、接地抵抗が２００オーム以下となるように接地しなければならない。ただし、安全な場所に危険のないように設置する場合にあっては、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 次の文章は、端末設備等規則に規定する、利用者が端末設備を事業用電気通信設備に接続する際に使用する線路及び保安器その他の機器(以下｢配線設備等｣という。)の評価雑音電力について述べたものである。 □内の(オ)、(カ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)配線設備等の評価雑音電力とは、通信回線が受ける妨害であって (オ) して定められる実効的雑音電力をいい、誘導によるものを含む。配線設備等の評価雑音電力は、絶対レベルで表した値で定常時においてマイナス (カ) デシベル以下であり、かつ、最大時においてマイナス５８デシベル以下でなければならない。</p>\n<p class=\"cg-h\">&lt;(オ)、(カ)の解答群&gt;</p>\n<p class=\"opt\">① ６０</p>\n<p class=\"opt\">② ６４</p>\n<p class=\"opt\">③ 変動要素を除外</p>\n<p class=\"opt\">④ 妨害の発生源を考慮</p>\n<p class=\"opt\">⑤ ６８</p>\n<p class=\"opt\">⑥ ７２</p>\n<p class=\"opt\">⑦ 人間の聴覚率を考慮</p>\n<p class=\"opt\">⑧ 時間変動を平均化</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する、インターネットプロトコル移動電話端末について述べた次の文章のうち、誤っているものは、 (キ) である。ただし、端末設備等規則第３２条の２５の｢特殊なインターネットプロトコル移動電話端末｣は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(キ)の解答群&gt;</p>\n<p class=\"opt\">① インターネットプロトコル移動電話端末は、総務大臣が別に告示する条件に適合する位置登録制御(インターネットプロトコル移動電話端末が、インターネットプロトコル移動電話用設備に位置情報(インターネットプロトコル移動電話端末の位置を示す情報をいう。)の登録を行うことをいう。)を行う機能を備えなければならない。</p>\n<p class=\"opt\">② インターネットプロトコル移動電話端末は、インターネットプロトコル移動電話用設備からのチャネルを指定する信号を受信した場合にあっては、指定されたチャネルに切り替える機能を備えなければならない。</p>\n<p class=\"opt\">③ インターネットプロトコル移動電話端末は、重要通信を確保するため、インターネットプロトコル移動電話用設備からの発信の規制を要求する信号を受信した場合にあっては、自動的に回線を切断する機能を備えなければならない。</p>\n<p class=\"opt\">④ インターネットプロトコル移動電話端末は、インターネットプロトコル移動電話用設備からふくそうが発生している旨の信号を受信した場合にその旨を利用者に通知するための機能を備えなければならない。</p>"}, {"tag": "R7-2", "title": "令和７年度 第２回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 事業用電気通信設備規則に規定する、第一号基礎的電気通信役務の提供の用に供する電気通信設備の｢停電対策｣又は｢予備機器｣について述べた次の文章のうち、誤っているものは、(ア) である。ただし、第４０条の適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① 事業用電気通信設備は、通常受けている電力の供給が停止した場合においてその取り扱う通信が停止することのないよう自家用発電機又は蓄電池の設置その他これに準ずる措置(交換設備にあっては、自家用発電機及び蓄電池の設置その他これに準ずる措置)が講じられていなければならない。</p>\n<p class=\"opt\">② 電気通信事業者は、固定電話接続用設備について、通常受けている電力の供給が長時間にわたり停止した場合においてその取り扱う通信が停止することのないよう自家用発電機又は蓄電池の設置その他これに準ずる措置(交換設備にあっては、自家用発電機及び蓄電池の設置その他これに準ずる措置)を講ずるよう努めなければならない。</p>\n<p class=\"opt\">③ 通信路の設定に直接係る交換設備の機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に速やかに当該予備の機器に切り替えられるようにしなければならない。ただし、不特定かつ多数の利用者の通信を取り扱う電気通信回線を当該交換設備に接続するための機器、又は当該交換設備の故障等の発生時に、他の交換設備によりその疎通が確保できる交換設備の機器については、この限りでない。</p>\n<p class=\"opt\">④ 多重変換装置等の伝送設備において当該伝送設備に接続された電気通信回線に共通に使用される機器は、その機能を代替することができる予備の機器の設置若しくは配備の措置又はこれに準ずる措置が講じられ、かつ、その故障等の発生時に速やかに当該予備の機器と切り替えられるようにしなければならない。</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の文章は、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢電源供給｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)事業用電気通信設備は、｢監視信号送出条件｣に規定する呼出信号の送出時を除き、端末設備等を接続する点において次の(ⅰ)～(ⅲ)に掲げる条件に適合する通信用電源を供給しなければならない。</p>\n<p class=\"item\">(ⅰ) 端末設備等を切り離した時の線間電圧が４２ボルト以上かつ (イ) ボルト以下であること。</p>\n<p class=\"item\">(ⅱ) 両線間を３００オームの純抵抗で終端した時の回路電流が１５ミリアンペア以上であること。</p>\n<p class=\"item\">(ⅲ) 両線間を５０オームの純抵抗で終端した時の回路電流が (ウ) ミリアンペア以下であること。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① ５３</p>\n<p class=\"opt\">② ６３</p>\n<p class=\"opt\">③ ７３</p>\n<p class=\"opt\">④ ８３</p>\n<p class=\"opt\">⑤ １１０</p>\n<p class=\"opt\">⑥ １３０</p>\n<p class=\"opt\">⑦ １５０</p>\n<p class=\"opt\">⑧ １７０</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 端末設備等規則に規定する固定電話端末(｢特殊な固定電話端末｣で規定するものを除く。)の｢発信の機能｣、｢ふくそう通知機能｣及び｢電気的条件等｣について述べた次のＡ～Ｃの文章は、(エ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 固定電話端末は、発信に際して相手の端末設備からの応答を自動的に確認する場合にあっては、電気通信回線からの応答が確認できない場合呼の設定を行うためのメッセージ送出終了後３分以内に通信終了メッセージを送出する機能を備えなければならない。</p>\n<p class=\"stmt\">Ｂ 固定電話端末は、固定電話用設備からふくそうが発生している旨の信号を受信した場合にその旨を利用者に通知するための機能を備えなければならない。</p>\n<p class=\"stmt\">Ｃ 固定電話端末は、総務大臣が別に告示する電気的条件及び光学的条件のいずれかの条件に適合するものでなければならない。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定するインターネットプロトコル移動電話端末の｢緊急通報機能｣又は｢インターネットプロトコル移動電話端末特定情報の変更を防止する機能｣について述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① インターネットプロトコル移動電話端末特定情報とは、インターネットプロトコル移動電話端末を特定するための情報であって、チャネルの設定に当たって使用されるものをいう。</p>\n<p class=\"opt\">② インターネットプロトコル移動電話端末特定情報は、容易に書換えができないこと。</p>\n<p class=\"opt\">③ インターネットプロトコル移動電話端末特定情報のうち利用者が直接使用するもの以外については、容易に知得ができないこと。</p>\n<p class=\"opt\">④ インターネットプロトコル移動電話端末特定情報を記憶する装置は、容易に取外しが可能であること。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する専用通信回線設備又はデジタルデータ伝送用設備に接続される端末設備の｢インターネットプロトコルを使用する専用通信回線設備等端末｣において規定される専用通信回線設備等端末が、適合しなければならない条件について述べた次の文章のうち、正しいものは、 (カ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 当該専用通信回線設備等端末は、電気通信回線に対して交流の電圧を加えるものであってはならない。ただし、当該専用通信回線設備等端末の電気的条件等に規定する総務大臣が別に告示する条件において交流重畳が認められる場合にあっては、この限りでない。</p>\n<p class=\"opt\">② 複数の電気通信回線と接続される当該専用通信回線設備等端末の回線相互間の漏話減衰量は、１,５００ヘルツにおいて７０デシベル以上でなければならない。</p>\n<p class=\"opt\">③ 当該専用通信回線設備等端末に備えられた電気通信の機能に係る設定を変更するための電気通信番号を有すること。</p>\n<p class=\"opt\">④ 当該専用通信回線設備等端末が有する電気通信番号に係る識別符号であって、初めて当該専用通信回線設備等端末を利用するときにあらかじめ設定されているものの記録を促す機能若しくはこれに準ずるものを有すること又は当該識別符号について当該専用通信回線設備等端末の機器ごとに異なるものが付されていること若しくはこれに準ずる措置が講じられていること。</p>"}, {"tag": "R8-1", "title": "令和８年度 第１回", "html": "<h3 class=\"q-h\">問４ 次の各問いは、｢事業用電気通信設備規則｣又は｢端末設備等規則｣に規定する内容に関するものである。それぞれの規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、事業用電気通信設備規則に規定する、他の電気通信設備の損傷又は機能の障害の防止における｢保安装置｣について述べたものである。 □内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。 (２点×２＝４点)落雷又は強電流電線との混触により線路設備に発生した異常電圧及び異常電流によって接続設備を損傷するおそれのある場合は、交流５００ボルト以下で動作する避雷器及び (ア)アンペア以下で動作するヒューズ若しくは (イ) ミリアンペア以下で動作する熱線輪からなる保安装置又はこれと同等の保安機能を有する装置が事業用電気通信設備と接続設備を接続する点又はその近傍に設置されていなければならない。</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① ７</p>\n<p class=\"opt\">② １５</p>\n<p class=\"opt\">③ ７０</p>\n<p class=\"opt\">④ １３０</p>\n<p class=\"opt\">⑤ ３００</p>\n<p class=\"opt\">⑥ ４００</p>\n<p class=\"opt\">⑦ ５００</p>\n<p class=\"opt\">⑧ ６００</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話用設備の｢監視信号受信条件｣で定める監視信号及び｢監視信号送出条件｣で定める監視信号について述べた次のＡ～Ｃの文章は、 (ウ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 発信側の端末設備等において通話を終了するため、当該端末設備等の直流回路を開いて１メガオーム以上の直流抵抗値を形成することにより送出する監視信号は、終話信号という。</p>\n<p class=\"stmt\">Ｂ 着信側の端末設備等において通話を終了するため、当該端末設備等の直流回路を開いて１メガオーム以上の直流抵抗値を形成することにより送出する監視信号は、切断信号という。</p>\n<p class=\"stmt\">Ｃ 着信側の端末設備等が送出する端末応答信号を受信したとき、発信側の端末設備等に対して、信号極性を反転することにより送出する監視信号は、課金信号という。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 事業用電気通信設備規則に規定する、電気通信回線設備を設置する電気通信事業者の電気通信事業の用に供する電気通信設備の音声伝送役務の提供の用に供する電気通信設備におけるアナログ電話相当の機能を有するインターネットプロトコル電話用設備の｢基本機能｣について述べた次の文章のうち、誤っているものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 電気通信番号を認識すること。</p>\n<p class=\"opt\">② ファクシミリによる送受信が正常に行えること。</p>\n<p class=\"opt\">③ 発信側の端末設備等からの発信を認識し、着信側の端末設備等に通知すること。</p>\n<p class=\"opt\">④ 着信側の端末設備等の応答を認識し、発信側の端末設備等に通知すること。</p>\n<p class=\"opt\">⑤ 通信の終了を通知すること。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 端末設備等規則に規定する｢絶縁抵抗等｣について述べた次のＡ～Ｃの文章は、 (オ) 。(４点)きょう</p>\n<p class=\"stmt\">Ａ 端末設備の機器の金属製の台及び筐体は、接地抵抗が１００オーム以下となるように接地しなければならない。ただし、安全な場所に危険のないように設置する場合にあっては、この限りでない。きょう</p>\n<p class=\"stmt\">Ｂ 端末設備の機器は、その電源回路と筐体及びその電源回路と事業用電気通信設備との間において、使用電圧が２５０ボルト以下の場合にあっては、２メガオーム以上の絶縁抵抗を有しなければならない。きょう</p>\n<p class=\"stmt\">Ｃ 端末設備の機器は、その電源回路と筐体及びその電源回路と事業用電気通信設備との間において、使用電圧が２５０ボルトを超える場合にあっては、２,５００ボルトの電圧を連続して１０分間加えたときこれに耐える絶縁耐力を有しなければならない。</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 端末設備等規則に規定する、固定電話端末の｢基本的機能｣、｢発信の機能｣又は｢電気的条件等｣について述べた次の文章のうち、正しいものは、 (カ) である。ただし、第３２条の９に規定する特殊な固定電話端末は考慮しないものとする。 (４点)</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① 発信又は応答を行う場合にあっては、呼の設定を行うためのメッセージ又は当該メッセージに対応するためのメッセージを確認するものであること。</p>\n<p class=\"opt\">② 通信を終了する場合にあっては、呼の切断、解放若しくは取消しを行うためのメッセージ又は当該メッセージに対応するためのメッセージを確認するものであること。</p>\n<p class=\"opt\">③ 発信に際して相手の端末設備からの応答を自動的に確認する場合にあっては、電気通信回線からの応答が確認できない場合呼の設定を行うためのメッセージ送出終了後２分以内に通信終了メッセージを送出するものであること。</p>\n<p class=\"opt\">④ 自動再発信(応答のない相手に対し引き続いて繰り返し自動的に行う発信をいう。)を行う場合(自動再発信の回数が１５回以内の場合を除く。)にあっては、その回数は最初の発信から２分間に３回以内であること。この場合において、最初の発信から２分を超えて行われる発信は、別の発信とみなす。なお、この規定は、火災、盗難その他の非常の場合にあっては、適用しない。</p>\n<p class=\"opt\">⑤ 固定電話端末は、電気通信回線に対して交流の電圧を加えるものであってはならない。ただし、総務大臣が別に告示する条件において交流重畳が認められる場合にあっては、この限りでない。</p>"}], "5": [{"tag": "R4-1", "title": "令和４年度 第１回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 有線電気通信法に規定する｢目的｣、｢本邦外にわたる有線電気通信設備｣及び｢設備の検査等｣について述べた次のＡ～Ｃの文章は、 (ア) 。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信法は、有線電気通信設備の設置及び使用を規律し、有線電気通信に関する秩序を確立することによって、電気通信の健全な発展に寄与することを目的とする。</p>\n<p class=\"stmt\">Ｂ 本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者がその事業の用に供する設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、期間を定めて臨時に設置するときは、この限りでない。</p>\n<p class=\"stmt\">Ｃ 総務大臣は、有線電気通信法の施行に必要な限度において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。</p>\n<p class=\"cg-h\">&lt;(ア)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 次の(ⅰ)、(ⅱ)の文章は、有線電気通信法に規定する｢有線電気通信設備の届出｣について述べたものである。 □内の(イ)、(ウ)に最も適したものを、下記の解答群から選び、その番号を記せ。ただし、 内の同じ記号は、同じ解答を示す。 (２点×２＝４点)</p>\n<p class=\"item\">(ⅰ) 有線電気通信設備を設置しようとする者は、有線電気通信の方式の別、設備の (イ)及び設備の概要を記載した書類を添えて、設置の工事の開始の日の２週間前まで(工事を要しないときは、設置の日から２週間以内)に、その旨を総務大臣に届け出なければならない。</p>\n<p class=\"item\">(ⅱ) 設置の届出をする者は、その届出に係る有線電気通信設備が、他人の通信の用に供されるもの(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の方式の別、設備の (イ) 及び設備の概要のほか、その (ウ) その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"cg-h\">&lt;(イ)、(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 料金体系</p>\n<p class=\"opt\">② 提供条件</p>\n<p class=\"opt\">③ 設置の場所</p>\n<p class=\"opt\">④ 工事の実施体制</p>\n<p class=\"opt\">⑤ 技術的性能</p>\n<p class=\"opt\">⑥ 運用方法</p>\n<p class=\"opt\">⑦ 使用の態様</p>\n<p class=\"opt\">⑧ 接続の技術基準</p>\n<p class=\"opt\">⑨ 接続構成</p>\n<p class=\"opt\">⑩ 設置の目的</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語について述べた次の文章のうち、正しいものは、 (エ)である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 離隔距離とは、線路と他の物体(線路を含む。)とが接近し又は交差する場合において、相互に通信の妨げにならないこれらの物の間の最短距離をいう。</p>\n<p class=\"opt\">② 支持物とは、電柱、支線、つり線その他電線又は強電流電線を支持するための工作物であって、総務省令で定める絶縁耐力を有するものをいう。</p>\n<p class=\"opt\">③ ケーブルとは、光ファイバ並びに光ファイバ以外の絶縁物及び保護物で被覆されている電線をいい、絶縁電線とは、絶縁物のみで被覆されている電線をいう。</p>\n<p class=\"opt\">④ 線路とは、送信の場所と受信の場所との間に設置されている電線及び強電流電線をいい、これらを支持し、又は保蔵するための工作物を含む。</p>\n<p class=\"opt\">⑤ 電線とは、有線電気通信(送信の場所と受信の場所との間の線条その他の導体を利用して、電磁的方式により信号を行うことを含む。)を行うための導体(絶縁物又は保護物で被覆されている場合は、これらの物を含む。)をいい、強電流電線に重畳される通信回線に係るものを含む。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢架空電線の支持物｣又は｢屋内電線｣について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 架空電線の支持物には、取扱者が昇降に使用する足場金具等を地表上２.５メートル未満の高さに取り付けてはならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">② 架空電線の支持物は、その架空電線が他人の設置した架空電線又は架空強電流電線と交差し、又は接近するときは、他人の設置した架空電線又は架空強電流電線を挟み、又はこれらの間を通ることがないようにしなければならない。ただし、総務大臣の承諾を得たとき、又は人体に危害を及ぼし、若しくは物件に損傷を与えないように必要な設備をしたときは、この限りでない。</p>\n<p class=\"opt\">③ 屋内電線(光ファイバを除く。)と大地との間及び屋内電線相互間の絶縁抵抗は、直流１００ボルトの電圧で測定した値で、２メグオーム以上でなければならない。</p>\n<p class=\"opt\">④ 屋内電線は、屋内強電流電線との離隔距離が６０センチメートル以下となるときは、総務省令で定めるところによらなければ、設置してはならない。</p>\n<p class=\"opt\">⑤ 道路上に設置する電柱、架空電線と架空強電流電線とを架設する電柱その他の総務省令で定める電柱は、総務省令で定める安全係数をもたなければならない。この安全係数は、その電柱に架設する物の重量、電線の不平均張力及び総務省令で定める風圧荷重が加わるものとして計算するものとする。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則に規定する｢架空電線の高さ｣について述べた次のＡ～Ｃの文章は、(カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 架空電線の高さは、架空電線が河川を横断するときは、舟行に支障を及ぼすおそれがない高さでなければならない。</p>\n<p class=\"stmt\">Ｂ 架空電線の高さは、架空電線が横断歩道橋の上にあるときは、その路面から２.５メートル以上でなければならない。</p>\n<p class=\"stmt\">Ｃ 架空電線の高さは、架空電線が道路上にあるときは、横断歩道橋の上にあるときを除き、路面から５メートル(交通に支障を及ぼすおそれが少ない場合で工事上やむを得ないときは、歩道と車道との区別がある道路の歩道上においては、２.５メートル、その他の道路上においては、４.５メートル)以上でなければならない。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R4-2", "title": "令和４年度 第２回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、有線電気通信法に規定する｢有線電気通信設備の届出｣について述べたものである。□内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)有線電気通信設備の設置の届出をする者は、その届出に係る有線電気通信設備が次の(ⅰ)～</p>\n<p class=\"item\">(ⅲ)に掲げる設備(総務省令で定めるものを除く。)に該当するものであるときは、有線電気通信の方式の別、設備の設置の場所及び (ア) のほか、その使用の態様その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"item\">(ⅰ) ２人以上の者が共同して設置するもの</p>\n<p class=\"item\">(ⅱ) 他人(電気通信事業者を除く。)の設置した有線電気通信設備と相互に接続されるもの</p>\n<p class=\"item\">(ⅲ) 他人の (イ) もの</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 工事仕様書</p>\n<p class=\"opt\">② 設備と近接する</p>\n<p class=\"opt\">③ 設置の目的</p>\n<p class=\"opt\">④ 接続の方法</p>\n<p class=\"opt\">⑤ 設備の概要</p>\n<p class=\"opt\">⑥ 運用に委ねる</p>\n<p class=\"opt\">⑦ 建造物に設置する</p>\n<p class=\"opt\">⑧ 工事の期間</p>\n<p class=\"opt\">⑨ 設備に重畳する</p>\n<p class=\"opt\">⑩ 通信の用に供される</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 有線電気通信法に規定する｢目的｣、｢技術基準｣、｢非常事態における通信の確保｣又は｢本邦外にわたる有線電気通信設備｣について述べた次の文章のうち、誤っているものは、 (ウ) である。(４点)</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① 有線電気通信法は、有線電気通信設備の設置及び使用を規律し、有線電気通信に関する秩序を確立することによって、公共の福祉の増進に寄与することを目的とする。</p>\n<p class=\"opt\">② 有線電気通信設備(政令で定めるものを除く。)の技術基準により確保されるべき事項の一つとして、有線電気通信設備は、他人の設置する有線電気通信設備に妨害を与えないようにすることがある。</p>\n<p class=\"opt\">③ 総務大臣は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、有線電気通信設備を設置した者に対し、災害の予防若しくは救援、交通、通信若しくは電力の供給の確保若しくは秩序の維持のために必要な通信を行い、又はこれらの通信を行うためその有線電気通信設備を改造・修理させ、若しくはこれで他の有線電気通信設備を代替することを命ずることができる。</p>\n<p class=\"opt\">④ 本邦内の場所と本邦外の場所との間の有線電気通信設備は、電気通信事業者がその事業の用に供する設備として設置する場合を除き、設置してはならない。ただし、特別の事由がある場合において、総務大臣の許可を受けたときは、この限りでない。</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令又は有線電気通信設備令施行規則に規定する用語について述べた次の文章のうち、正しいものは、 (エ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① 低周波とは、周波数が２００ヘルツ以下の電磁波をいい、音声周波とは、周波数が２００ヘルツを超え、３,５００ヘルツ以下の電磁波をいう。</p>\n<p class=\"opt\">② 平衡度とは、通信回線の中性点と大地との間に起電力を加えた場合におけるこれらの間に生ずる電圧と通信回線の端子間に生ずる電圧との差をデシベルで表わしたものをいう。</p>\n<p class=\"opt\">③ 強電流電線とは、強電流電気の伝送を行うための導体をいい、絶縁物又は保護物で被覆されている場合は、これらの物を除く。</p>\n<p class=\"opt\">④ 絶縁電線とは、絶縁物及び保護物で被覆されている電線をいう。</p>\n<p class=\"opt\">⑤ 絶対レベルとは、一の実効電力の１ミリワットに対する比を絶対値で表わしたものをいう。</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢通信回線の平衡度｣、｢線路の電圧及び通信回線の電力｣、｢地中電線｣などについて述べた次の文章のうち、誤っているものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 通信回線(導体が光ファイバであるものを除く。)の平衡度は、１,０００ヘルツの交流において３４デシベル以上でなければならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">② 通信回線(導体が光ファイバであるものを除く。)の線路の電圧は、４８ボルト以下でなければならない。ただし、電線として絶縁電線を使用し、かつ、他人の設置する有線電気通信設備に損傷を与えるおそれがないときは、この限りでない。</p>\n<p class=\"opt\">③ 地中電線は、地中強電流電線との離隔距離が３０センチメートル(その地中強電流電線の電圧が７,０００ボルトを超えるものであるときは、６０センチメートル)以下となるように設置するときは、総務省令で定めるところによらなければならない。</p>\n<p class=\"opt\">④ 地中電線の金属製の被覆又は管路は、地中強電流電線の金属製の被覆又は管路と電気的に接続してはならない。但し、電気鉄道又は電気軌道の帰線から漏れる直流の電流による腐しょくを防止するため接続する場合であって、総務省令で定める設備をする場合は、この限りでない。</p>\n<p class=\"opt\">⑤ 有線電気通信設備は、総務省令で定めるところにより、絶縁機能、避雷機能その他の保安機能をもたなければならない。</p>\n<p class=\"sub-h\" data-sub=\"５\">(５) 有線電気通信設備令施行規則の｢屋内電線と屋内強電流電線との交差又は接近｣において、屋内電線が低圧の屋内強電流電線と交差し、又は３０センチメートル以内に接近する場合の設置の方法について、屋内電線と屋内強電流電線とを同一の管等に収めて設置しないことと規定されているが、その適用が除外される場合について述べた次のＡ～Ｃの文章は、 (カ) 。 (４点)</p>\n<p class=\"stmt\">Ａ 屋内電線が、絶縁電線であるとき。</p>\n<p class=\"stmt\">Ｂ 屋内電線が、難燃性の被覆を有するケーブルであるとき。</p>\n<p class=\"stmt\">Ｃ 屋内電線と屋内強電流電線との間に堅ろうな隔壁を設け、かつ、金属製部分に特別保安接地工事を施したダクト又はボックスの中に屋内電線と屋内強電流電線を収めて設置するとき。</p>\n<p class=\"cg-h\">&lt;(カ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>"}, {"tag": "R5-1", "title": "令和５年度 第１回", "html": "<h3 class=\"q-h\">問５ 次の各問いは、｢有線電気通信法｣、｢有線電気通信設備令｣又は｢有線電気通信設備令施行規則｣に規定する内容に関するものである。同法、同令又は同規則の規定に照らして、 □内の(ア)～(カ)に最も適したものを、それぞれの解答群から選び、その番号を記せ。 (小計２０点)</h3>\n<p class=\"sub-h\" data-sub=\"１\">(１) 次の文章は、有線電気通信法に規定する｢非常事態における通信の確保｣について述べたものである。 □内の(ア)、(イ)に最も適したものを、下記の解答群から選び、その番号を記せ。(２点×２＝４点)総務大臣は、天災、事変その他の非常事態が発生し、又は発生するおそれがあるときは、有線電気通信設備を設置した者に対し、災害の予防若しくは救援、交通、通信若しくは電力の供給の確保若しくは (ア) のために必要な通信を行い、又はこれらの通信を行うためその有線電気通信設備を (イ) させ、若しくはこれを他の有線電気通信設備に接続すべきことを命ずることができる。</p>\n<p class=\"cg-h\">&lt;(ア)、(イ)の解答群&gt;</p>\n<p class=\"opt\">① 安定的に稼働</p>\n<p class=\"opt\">② 公共の福祉</p>\n<p class=\"opt\">③ 秩序の維持</p>\n<p class=\"opt\">④ 円滑な提供</p>\n<p class=\"opt\">⑤ 緊急的に整備</p>\n<p class=\"opt\">⑥ 人命の保護</p>\n<p class=\"opt\">⑦ 公衆に開放</p>\n<p class=\"opt\">⑧ 無償で提供</p>\n<p class=\"opt\">⑨ 利用者の利益の保護</p>\n<p class=\"opt\">⑩ 他の者に使用</p>\n<p class=\"sub-h\" data-sub=\"２\">(２) 有線電気通信法に規定する｢有線電気通信設備の届出｣、｢設備の検査等｣及び｢設備の改善等の措置｣について述べた次のＡ～Ｃの文章は、 (ウ) 。ただし、適用除外規定は考慮しないものとする。 (４点)</p>\n<p class=\"stmt\">Ａ 有線電気通信設備(その設置について総務大臣に届け出る必要のないものを除く。)の設置の届出をする者は、その届出に係る有線電気通信設備が、他人の通信の用に供されるもの(総務省令で定めるものを除く。)であるときは、有線電気通信の方式の別、設備の設置の場所及び設備の概要のほか、その使用の態様その他総務省令で定める事項を併せて届け出なければならない。</p>\n<p class=\"stmt\">Ｂ 総務大臣は、有線電気通信法の施行に必要な限度において、有線電気通信設備を設置した者からその設備に関する報告を徴し、又はその職員に、その事務所、営業所、工場若しくは事業場に立ち入り、その設備若しくは帳簿書類を検査させることができる。</p>\n<p class=\"stmt\">Ｃ 総務大臣は、有線電気通信設備を設置した者に対し、その設備が有線電気通信法の規定に基づく政令で定める技術基準に適合しないため他人の設置する有線電気通信設備に妨害を与え、又は人体に危害を及ぼし、若しくは物件に損傷を与えると認めるときは、その妨害、危害又は損傷の防止又は除去のため必要な限度において、その設備の使用の停止又は改造、修理その他の措置を命ずることができる。</p>\n<p class=\"cg-h\">&lt;(ウ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"３\">(３) 有線電気通信設備令に規定する用語について述べた次のＡ～Ｃの文章は、 (エ) 。(４点)</p>\n<p class=\"stmt\">Ａ 強電流電線とは、強電流電気の伝送を行うための導体(絶縁物又は保護物で被覆されている場合は、これらの物を含む。)をいう。</p>\n<p class=\"stmt\">Ｂ 支持物とは、電柱、支線、つり線その他電線又は強電流電線を支持するための工作物をいう。</p>\n<p class=\"stmt\">Ｃ 音声周波とは、周波数が３００ヘルツを超え、２,５００ヘルツ以下の電磁波をいい、高周波とは、周波数が２,５００ヘルツを超える電磁波をいう。</p>\n<p class=\"cg-h\">&lt;(エ)の解答群&gt;</p>\n<p class=\"opt\">① Ａのみ正しい</p>\n<p class=\"opt\">② Ｂのみ正しい</p>\n<p class=\"opt\">③ Ｃのみ正しい</p>\n<p class=\"opt\">④ Ａ、Ｂが正しい</p>\n<p class=\"opt\">⑤ Ａ、Ｃが正しい</p>\n<p class=\"opt\">⑥ Ｂ、Ｃが正しい</p>\n<p class=\"opt\">⑦ Ａ、Ｂ、Ｃいずれも正しい</p>\n<p class=\"opt\">⑧ Ａ、Ｂ、Ｃいずれも正しくない</p>\n<p class=\"sub-h\" data-sub=\"４\">(４) 有線電気通信設備令に規定する｢架空電線の支持物｣、｢使用可能な電線の種類｣又は｢屋内電線｣について述べた次の文章のうち、正しいものは、 (オ) である。 (４点)</p>\n<p class=\"cg-h\">&lt;(オ)の解答群&gt;</p>\n<p class=\"opt\">① 架空電線の支持物には、取扱者が昇降に使用する足場金具等を地表上１.８メートル未満の高さに取り付けてはならない。ただし、総務省令で定める場合は、この限りでない。</p>\n<p class=\"opt\">② 道路上に設置する電柱、架空電線と架空強電流電線とを架設する電柱その他の総務省令で定める電柱は、総務省令で定める安全係数をもたなければならない。この安全係数は、その電柱に架設する物の重量、電線の不平均張力及び総務省令で定める地震荷重が加わるものと
